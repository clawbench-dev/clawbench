appId: com.xulongzhe.clawbench
productName: ClawBench
executableName: clawbench-desktop
directories:
  output: release
  buildResources: build
extraResources:
  - from: assets/login.html
    to: login.html
  # The floating status capsule's document. main/floating.ts loads it from
  # process.resourcesPath (same placement as login.html), because `tsc` only
  # emits JS — an .html under src/ would never reach dist/.
  - from: assets/floating.html
    to: floating.html
  # The first-run login page renders <img src="logo.png"> next to login.html, so
  # the logo must ship as a sibling resource. Without it the image is broken and
  # the browser falls back to the alt text, which the decorative ring then
  # clips — that is why the page showed a cropped "ClawBenc".
  - from: assets/logo.png
    to: logo.png
  - from: assets/url-utils.js
    to: url-utils.js
  # Full-screen annotation overlay (transparent window over the shared screen).
  # Same placement rule as floating.html: tsc only emits JS, an .html under src/
  # would never reach dist/.
  - from: assets/annotate.html
    to: annotate.html
  # Remote-control helper (Go, pure syscall). Built by scripts/build-input-helper.mjs
  # before every package; present in all platforms' builds so the config stays
  # uniform, but only Windows actually injects input.
  - from: assets/input-helper.exe
    to: input-helper.exe
files:
  - dist/
  - package.json
  - "!**/node_modules/.cache"
win:
  target: dir
  icon: build/icon.png
  # The ClawBench server this app starts by itself (the integrated package,
  # 整合包). Built by scripts/build-server.mjs at prebuild time; see
  # src/main/localServer.ts for the lifecycle.
  #
  # extraFiles, NOT extraResources: it lands at the app root (next to the
  # executable), outside `resources/`. That keeps the thin package's `resources/`
  # from carrying the ~150MB server. The release job zips the integrated package
  # before stripping `server/` for the thin one.
  extraFiles:
    - from: assets/server
      to: server
  # NOTE: do NOT add `signAndEditExecutable: false` here. It was set historically
  # to allow cross-building the Windows package from Linux, but it also skips
  # writing the icon and version metadata into the .exe (electron-builder warns
  # "executable resource editing and code signing skipped"), so the app shipped
  # with the default Electron icon. CI builds Windows on windows-latest, where
  # rcedit runs natively and no workaround is needed — the flag only ever lost
  # information there.
  #
  # For a local Linux cross-build (no wine), pass it on the command line instead:
  #   npx electron-builder --dir --win --x64 -c.win.signAndEditExecutable=false
mac:
  target: dir
  icon: build/icon.icns
  # NO extraFiles here, unlike Windows/Linux. A macOS app bundle is code-signed
  # over its whole tree: putting the server inside `Contents/` and then stripping
  # it for the thin package would invalidate the signature of BOTH packages. The
  # integrated zip therefore carries `server/` as a SIBLING of `ClawBench.app`
  # (inside the `mac-arm64/` wrapper), and localServerPolicy.ts looks one level
  # above the bundle. The bundle itself stays byte-identical to the thin one.
  #
  # TCC usage descriptions. Without these macOS kills the app the moment it asks
  # for the microphone or the screen — and it does so WITHOUT showing a prompt,
  # which makes the failure look like "capture silently does nothing".
  # Screen sharing itself is Windows-only (system audio is loopback-only there),
  # but the microphone prompt is still reachable through voice input.
  extendInfo:
    NSMicrophoneUsageDescription: ClawBench uses the microphone for voice input and live audio sharing.
    NSScreenCaptureUsageDescription: ClawBench captures your screen when you start a live share.
    NSCameraUsageDescription: ClawBench uses the camera when you start a video meeting.
linux:
  target: dir
  icon: build/icon.png
  # Same embedded server; lands next to the executable, like Windows.
  extraFiles:
    - from: assets/server
      to: server
