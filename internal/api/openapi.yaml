  # ── Files ─────────────────────────────────────────────────────────────────
  /api/dir:
    get:
      tags: [Files]
      summary: 列出目录
      description: |
        取代已移除的递归 `/api/files`；相对路径按项目根解析。

        **只服务项目内目录**：项目外（绝对）路径请用 `/api/projects`，它对任意
        绝对目录返回同一套 DirEntry 条目结构。前端据此按路径形态选择端点
        （见 web/src/utils/dirList.ts）。

        条目中的 `ignored` 表示 git 不会跟踪该项（命中 .gitignore 或位于被排除目录下）。
        它只是提示：条目照常返回且可操作，前端仅做灰显。非 git 仓库时恒不出现。
      operationId: dirList
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 目录条目（items 为 DirEntry 数组）

  /api/dir/create:
    post:
      tags: [Files]
      summary: 新建目录
      operationId: dirCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: 结果

  /api/dir/search:
    get:
      tags: [Files]
      summary: 目录搜索（SSE）
      description: |
        Server-Sent Events 流式返回匹配项。OpenAPI 不建模事件流。

        `result` 事件与 `/api/dir` 的 DirEntry 同样带 `ignored` 字段，便于前端统一灰显。

        `path` 为空或相对时按项目根解析；**绝对路径表示项目外目录**，直接
        在配置的根路径下使用（与 `/api/projects` 一致），此时 `result.path`
        返回绝对路径而非项目相对路径。绝对路径会把前导分隔符原样保留——
        去掉后 `/tmp` 会被当成项目内的 `tmp`，静默搜索错误的目录并返回 0 条。
      operationId: dirSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
        - name: recursive
          in: query
          schema:
            type: boolean
        - name: exact
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string

  /api/file/content-search:
    get:
      tags: [Files]
      summary: 文件内容搜索（SSE）
      description: |
        grep 风格的内容搜索，Server-Sent Events 流式返回。OpenAPI 不建模事件流。

        事件序列：每个命中的文件一个 `result` 事件（该文件的所有命中行合并
        在一个事件里），最后一个 `done` 事件。正则非法时发出 `error` 事件而
        非 400 —— EventSource 读不到非 2xx 响应的响应体，用事件才能把原因
        传给用户。

        `result` 事件字段：`name`、`path`、`matches`（每项含 `line`、`text`、
        `ranges`，`ranges` 是 `text` 内的 **rune** 偏移区间，供前端高亮）、
        `total`（该文件命中总数，可能大于 `matches` 长度）、`truncated`
        （命中数超过单文件上限被截断）、`ignored`（git 是否忽略，与
        `/api/dir` 的 DirEntry 语义一致，便于统一灰显）。

        `path` 为空或相对时按项目根解析；**绝对路径表示项目外目录**，此时
        `result.path` 返回绝对路径而非项目相对路径（与 `/api/dir/search`
        一致，绝对路径的前导分隔符原样保留）。

        默认跳过二进制/媒体/压缩包等扩展名、含 NUL 字节的文件、超过 5MiB
        的文件；单文件命中行数上限 200，超长行会在首个命中处开窗截断。
      operationId: contentSearch
      parameters:
        - name: q
          in: query
          required: true
          description: 搜索关键词（正则模式下为正则表达式）
          schema:
            type: string
        - name: path
          in: query
          description: 搜索根目录；相对路径按项目根解析，绝对路径表示项目外目录
          schema:
            type: string
        - name: recursive
          in: query
          description: 是否递归子目录（默认 true）
          schema:
            type: boolean
        - name: regex
          in: query
          description: 是否按正则解释 q（默认 false，即字面量匹配）
          schema:
            type: boolean
        - name: wholeWord
          in: query
          description: 是否全词匹配（\b 包裹；\b 为 ASCII 语义）
          schema:
            type: boolean
        - name: caseSensitive
          in: query
          description: 是否区分大小写（默认 false）
          schema:
            type: boolean
        - name: include
          in: query
          description: 逗号分隔的包含 glob（gitignore 语法，如 `*.ts,**/*.go`）
          schema:
            type: string
        - name: exclude
          in: query
          description: 逗号分隔的排除 glob（gitignore 语法，如 `dist/**,*.min.js`）
          schema:
            type: string
        - name: limit
          in: query
          description: 返回的最大文件数（默认 file_search.display_limit+1，上限 500）
          schema:
            type: integer
      responses:
        "200":
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string

  /api/file/list-tree:
    get:
      tags: [Files]
      summary: 目录树（下载用）
      operationId: fileListTree
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 树形条目

  /api/fs/thumb:
    get:
      tags: [Files]
      summary: 图片缩略图
      description: 按绝对路径服务端缩放（png/jpg/gif），SVG 需回退到壁纸原图端点。
      operationId: fileThumb
      parameters:
        - name: target
          in: query
          required: true
          schema:
            type: string
        - name: w
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: JPEG 缩略图
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  /api/fs/file/{path}:
    get:
      tags: [Files]
      summary: 读取文件内容
      description: |
        返回文本/结构化内容；二进制与不支持类型有专门处理。`{path}` 为项目相对路径。

        可选行窗口（快速预览窗格使用）：传 `lineStart`/`lineEnd` 时只返回该区间
        （1-based，闭区间）的行，并附带文件总行数 `totalLines`，避免大文件整体传输。
        行窗口只对文本文件生效；`forceText` / 二进制嗅探路径会忽略窗口并返回完整
        净化内容。窗口最多 `maxWindowLines` 行。

        非法区间（0 / 负数 / 非整数 / `lineEnd < lineStart` / 只传 `lineEnd`）一律返回
        400 `InvalidLineRange`，**与文件类型无关**——二进制文件同样先校验区间。
      operationId: fileGet
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - name: target
          in: query
          description: 绝对路径（外部文件）。
          schema:
            type: string
        - name: forceText
          in: query
          description: 置 1 时强制按文本返回。
          schema:
            type: string
        - name: lineStart
          in: query
          description: 行窗口起始行（1-based，含）。设置后仅返回该区间内容；单独使用时窗口即为该行。
          schema:
            type: integer
            minimum: 1
        - name: lineEnd
          in: query
          description: 行窗口结束行（1-based，含），须 >= lineStart。必须与 lineStart 同时提供，省略时窗口为单行 lineStart。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: |
            文件内容。带行窗口时额外返回 `totalLines`（文件总行数）、
            `windowStart`/`windowEnd`（本次返回内容覆盖的行区间，`windowEnd < windowStart`
            表示未取到任何行，如起始行超出文件末尾）、`windowTruncated`（是否因窗口上限被截断）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  name:
                    type: string
                  path:
                    type: string
                  supported:
                    type: boolean
                  isBinary:
                    type: boolean
                  truncated:
                    type: boolean
                  size:
                    type: integer
                  subtype:
                    type: string
                  specJson:
                    type: string
                  linkTarget:
                    type: string
                  isSymlink:
                    type: boolean
                  totalLines:
                    type: integer
                    description: 文件总行数（仅行窗口响应）。
                  windowStart:
                    type: integer
                    description: 返回内容起始行（1-based，含）。
                  windowEnd:
                    type: integer
                    description: |
                      返回内容结束行（1-based，含）。小于 windowStart 表示未取到任何行
                      （如起始行超出文件末尾）。该字段始终返回，便于区分「空窗口」与「无窗口元数据」。
                  windowTruncated:
                    type: boolean
                    description: 是否因窗口字节上限被截断（如存在超长行）。
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/fs/raw/{path}:
    get:
      tags: [Files]
      summary: 读取文件原始字节
      description: 供图片/PDF/音视频等直接渲染。项目相对路径走 URL 路径，绝对路径走 `?target=`。
      operationId: localFileGet
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - name: target
