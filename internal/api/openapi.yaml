      tags: [Terminal]
      summary: 新建终端快捷指令
      operationId: terminalQuickCommandsCreate
      responses:
        "200":
          description: 结果
    put:
      tags: [Terminal]
      summary: 批量重排终端快捷指令
      operationId: terminalQuickCommandsReorder
      responses:
        "200":
          description: 结果

  /api/terminal/quick-commands/{id}:
    put:
      tags: [Terminal]
      summary: 更新终端快捷指令
      operationId: terminalQuickCommandUpdate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 结果
    delete:
      tags: [Terminal]
      summary: 删除终端快捷指令
      operationId: terminalQuickCommandDelete
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 结果

  /api/terminal/key-config:
    get:
      tags: [Terminal]
      summary: 读取终端按键配置
      operationId: terminalKeyConfigGet
      parameters:
        - name: type
          in: query
          required: true
          description: 配置类型，`key`（键位）或 `symbol`（符号）。
          schema:
            type: string
            enum: [key, symbol]
      responses:
        "200":
          description: 按键配置
    put:
      tags: [Terminal]
      summary: 更新终端按键配置
      operationId: terminalKeyConfigPut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [key, symbol]
                items:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: 结果

  # ── Tasks ─────────────────────────────────────────────────────────────────
  /api/tasks:
    get:
      tags: [Tasks]
      summary: 任务列表
      operationId: tasksList
      responses:
        "200":
          description: 任务列表
    post:
      tags: [Tasks]
      summary: 新建任务
      operationId: tasksCreate
      description: |
        创建任务。两种触发模式由 `trigger_mode` 决定：

        - `cron`（默认）：由 `cron_expr` 驱动，必填。
        - `event`：由 Forge（GitHub/GitLab）事件驱动，不需要 `cron_expr`，
          但必须提供 `event_types`（逗号分隔，且至少一个）。

        `event_types` 合法取值：`issue.opened`、`issue.closed`、`issue.reopened`、
        `issue.commented`、`pr.opened`、`pr.closed`、`pr.merged`、`pr.reopened`、
        `pr.commented`、`pipeline_done`。历史拼写（不带 `issue.`/`pr.` 前缀）仍被接受。

        `pipeline_done` 是**仓库级**事件（CI 运行完成），不属于议题或合并请求，
        因此用**裸键**订阅；`pr.pipeline_done` 仍被接受（历史拼写，避免既有任务
        编辑时被拒）但不再作为可选项展示。`issue.pipeline_done` 始终非法。
        成功与失败都会触发；`cancelled`/`skipped` 不会。

        **cron 表达式**按服务器本地时区解释（5 字段，支持 `@daily` 等描述符）。
        没有单独的 cron 校验端点：非法表达式在创建时返回 400，这是唯一的验证方式。

        **`trigger_mode=event` 的额外语义**（与 `cron` 不同，配置时务必知晓）：

        - `repeat_mode` 与 `max_runs` 被忽略：按事件触发时不参与 cron 完成语义，
          每次匹配到事件都会执行，也不会因次数耗尽而停止。停止需 `pause` 或删除。
        - 任务**始终监听其项目绑定的仓库**（见 `GET /api/forge/binding`），
          没有按任务指定仓库的参数。项目未绑定仓库时事件不匹配，任务静默不执行
          （创建时前端会给出警告，但仍允许保存）。
        - 由**凭据账号自身**产生的动作（例如 AI 用该账号创建 PR）不触发事件，
          以防 AI 的写入自我触发形成循环。因此按事件触发时不会被自己创建的内容触发。
          **`pipeline_done` 是例外**：流水线成败不是用户主动发起的动作，所以即使是
          自己触发的运行也会触发任务。事件上下文会注入 `是否自身触发`（`是`/`否`），
          由 prompt 自行决定是否行动。
        - 触发时事件上下文（事件类型、仓库、编号、标题、链接、作者、状态、
          评论内容、流水线状态/链接等）会**自动前置**到 `prompt` 之前，无需在
          prompt 里写占位符。流水线事件没有编号，因此不注入「条目」一行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, agent_id, prompt]
              properties:
                name:
                  type: string
                  description: 任务名（必填）。
                cron_expr:
                  type: string
                  description: 5 字段 cron 表达式。`trigger_mode=cron` 时必填。
                agent_id:
                  type: string
                  description: 执行任务的 agent ID（必填）。
                prompt:
                  type: string
                  description: 每次执行传给 AI 的提示词（必填）。
                repeat_mode:
                  type: string
                  enum: [once, limited, unlimited]
                  description: 重复模式，默认 `unlimited`。`trigger_mode=event` 时忽略此字段。
                max_runs:
                  type: integer
                  description: 最大执行次数，`repeat_mode=limited` 时必填且需 > 0。`trigger_mode=event` 时忽略此字段。
                session_id:
                  type: string
                  description: 预留字段，当前不生效。
                trigger_mode:
                  type: string
                  enum: [cron, event]
                  description: 触发模式，默认 `cron`。
                event_types:
                  type: string
                  description: 逗号分隔的事件订阅，`trigger_mode=event` 时必填。
                script:
                  type: string
                  description: |
                    可选预执行脚本，AI 调用前执行，工作目录为项目路径；仅 cron 任务生效。
                    退出码 0 且无输出 → 跳过 AI 且不发通知；有输出或非 0/超时 → 注入 prompt 后照常调用 AI。
                script_timeout:
                  type: integer
                  minimum: 0
                  description: |
                    脚本超时秒数；0 表示默认 300 秒。负数为非法值，返回 400
                    `TaskScriptTimeoutInvalid`。
      responses:
        "200":
          description: 新任务

  /api/tasks/{id}:
    get:
      tags: [Tasks]
      summary: 任务详情
      operationId: taskGet
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 任务详情
    put:
      tags: [Tasks]
      summary: 更新任务 / 删除执行记录
      description: |
        更新任务字段，并承载多种动作（`action`）：`update`、`pause`、`resume`、
        `read`、`trigger`、`cancel`、`deleteExecution`、`deleteAllExecutions`。
        删除执行记录走 `action: "deleteExecution"` + `executionId`（字符串）删除单条，
        或 `action: "deleteAllExecutions"` 清空该任务执行历史。
        **注意**：`trigger`（手动立即执行一次）对 `trigger_mode=event` 的任务不适用，
        返回 409 `TaskEventTriggerUnsupported`——事件任务的 prompt 依赖触发时注入的
        事件上下文（标题、链接、作者等字段），手动执行没有事件可注入，只会跑出
        字段未替换的无意义结果。事件任务需等待匹配的 Forge 事件触发。
        **注意**：子路径不会被父资源兜底。对 `/api/tasks/{id}/executions` 发 PUT
        返回 405，未知子路径（如 `/api/tasks/{id}/bogus`）返回 404，均不会更新任务。
      operationId: taskUpdate
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [update, pause, resume, read, trigger, cancel, deleteExecution, deleteAllExecutions]
                executionId:
                  type: string
                  description: 仅 `deleteExecution` 需要（字符串形式）。
                script:
                  type: string
                  description: |
                    可选预执行脚本（仅 cron）。`action=update` 时生效。
                    **省略该字段表示保持不变**（与 `name` / `prompt` 等一致的部分更新语义）；
                    传空字符串表示清除脚本。
                script_timeout:
                  type: integer
                  minimum: 0
                  description: |
                    脚本超时秒数；0 表示默认 300 秒。`action=update` 时生效。
                    省略该字段表示保持不变。负数为非法值，返回 400 `TaskScriptTimeoutInvalid`。
      responses:
        "200":
          description: 结果
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Tasks]
      summary: 删除任务
      description: |
        删除整个任务（含其执行历史）。仅作用于 `/api/tasks/{id}` 本身；
        子路径不会被兜底——对 `/api/tasks/{id}/executions` 发 DELETE 返回 405，
        对未知子路径返回 404，都不会删除任务。
      operationId: taskDelete
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 结果

  /api/tasks/{id}/executions:
    get:
      tags: [Tasks]
      summary: 任务执行历史
      description: |
        该路径仅支持 GET。其他方法一律 405，不会落到父任务操作上。
        删除执行记录请用 `PUT /api/tasks/{id}` 的 `action: "deleteExecution"` 或
        `action: "deleteAllExecutions"`。
      operationId: taskExecutions
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          description: 游标；需与 `cursor_id` 同时提供才生效。
          schema:
            type: string
        - name: cursor_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 执行记录

  /api/tasks/{id}/executions/{execId}/continue:
    get:
      tags: [Tasks]
      summary: 查询续接会话是否存在
      description: 返回 `{exists, sessionId}`，供前端决定是「继续」还是「新建」。
      operationId: taskExecutionContinueCheck
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: execId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 存在性
    post:
      tags: [Tasks]
      summary: 以某次执行为起点继续对话
      operationId: taskExecutionContinue
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: execId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 结果

  # ── RAG ───────────────────────────────────────────────────────────────────
  /api/rag/search:
    post:
      tags: [RAG]
      summary: 语义 / 全文混合搜索
      description: |
        搜索历史对话（排除 thinking 与 tool_use 块）。
        项目范围由项目 Cookie 决定：Cookie 值为任意项目路径时只搜该项目，
        不发送 Cookie 时跨全部项目（仅本机 AI 令牌可省略 Cookie）。
      operationId: ragSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 搜索词（必填）。
                limit:
                  type: integer
                backend:
                  type: string
                role:
                  type: string
                session_id:
                  type: string
                exclude_session_id:
                  type: string
                from:
                  type: string
                to:
                  type: string
      responses:
        "200":
          description: 匹配分块

  /api/rag/message:
    get:
      tags: [RAG]
      summary: 按 ID 取完整消息
      operationId: ragMessage
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 完整消息

  /api/rag/session:
    get:
      tags: [RAG]
      summary: 取会话全部消息
      operationId: ragSession
      parameters:
        - name: id
          in: query
          required: true
          description: 会话 ID。
          schema:
            type: string
      responses:
        "200":
          description: 会话消息

  /api/rag/status:
    get:
      tags: [RAG]
      summary: RAG 索引状态
      operationId: ragStatus
      responses:
        "200":
          description: 状态

  /api/rag/message-index-status:
    get:
      tags: [RAG]
      summary: 消息索引状态
      operationId: ragMessageIndexStatus
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 索引状态

  /api/rag/message/summarize:
    post:
      tags: [RAG]
      summary: 摘要消息
      operationId: ragMessageSummarize
      description: 为指定消息按需生成阅读摘要并返回。
      parameters:
        - name: id
          in: query
          required: true
          description: 消息数据库 ID。
          schema:
            type: integer
      responses:
        "200":
          description: 摘要结果

  /api/rag/rebuild:
    post:
      tags: [RAG]
      summary: 启动索引重建（异步，三种粒度）
      description: |
        启动后台索引重建，立即返回 202，客户端轮询
        `GET /api/rag/rebuild/status` 获取进度。三种粒度由 `kind` 决定，
        区别在于**丢弃哪一层**，也就是索引器需要重做多少工作：

        - `fts`（默认）：只失效 `chunk_text_segmented`。对现有 chunk 重跑分词，
          不重新分块、不重新嵌入。用于更换分词器/词典，或修复历史数据在分词器
          不可用时入库导致的部分中文检索失效。
        - `vector`：只失效向量。对现有 chunk 重新嵌入，不重新分块、不重新分词。
          用于切换嵌入模型。
        - `full`：全部失效。删除所有 chunk，由索引器从 `chat_history` 重新分块、
          分词、嵌入。**唯一会重新分块的粒度**，因此改了 `rag.chunk_size` /
          `rag.chunk_overlap` 后必须用它才能生效。

        三者的共同实现是「标记失效 → 唤醒索引器」：索引器按有界批次处理，
        因此重建可中断、进度可观测。**绝不内联执行**——仅重新分词在 44k chunk
        的生产库上就需约 149s，远超前端请求超时（10s），内联会让服务端已成功的
        重建在前端显示为失败。

        三种粒度共用同一把互斥（同一时刻只允许一个重建），重复触发返回 409。

        `full` 会重建向量层，若 `rag.vector_enabled` 开启则依赖嵌入服务在线；
        服务不可用时索引器只能写入文本，向量检索会缺失直到服务恢复。

        分词器不可用时 `fts` 与 `full` 返回 503（`RAGSegmenterUnavailable`）
        且**不做任何修改**：此时 `SegmentText` 会退化为原样返回，重建会把已正确
        分词的中文替换为无法切分的原文。
      operationId: ragRebuild
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [fts, vector, full]
                  default: fts
                  description: 重建粒度；省略时按 `fts` 处理。
      responses:
        "202":
          description: 已接受，后台执行中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: 固定为 `accepted`。
                  kind:
                    type: string
                    enum: [fts, vector, full]
                    description: 实际生效的粒度。
        "400":
          description: 未知的 `kind`（`InvalidRequest`）
        "409":
          description: 已有重建任务在执行（`RAGResetInProgress`）
        "503":
          description: RAG 不可用（`RAGNotAvailable`），或分词器未初始化（`RAGSegmenterUnavailable`）

  /api/rag/rebuild/status:
    get:
      tags: [RAG]
      summary: 查询索引重建进度
      description: |
        返回后台重建任务的状态快照，供前端轮询。`status` 为 `idle` /
        `running` / `done` / `error` / `cancelled` / `blocked`；`phase` 为
        `resegmenting`（重分词）、`embedding`（重嵌入）或 `indexing`（全量重建）。
        `blocked` 表示工作无法完成（如向量重建期间嵌入服务不可用），此时不会
        停在 0% 不动。

        `total`/`processed` 由存储层的待处理计数派生，而非本地累加，因此与索引器
        的并发处理进度始终一致。
      operationId: ragRebuildStatus
      responses:
        "200":
          description: 当前状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    enum: ["", fts, vector, full]
                  status:
                    type: string
                    enum: [idle, running, done, error, cancelled, blocked]
                  phase:
                    type: string
                    enum: ["", resegmenting, embedding, indexing]
                  total:
                    type: integer
                    description: 待处理单元总数（chunk 或消息）。
                  processed:
                    type: integer
                    description: 已处理单元数。
                  progress_pct:
                    type: integer
                    description: 进度百分比（0-100）。
                  elapsed_ms:
                    type: integer
                  error:
                    type: string


  /api/rag/session-search:
    post:
      tags: [RAG]
      summary: 会话聚合搜索
      operationId: ragSessionSearch
      description: |
        跨会话聚合搜索并返回命中位置，供会话搜索抽屉高亮。
        `q` 为空时进入「浏览全部」模式：列出该项目下的会话，此时
        `archived`/`session_type`/`sort`/`cursor` 仍然生效。
        浏览态不会混排两类会话：`all`/`chat` 均列出对话会话，只有显式
        `task` 才切换到任务执行会话。
        项目范围由项目 Cookie 决定：Cookie 值为任意项目路径时只搜该项目，
        不发送 Cookie 时跨全部项目（仅本机 AI 令牌可省略 Cookie）。
        同时匹配会话名称与消息内容，名称命中排在内容命中之前；两通道都命中的
        会话只出现一次，且共用同一组过滤。按 `newest`/`oldest` 排序时名称置顶
        不再保留。RAG 未配置时仍可用名称匹配，此时 `mode` 为 `title`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 搜索词；为空时列出会话而非搜索。
                backend:
                  type: string
                role:
                  type: string
                session_id:
                  type: string
                exclude_session_id:
                  type: string
                from:
                  type: string
                to:
                  type: string
                prefer_mode:
                  type: string
                  description: 强制检索模式，如 `fts`；缺省为混合检索。
                archived:
                  type: string
                  enum: [all, active, archived]
                  description: 归档筛选（字符串，非布尔）。默认 `all`。
                session_type:
                  type: string
                  enum: [all, chat, task]
                  description: |
                    会话类型筛选。`task` 对应库中的 `scheduled` 会话（计划任务的
                    单次执行会话），`chat` 为交互式对话。默认 `all`，即不做类型
                    限制（搜索态下两类都会返回）。
                    浏览态（`q` 为空）一次只列出一类：`all`/`chat` 列出对话，
                    `task` 列出任务执行。
                sort:
                  type: string
                  enum: [newest, oldest, relevance]
                  description: 排序方式，默认 `relevance`（未知值也回落到它）。
                cursor:
                  type: string
                  description: 游标时间戳；需与 `cursor_id` 同时提供才生效。
                cursor_id:
                  type: string
      responses:
        "200":
          description: |
            聚合结果。会话带 `title_match`、`title_match_positions`（标题内
            字符级偏移，用于高亮）与 `title_only`（无内容分块，需懒加载首条消息）。

  /api/rag/session-first-message:
    get:
      tags: [RAG]
      summary: 会话首条消息
      operationId: ragSessionFirstMessage
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 首条消息

  # ── Upgrade ───────────────────────────────────────────────────────────────
  /api/upgrade/check:
    get:
      tags: [Upgrade]
      summary: 检查新版本
      description: |
        返回是否有可用升级；`is_docker` 指示容器部署（容器内自升级改为提示）。
        响应字段：`current_version`、`latest_version`、`has_upgrade`、
        `install_writable`、`install_dir`、`is_docker`、`verification_warning`。
        `verification_warning` 是给人看的展示文本，非空表示本次升级有校验无法
        完成，可能同时包含多个原因（发布签名未验证、registry 未提供完整性哈希）。
        `verification_issues` 是同一批问题的稳定标识（排序后的原因码），用于回传
        比对——文本内嵌 registry 地址与错误细节，两次请求可能不同，故不可用于
        比对。前端须在**开始升级前**据此向用户展示并取得确认。
        唯一会中止升级的校验是「下载内容与已知哈希不符」——那是文件损坏或
        下载错误，而非仅仅无法校验。
      operationId: upgradeCheck
      responses:
        "200":
          description: 版本信息

  /api/upgrade/start:
    post:
      tags: [Upgrade]
      summary: 开始升级
      description: |
        请求体可选，字段 `verification_issues`：客户端展示并取得确认的原因码
        指纹（无问题时省略或留空），取自 `/api/upgrade/check` 的同名字段。服务端
        与本次 registry 查询算出的指纹比对，不一致则以 `unverified_not_confirmed`
        拒绝，避免未经确认就安装未校验的版本。
        比对的是原因码而非展示文本：文本内嵌 registry 地址与错误细节，同一情形
        在两次请求间可能渲染不同。
        请求体为空是合法的（表示本次升级无需确认）；请求体非法则返回 400。
      operationId: upgradeStart
      responses:
        "200":
          description: 已开始
        "400":
          description: 请求体非法
        "409":
          description: 已有升级在进行中

  /api/upgrade/status:
    get:
      tags: [Upgrade]
      summary: 升级进度
      operationId: upgradeStatus
      responses:
        "200":
          description: 进度

  # ── Proxy ─────────────────────────────────────────────────────────────────
  /api/proxy/ports:
    get:
      tags: [Proxy]
      summary: 端口转发列表
      operationId: proxyPortsList
      description: |
        返回已注册的端口映射。每项含 `direction` 字段：
        - `forward`（默认，ssh -L）：`port` = 服务器侧目标端口，`localPort` = 客户端监听端口，
          `host` = 服务器侧目标主机。
        - `reverse`（ssh -R）：`port` = 客户端本地待暴露端口，`localPort` = 服务器侧绑定端口，
          `host` = 客户端侧目标主机。

        反向映射的 `active` 表示服务器侧 `127.0.0.1:{localPort}` 是否已由客户端 SSH 会话绑定，
        与正向映射（探测目标端口）的语义不同。
      responses:
        "200":
          description: 端口列表
    post:
      tags: [Proxy]
      summary: 新增端口转发
      operationId: proxyPortsCreate
      description: |
        请求体：`{port, host, name, protocol, direction}`。
        `direction` 为 `forward`（默认）或 `reverse`；非法值按 `forward` 处理。
        返回 `{status, localPort}` —— `localPort` 是实际分配的监听端口（正向为客户端侧，
        反向为服务器侧；端口被占用时会自动改分配，故不要假定与 `port` 相同）。
      responses:
        "200":
          description: 结果
    put:
      tags: [Proxy]
      summary: 更新端口转发
      operationId: proxyPortsUpdate
      description: |
        请求体：`{localPort, port, host, name, protocol, direction}`。
        `localPort` 是不可变键；正向映射在目标端口变化时可能重新分配 `localPort`，
        反向映射的 `localPort`（服务器绑定端口）保持不变。
      responses:
        "200":
          description: 结果
    delete:
      tags: [Proxy]
      summary: 删除端口转发
      operationId: proxyPortsDelete
      description: 查询参数 `port` 为条目的 `localPort`。
      responses:
        "200":
          description: 结果

  /api/proxy/ports/enabled:
    put:
      tags: [Proxy]
      summary: 启停端口转发
      operationId: proxyPortsSetEnabled
      responses:
        "200":
          description: 结果

  /api/proxy/detect:
    get:
      tags: [Proxy]
      summary: 检测端口占用
      operationId: proxyDetect
      responses:
        "200":
          description: 检测结果

  /api/openapi-proxy:
    get:
      tags: [Proxy]
      summary: CORS 代理
      description: |
        为 Swagger UI 的 "Try it out" 转发 API 请求以绕过浏览器 CORS。**透传任意 HTTP 方法**
        （含 OPTIONS 预检与 POST），仅转发 HTTP/HTTPS，过滤 hop-by-hop 头。
        生产可设 `AllowLocalProxy=false` 阻止私有 IP（防 SSRF）。
      operationId: openapiProxy
      responses:
        "200":
          description: 上游响应

  # ── SSH/FRP ───────────────────────────────────────────────────────────────
  /api/ssh/info:
    get:
      tags: [SSH/FRP]
      summary: SSH 隧道最小信息（端口发现）
      description: |
        免鉴权：Android 原生在无 WebView Cookie 时需先发现 SSH 端口，否则回退到
        错误端口导致隧道静默失败。
        仅返回 `enabled` 与 `port`。指纹、用户名、`ssh -L` 命令与连接统计
        已移至需鉴权的 `/api/ssh/info/full`——其中命令会枚举全部转发端口及其
        内网目标主机，等同于内网拓扑，不应提供给匿名调用方。
      operationId: sshInfo
      security: []
      responses:
        "200":
          description: 最小 SSH 信息（enabled、port）

  /api/ssh/info/full:
    get:
      tags: [SSH/FRP]
      summary: SSH 隧道完整信息
      description: |
        需鉴权。供 Web UI 展示隧道命令、指纹与连接统计。
        返回 host、port、username、fingerprint、command、connectionStats。
      operationId: sshInfoFull
      responses:
        "200":
          description: 完整 SSH 信息

  /api/frp/info:
    get:
      tags: [SSH/FRP]
      summary: FRP 完整状态
      description: 需鉴权（会暴露公网 IP）。
      operationId: frpInfo
      responses:
        "200":
          description: FRP 状态

  /api/frp/status:
    get:
      tags: [SSH/FRP]
      summary: FRP 最小状态
      description: 免鉴权，仅返回 enabled + running。
      operationId: frpStatus
      security: []
      responses:
        "200":
          description: 最小状态

  # ── Fonts ─────────────────────────────────────────────────────────────────
  /api/fonts/list:
    get:
      tags: [Fonts]
      summary: 自定义字体列表
      operationId: fontsList
      responses:
        "200":
          description: 字体列表

  /api/fonts/file:
    get:
      tags: [Fonts]
      summary: 读取字体文件
      operationId: fontFile
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 字体字节
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ── Upload ────────────────────────────────────────────────────────────────
  /api/upload/file:
    post:
      tags: [Upload]
      summary: 上传文件
      description: multipart 上传；除 `file` 外还支持 `dir`（目标目录）与 `relpath`（相对路径）。
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传结果

  /api/upload/recent:
    get:
      tags: [Upload]
      summary: 最近上传
      operationId: uploadRecentList
      responses:
        "200":
          description: 最近上传记录
    delete:
      tags: [Upload]
      summary: 删除一条最近上传记录
      description: 按请求体 `{path}` 删除单条记录（不是清空全部；清空需逐条调用）。
      operationId: uploadRecentClear
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果

  /api/share-in/recent:
    get:
      tags: [Upload]
      summary: 最近接收的分享
      operationId: shareInRecentList
      responses:
        "200":
          description: 记录
    delete:
      tags: [Upload]
      summary: 删除一条最近接收记录
      description: 按请求体 `{path}` 删除单条记录（不是清空全部）。
      operationId: shareInRecentClear
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果

  # ── ClientLogs ────────────────────────────────────────────────────────────
  /api/client-log:
    post:
      tags: [ClientLogs]
      summary: 回传客户端日志
      description: |
        需鉴权：这是向服务端文件追加写入的原语，匿名调用者可伪造日志行或反复触发轮转
        以销毁上一代日志。三个客户端上报时均已登录——JS 中继受「调试日志捕获」开关门控
        且仅在已认证的应用内启用，Android 的 `AppLog.startCapture` 由登录后的 WebView
        桥触发，且 WebView Cookie 与它同进程；Electron 主进程中继读取 Electron cookie
        jar 里的会话 Cookie，未登录时静默跳过。
        仅写日志（不可读），汇入 `{LogDir}/logs/client.log`，行内带
        `[js]`/`[android]`/`[electron]` 来源标记；50MiB 轮转到 `.1`。单请求上限 200 条，
        且所有字段均被清洗（转义换行/CR/NUL 并截断）。磁盘由字节上限与文件上限封死，
        故不限流。
      operationId: clientLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/ClientLogEntry"
      responses:
        "200":
          description: 写入条数

  # ── APK ───────────────────────────────────────────────────────────────────
  /api/apk:
    get:
      tags: [APK]
      summary: 下载 Android APK
      description: 免鉴权（用户需先下载安装才能登录）。从 go:embed 读取。
      operationId: apkDownload
      security: []
      responses:
        "200":
          description: APK 字节
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary

  # ── Desktop ───────────────────────────────────────────────────────────────
  /api/desktop/latest:
    get:
      tags: [Desktop]
      summary: 桌面客户端下载信息
      description: |
        免鉴权（下载入口在登录页，此时尚无会话）。

        桌面端与服务端同版本发布，服务端版本即桌面端最新版本，因此本接口
        不查询任何外部服务——只把自身版本号拼成 GitHub Release 资产地址。

        `tag` 为空表示当前是 dev/未打标签构建（无对应 Release），此时
        `downloads` 为空对象，客户端应隐藏下载入口而非报错。

        每个平台给出**候选 URL 列表**：国内优先走 GitHub 代理镜像，直连
        github.com 始终作为最后兜底。镜像为社区服务，不保证可用，故逐个降级。

        `payloads` 是**增量升级**用的载荷包：只含应用自身的 `resources/`
        （约 3MB），不含 Electron 运行时（约 150MB）。客户端把它安装到从
        当前运行版本克隆出的目录上，从而复用运行时。**仅覆盖可安全替换
        `app.asar` 的平台**（linux-x64 / linux-arm64 / win32-x64）；macOS
        因替换会破坏 `.app` 的代码签名封条而不提供该键。键**缺席**（而非空
        数组）即表示该平台只能走全量下载。
      operationId: desktopLatest
      security: []
      responses:
        "200":
          description: 版本与各平台候选下载地址
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: 服务端版本号，即桌面端目标版本
                  tag:
                    type: string
                    description: 对应的 GitHub Release tag；dev 构建为空字符串
                  downloads:
                    type: object
                    description: |
                      平台键（linux-x64 / linux-arm64 / darwin-x64 /
                      darwin-arm64 / win32-x64）到**候选 URL 数组**，
                      按推荐顺序排列，客户端依次尝试。
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  payloads:
                    type: object
                    description: |
                      平台键（仅 linux-x64 / linux-arm64 / win32-x64）到
                      **载荷包候选 URL 数组**。载荷包只含应用代码，客户端
                      据此跳过 Electron 运行时的重复下载。macOS 与未知平台
                      **没有该键**——键缺席即表示只能全量下载。
                    additionalProperties:
                      type: array
                      items:
                        type: string
        "502":
          description: 生成下载信息失败

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: clawbench_session
      description: 登录后下发的会话 Cookie；CLI 使用 `<DataDir>/cookie-token`。
    aiToken:
      type: apiKey
      in: header
      name: X-ClawBench-AI-Token
      description: |
        本机 AI 子进程使用的短时令牌，由内置斜杠命令（`/cb-task` 等）在注入提示词时签发，
        有效期 30 分钟，以 `CookieToken` 做 HMAC 签名。仅接受来自回环地址的请求：
        地址与签名须同时成立。地址单独不再放行——FRP 隧道的 frpc 亦从 `127.0.0.1` 回拨。

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    FilePath:
      name: path
      in: path
      required: true
      description: 项目相对路径（可含 `/`）。
      schema:
        type: string

  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      description: 统一错误体。
      properties:
        error:
          type: string
        code:
          type: string
        msgKey:
          type: string
          description: i18n 消息键，前端据此本地化。
        detail:
          description: 可选的附加细节。
      required: [error]

    FileEntry:
      type: object
      description: |
        附件条目，可为本地文件/目录、**外部链接**（`kind=url`），或**引用**（`kind=quote`）。
        链接条目不参与文件系统校验，且其地址会以
        `[Referenced external link: <url>]` 前缀注入 AI 的 prompt。
        引用条目同样不参与文件系统校验，注入 prompt 的形态取决于是否有 `text`。
        每条引用以**带序号的信封**开头（`[Quote i/n] <label>`，`n` 为本次引用的总条数），
        批注单独一行并以 `[Note] ` 开头：
        - 有 `text`（引用片段）：`[Quote i/n] <label>` + `[Note] <批注>` + 围栏代码块（含引用正文）；
        - 无 `text`（引用整个文件/议题）：`[Quote i/n] <label>` + `[Note] <批注>`，**不渲染围栏**——
          此时是「引用该对象」，由 AI 自行按路径读取；`url` 非空时地址附在标签后（议题/PR）。

        序号与 `[Note]` 标签是必要的：空行在「引用之间 / 标题与批注之间 / 批注与正文之间」三处
        被复用，仅凭版面无法判断一条引用到哪里结束；裸批注行也会被读成游离句子或正文的一部分。
      properties:
        path:
          type: string
          description: 本地路径；`kind=url`/`kind=quote` 时为人类可读标签（如 `owner/repo#123`，引用聊天消息时可为空）。
        isDir:
          type: boolean
        startLine:
          type: integer
        endLine:
          type: integer
        kind:
          type: string
          enum: [file, url, quote]
          description: 缺省为本地文件；`url` 表示外部地址；`quote` 表示引用。
        url:
          type: string
          description: 外部地址，仅当 `kind=url` 时使用；只接受 http(s)。
        id:
          type: string
          description: 仅 `kind=quote`：引用条目的稳定身份，用于发送后修改批注。
        text:
          type: string
          description: 仅 `kind=quote`：引用原文。
        note:
          type: string
          description: 仅 `kind=quote`：用户对该引用的批注。
        language:
          type: string
          description: 仅 `kind=quote`：围栏代码块的语言标识（如 `go`、`issue`）。
        sourceKind:
          type: string
          enum: [file, url, message, selection, terminal]
          description: |
            仅 `kind=quote`：引用来源。`file` 本地文件、`url` 外部链接、`message` 聊天消息、
            `selection` 无来源地址的自由选区、`terminal` 终端选区（与 `selection` 同形，
            分开是为了能标成「终端」而非泛化的「选中内容」）。
            该字段会随 `files` 持久化：`selection`/`terminal` 与 `message` 都没有 path 与 url，
            不存下来刷新后就无法区分，抽屉会把终端引用误标为「聊天消息」。
            缺省（旧数据）由前端按 url/path 推断。
        commitSha:
          type: string
          description: 仅 `kind=quote`：来源 commit（git 历史 / CI 流水线引用），用于跳转回该 commit。
        taskId:
          type: integer
          description: 仅 `kind=quote`：来源计划任务 id，用于跳转回该任务；任务名在 `path` 中。
        sessionId:
          type: string
          description: 仅 `kind=quote`：来源会话 id，用于跳转回该会话；会话名在 `path` 中。
        messageId:
          type: integer
          description: 仅 `kind=quote`：来源消息的 DB id，用于跳转后滚动定位到该条消息。
        executionId:
          type: string
          description: |
            仅 `kind=quote`：来源任务执行 id（任务执行详情页引用），用于跳转回该次运行。

            上列 `commitSha` / `taskId` / `sessionId` / `messageId` / `executionId` 均为**来源定位键**：
            客户端据此跳回源头，AI 提示词也会带上它们（形如 `[Quote 1/1] 名称 (task: 12)`），
            以便 AI 定位源头。它们随 `files` 持久化——引用正文里不含这些信息，不存就无法再跳转。

    GalleryItem:
      type: object
      description: |
        图库中的一张图片，由 `POST /api/theme/local/upload` 返回。
        注意：绝对路径 `abs_path` 不在此响应中，只出现在 `GET /api/config` 的
        `appearance.local.items[]` 里。
      properties:
        file:
          type: string
          description: 存储用的生成文件名。
        name:
          type: string
          description: 上传时的原始文件名。
        uploaded_at:
          type: integer
        size:
          type: integer

    WallpaperState:
      type: object
      description: 壁纸变更端点统一返回的状态。
      properties:
        mode:
          type: string
          enum: [local, bing]
        enabled:
          type: boolean
        active_file:
          type: string
        selected:
          type: string

    BingStatus:
      type: object
      properties:
        enabled:
          type: boolean
        file:
          type: string
        last_success_date:
          type: string
        copyright:
          type: string
        title:
          type: string
        mkt:
          type: string
        last_error:
          type: string
        last_attempt_at:
          type: integer

    ClientLogEntry:
      type: object
      properties:
        level:
          type: string
          enum: [D, I, W, E]
        tag:
          type: string
        msg:
          type: string
        ts:
          type: integer
          description: epoch 毫秒
        source:
          type: string
          description: "`android`、`js` 或 `electron`；缺省视为 `android`。"
