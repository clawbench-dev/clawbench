        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: queueId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已插入
        "409":
          description: 后端无法插入（无活跃连接），消息仍在队列

  /api/ai/queue/interrupt:
    post:
      tags: [Queue]
      summary: 中断并发送
      operationId: queueInterrupt
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: queueId
          in: query
          required: true
          schema:
            type: string
