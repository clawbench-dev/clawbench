  # ── Terminal ──────────────────────────────────────────────────────────────
  /api/terminal/ws:
    get:
      tags: [Terminal]
      summary: 终端 WebSocket（升级）
      description: |
        WebSocket 端点，承载 PTY 双向字节流与终端状态。OpenAPI 不建模升级握手。
        查询参数 `cwd` 指定初始工作目录：相对路径按项目根解析，**绝对路径表示
        项目外目录**（文件管理器的"在此打开终端"支持项目外浏览），在配置的根
        路径下校验后直接使用。
      operationId: terminalWS
      parameters:
        - name: cwd
          in: query
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols

  /api/terminal/status:
    get:
      tags: [Terminal]
      summary: 终端可用状态
      description: |
        返回 `enabled`、`platform_supported`、`cwd_probe_supported`、`sessions`、`session_count`；
        带 `session` 查询参数时另返回 `hasSession`/`sessionId`/`cwd`/`running`。
        取代已移除的 `/api/terminal/config`。

        `cwd` 是 shell 的**实时**工作目录：由后端读取 PTY 前台进程组的 `/proc/<pid>/cwd`
        得到，因此会跟随 `cd`（含嵌套子 shell）。`cwd_probe_supported` 表示该探测在当前
        **服务端**平台是否可用（仅 Linux/Android；macOS 需 cgo libproc，Windows 无 PTY）；
        为 false 时 `cwd` 退化为会话启动目录。这是服务端能力，前端不可用
        `navigator.userAgent` 推断（浏览器与服务端可能不同平台）。
      operationId: terminalStatus
      responses:
        "200":
          description: 状态

  /api/terminal/close:
    post:
      tags: [Terminal]
      summary: 关闭终端会话
      operationId: terminalClose
      parameters:
        - name: session
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 结果

  /api/terminal/quick-commands:
    get:
      tags: [Terminal]
      summary: 列出终端快捷指令
      operationId: terminalQuickCommandsList
      responses:
        "200":
          description: 快捷指令列表
