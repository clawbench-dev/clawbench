      description: |
        fsnotify 驱动的 WebSocket 流，用于自动刷新。OpenAPI 不建模事件流。
        查询参数 `dir`/`file` 设置初始监听目标，在协议升级前校验（路径穿越返回 403）。
        升级后客户端可发送 `{"type":"watch","dir":"...","file":"...","files":["..."]}`
        重新指定目标，并以 `{"type":"pong"}` 回应服务端的 `{"type":"ping"}`。
        服务端推送 `connected` / `dir_change` / `file_change` / `ping` / `error` 帧。

        `files` 是额外的项目相对路径列表（当前预览中渲染的图片），其内容变化同样以
        `file_change` 上报——Markdown 源文件本身没变时，预览里的图片被后台重写也能刷新。
        非法或越界的条目会被逐条丢弃而非整帧拒绝，最多接受 200 条。
        打开的文件与 `files` 中的文件都通过其**父目录**监听（原子保存是写临时文件再
        rename，会替换 inode，直接监听文件会失效）。

        `dir`/`file`/`files` 中的**绝对路径表示项目外目标**，直接在配置的根路径下
        校验并使用（文件管理器可浏览项目外目录，聊天里的图片也可能来自任意位置）；
        相对路径仍按项目根解析。
      operationId: fileWatchWS
      parameters:
        - name: dir
          in: query
          description: 监听目录（空表示项目根）。
          schema:
            type: string
        - name: file
          in: query
          description: 监听单个文件。
          schema:
            type: string
      responses:
        "101":
          description: 协议升级为 WebSocket

  # ── Share ─────────────────────────────────────────────────────────────────
  /api/share:
    post:
      tags: [Share]
      summary: 创建分享链接
      description: 需要目标路径（请求体 `{path}`）。
      operationId: shareCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 分享 token
    get:
      tags: [Share]
      summary: 列出分享
      operationId: shareList
      responses:
        "200":
          description: 分享列表
    delete:
      tags: [Share]
      summary: 删除分享
      description: 需要目标路径（请求体 `{path}` 或查询参数 `path`）。
      operationId: shareDelete
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果

  /api/share/session:
    get:
      tags: [Share]
      summary: 会话分享状态 + 可选消息列表
      description: |
        需要  查询参数。返回该会话当前的分享状态，并附带**全部**消息
        （含仍在生成/排队的）供分享对话框渲染：生成中的消息不可勾选。
        未分享时  为空但  照常返回，使打开对话框只需一次请求。
      operationId: sessionShareStatus
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 分享状态与消息列表
    post:
      tags: [Share]
      summary: 创建会话分享链接
      description: |
        请求体 `{sessionId, messageIds?}`。`messageIds` 为空表示分享全部**已完结**
        消息（streaming=0 且 queued=0）。选中未完结或不属于该会话的消息返回 400。
        快照为**冻结副本**：同时包含摘要与原文、内联 tool 输入输出与思考全文；
        执行计划不包含。重复创建会轮换 token，旧链接立即失效。
      operationId: sessionShareCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                messageIds:
                  type: array
                  items:
                    type: integer
                  description: 为空表示全部分享；选中项之外的已完结消息不进快照
      responses:
        "200":
          description: 分享 token 与路径
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Share]
      summary: 关闭会话分享
      description: 需要 `session_id`（查询参数或请求体 `{sessionId}`）。
      operationId: sessionShareRevoke
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 结果
  /api/share/session/list:
    get:
      tags: [Share]
      summary: 已分享会话抽屉数据
      description: |
        列出**当前项目**（请求 cookie 中的项目）的会话分享，最新在前。
        返回数组按 `shares` 包装，无分享时为空数组。

        与 `/api/share/list`（文件）不同，这里**按项目隔离**：会话标题属于私有内容，
        列出其他项目的分享会泄露它。

        `archived: true` 表示底层会话已归档。分享本身仍然有效（快照是冻结副本），
        也**仍然可以在此撤销**——归档后会话不再可按 id 寻址，这个列表是它唯一的
        撤销入口。前端据此隐藏「打开会话」动作。
      operationId: sessionShareList
      responses:
        "200":
          description: |
            分享列表，形如 `{"shares": [{token, sessionId, title, backend,
            messageCount, createdAt, archived}]}`，无分享时 `shares` 为空数组。
        "403":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Share]
      summary: 撤销会话分享（单条或全部）
      description: |
        请求体 `{token}` 撤销一条；`{token}` 也可用查询参数传入。
        `{all: true}`（或查询参数 `all=1`）撤销**本项目**的全部会话分享。

        撤销前会校验 token 归属于请求项目；未知 token 与其他项目的 token 返回
        **同一个 404**，两者都不暴露对方是否存在。
      operationId: sessionShareRevokeByToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                all:
                  type: boolean
      responses:
        "200":
          description: 结果
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/share/list:
    get:
      tags: [Share]
      summary: 已分享文件抽屉数据
      operationId: shareListAll
      responses:
        "200":
          description: 分享列表
    delete:
      tags: [Share]
      summary: 清空分享
      operationId: shareClear
      responses:
        "200":
          description: 结果

  /api/share/:
    get:
      tags: [Share]
      summary: 公开分享数据（token 即凭证）
      description: |
        免鉴权。子路径分派：`{token}` 或 `{token}/file`（原文件）、`{token}/content?path=`
        （文档内引用的文件，同样返回 FileContent JSON）、`{token}/download`（强制下载，
        支持 `?path=`）、`{token}/local/...` 与 `{token}/local/?path=`（相对/绝对资源）。
        token 不存在一律 404，零信息暴露。

        会话分享走另外两个子路径：`{token}/meta`（返回 `kind` 为 `file` 或
        `session`，供分享页判断该渲染哪种视图）与 `{token}/session`（返回冻结的
        会话快照 JSON）。两者同样免鉴权、token 不存在一律 404。

        **分享不限文件大小、不限类型**：任何文件都能创建链接并下载。
        `{token}/file` 与 `{token}/content` 需要把内容内联进 JSON，故对超过内联上限
        （10MB）的文件返回 200 但 `content` 为空、`tooLarge: true`（仅元数据），由分享页
        降级为下载入口；`{token}/download` 与 `{token}/local/...` 流式返回，无大小上限。

        `?path=` 仅接受落在**该分享自身范围**内的绝对路径，范围在创建分享时确定并
        随分享记录持久化（文件在所选项目内 → 项目根；否则 → 该文件所在目录）。
        范围之外的路径返回 404，与 `RootPaths` 无关。`{token}/content` 对目录返回 404
        （token 端点不提供目录列举能力）。
      operationId: sharePublic
      security: []
      responses:
        "200":
          description: |
            分享内容。`content` 为空且 `tooLarge: true` 表示文件超过内联上限，
            仅返回元数据（`name`/`path`/`size`/`supported`），需改用 `download` 子路径。
        "404":
          $ref: "#/components/responses/Error"

  /share/{token}:
    get:
      tags: [Share]
      summary: 公开分享页面（SPA）
      description: 免鉴权，返回分享只读 SPA。
      operationId: sharePage
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML 页面
          content:
            text/html:
              schema:
                type: string

  # ── Forge ─────────────────────────────────────────────────────────────────
  /api/forge/credentials:
    post:
      tags: [Forge]
      summary: 保存凭据
      operationId: forgeCredentialsSave
      description: |
        为某个主机保存访问令牌。令牌只写不读，`GET /api/config` 只回报哪些主机已配置。

        `host` 可写完整地址（`http://gitlab.internal`、`https://gitlab.internal/group/repo`）
        或只写主机名（`gitlab.internal:8080`）。服务端归一化为「主机名 + 可选端口」作为
        凭据键——**协议不进入键**，否则 `https://h` 存下的令牌永远匹配不上绑定记录的
        `h`。

        地址中写明的协议会作为该实例的协议提示记录下来（响应 `scheme`），供远程为 ssh
        形式、无法推断协议的绑定使用。只写主机名表示「未说明协议」，此时**保留**已记录
        的提示，不会重置为 https。清除令牌（`token` 为空）会连同协议提示一起清除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  description: 主机名（可含端口）或完整地址；服务端归一化
                token:
                  type: string
                  description: 访问令牌；为空表示清除该主机的凭据
      responses:
        "200":
          description: 结果（`host`、`scheme`、`has_token`）
    delete:
      tags: [Forge]
      summary: 删除凭据
      operationId: forgeCredentialsDelete
      description: |
        等价于 POST 空 `token`：同时清除令牌与该主机的协议提示。
      parameters:
        - name: host
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 结果

  /api/forge/verify-token:
    post:
      tags: [Forge]
      summary: 校验令牌
      operationId: forgeVerifyToken
      description: |
        校验令牌能否在该主机上通过认证。与保存解耦：可校验即将保存的令牌，也可复验已
        保存的令牌（`token` 省略时用已保存的）。

        失败仍返回 200，用 `ok:false` 与 `code` 区分「令牌被拒」（`auth`）与「主机不可
        达」（`network`）——后者不能说明令牌无效。

        `host` 中写明的协议（或该主机已记录的协议提示）决定探测使用的协议；成功时响应
        的 `scheme` 是实际使用的协议。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  description: 主机名（可含端口）或完整地址；服务端归一化
                token:
                  type: string
                  description: 省略时校验该主机已保存的令牌
      responses:
        "200":
          description: 校验结果（`ok`、`identity`、`scheme`，失败时 `code` / `error`）

  /api/forge/items:
    get:
      tags: [Forge]
      summary: 议题 / 合并请求列表
      operationId: forgeItems
      description: |
        返回项目所绑定仓库的议题 / 合并请求。

        每项的 `unread` 为 true 表示该条目有用户尚未查看的活动。它与 dock 角标
        计数的是同一批数据，因此角标数字与列表中的未读标记始终一致。
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: perPage
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: mine
          in: query
          schema:
            type: boolean
        - name: mineScope
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 条目列表

  /api/forge/item:
    get:
      tags: [Forge]
      summary: 议题 / 合并请求详情
      operationId: forgeItem
      description: |
        返回单个条目（议题或合并请求）的详情。

        响应中的 `sourceBranch` 是合并请求的**源分支**（head branch），议题为空。
        它存在的原因是 CI 运行在 GitHub 侧按分支检索：没有它就无法定位该变更的
        流水线。但**流水线列表本身不在这里返回**——见 `/api/forge/item-pipelines`，
        那是一次单独的、按需的请求。
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
        - name: number
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 条目详情（`item` 含 `sourceBranch`，合并请求才有）

  /api/forge/comments:
    get:
      tags: [Forge]
      summary: 评论列表
      operationId: forgeComments
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
        - name: number
          in: query
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: perPage
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 评论列表

  /api/forge/pipelines:
    get:
      tags: [Forge]
      summary: 流水线运行列表
      operationId: forgePipelines
      description: |
        返回项目所绑定仓库的 CI 运行列表（GitHub Actions / GitLab Pipelines），
        按时间倒序。**只读**：本端点只发 GET，不提供重跑或取消。

        查询参数 `status` 过滤归一化后的状态：`success`、`failure`、`running`、
        `cancelled`、`skipped`。无法识别的值等同于不过滤（与 `state` 的处理一致）。

        平台不支持 CI 时返回 400 + `code=ForgeNoPipelines`；项目未绑定仓库时返回
        404 + `code=NoForgeBinding`。

        `durationSeconds` 可能缺失：GitHub 的运行列表不返回耗时，只有详情端点
        能给出推算值。

        每项的 `unread` 为 true 表示该次运行有用户尚未查看的活动，与 dock 角标
        计数的是同一批数据。

        每项的 `pullRequests` 列出该次运行关联的变更请求，供详情页跳转；**没有关联
        时该字段整个缺失**（不是空数组）。平台差异：GitHub 在运行列表里内联返回
        PR，因此总能给出编号、标题与链接；GitLab 的流水线载荷不含 MR 信息，仅当该
        运行是合并请求流水线（ref 为 `refs/merge-requests/<iid>/head`）时才能从 ref
        推出编号（无标题）。

        **本列表端点的 `pullRequests` 只反映载荷里已有的信息**：GitLab 由分支推送
        触发的运行在此处不会给出关联。这类关联需要按运行逐条查询，代价过高，故不在
        列表（会被轮询与翻页）中执行——改由 `/api/forge/pipeline` 在打开详情时按需
        补齐，见该端点的说明。
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [success, failure, running, cancelled, skipped]
        - name: page
          in: query
          schema:
            type: integer
        - name: perPage
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 运行列表（`pipelines`、`hasMore`、`nextPage`、`binding`）
        "400":
          description: 该平台不提供 CI 能力
        "404":
          description: 项目未绑定仓库

  /api/forge/pipeline:
    get:
      tags: [Forge]
      summary: 流水线运行详情（含作业）
      operationId: forgePipeline
      description: |
        返回单次运行的元信息与它的作业列表。`jobs` 是**尽力而为**的：作业列表拉取
        失败时仍返回 200，此时 `jobs` 为空数组——运行自身的元信息才是主载荷。

        `id` 非法或缺失返回 400 + `code=ForgeInvalidPipelineID`；运行不在可见窗口内
        返回 404。平台不支持 CI 时返回 400 + `code=ForgeNoPipelines`。

        作业字段的平台差异：`stage` 与 `failureReason` 仅 GitLab 提供（GitHub 无
        stage 概念），缺失时省略。

        `pipeline.pullRequests` 列出该次运行关联的变更请求（`number` / `title` /
        `url`），供详情页跳转；没有关联时整个字段缺失。

        **与列表端点的差异（重要）**：本端点会为无法内联给出关联的平台（GitLab）
        按需查询一次——对由分支推送触发的运行，用 `source_branch` 匹配该分支上处于
        opened 的合并请求。因此这里比 `/api/forge/pipelines` 多一次请求，覆盖也更全
        （能给出标题）。该查询是**尽力而为**的：失败时照常返回 200，只是没有关联，
        运行自身的元信息不受影响。
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: 平台侧的运行 ID（GitHub run id / GitLab pipeline id）
      responses:
        "200":
          description: 运行详情（`pipeline`、`jobs`、`binding`）
        "400":
          description: id 非法，或该平台不提供 CI 能力
        "404":
          description: 项目未绑定仓库，或运行不存在

  /api/forge/item-pipelines:
    get:
      tags: [Forge]
      summary: 某个变更请求的流水线列表
      operationId: forgeItemPipelines
      description: |
        返回某个变更请求（PR / MR）关联的 CI 运行，供 PR 详情页的 CI 区块使用。
        这是 `/api/forge/pipeline` 上「运行 → 关联 PR」的反方向：回答「这个变更
        通过 CI 了吗」，即阅读 PR 时最关心的问题。

        **为什么是独立端点而不是 `/api/forge/item` 的一个字段**：它每次调用都会
        产生一次上游请求，因此只在用户真正展开 CI 区块时才应获取；并入条目载荷
        会让每次打开 PR 都为一个多数人不会展开的列表付费。

        平台差异：GitHub 用条目的源分支过滤运行列表（拿到完整字段）；GitLab 用
        `/merge_requests/:iid/pipelines`（覆盖 fork 源分支的情形，但该端点返回
        精简结构，**没有耗时、没有触发者**）。客户端应把缺失的耗时按「未提供」
        处理，而不是当作 0。

        平台不支持 CI、或该变更没有运行，均返回 200 且 `pipelines` 为空数组——
        两者都不是错误。

        `number` 非法或缺失返回 400；项目未绑定仓库返回 404 + `code=NoForgeBinding`。
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [issue, pr]
          description: 只有 `pr` 会有流水线；`issue` 返回空列表
        - name: number
          in: query
          required: true
          schema:
            type: integer
          description: 变更请求编号（GitHub PR number / GitLab merge-request iid）
      responses:
        "200":
          description: 流水线列表（`pipelines`、`binding`）
        "400":
          description: number 非法或缺失
        "404":
          description: 项目未绑定仓库

  /api/forge/binding:
    get:
      tags: [Forge]
      summary: 读取项目绑定
      operationId: forgeBindingGet
      description: |
        返回当前项目的仓库绑定（`binding` 含 `platform`、`host`、`scheme`、`owner`、
        `repo`、`slug`）。
        **未绑定时仍是 200**，此时 `binding` 为 `null`，可能附带 `suggested`（候选仓库）。
        注意：GET 有副作用——若项目存在指向官方平台的 git remote，本端点会自动完成绑定。
        事件触发的任务只在项目已绑定仓库时才会被触发，创建这类任务前应先用本端点确认
        `binding` 非空。

        `scheme` 是请求该主机实际使用的协议（`http` / `https`），已解析而非原始值：
        远程为 ssh 形式时无法推断协议，此时由凭据记录的协议提示决定，最终仍会落到
        `http` 或 `https`。
      responses:
        "200":
          description: 绑定信息
    post:
      tags: [Forge]
      summary: 保存项目绑定
      operationId: forgeBindingSave
      description: |
        绑定项目到仓库。两种方式二选一：

        - `url`：远程地址，服务端解析。`http://` / `https://` 会带上协议；`ssh://`
          与 scp 形式（`git@host:path`）不表示协议，绑定记录的 `scheme` 为空，由凭据
          的协议提示决定。
        - 显式字段（`platform` / `host` / `owner` / `repo`）：`host` 可写完整地址
          （`http://gitlab.internal`）也可只写主机名，服务端会归一化。`scheme` 可单独
          传；两者都传时以 `host` 内的为准。

        `host` 是绑定与凭据的关联键，**不含协议**——同一实例的 http 与 https 视为同一
        个仓库，因此不会因协议不同而产生两份轮询/未读状态。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                host:
                  type: string
                  description: 主机名（可含端口）或完整地址；服务端归一化
                scheme:
                  type: string
                  enum: [http, https]
                  description: API 协议；省略时由 host 内协议或凭据提示决定
                owner:
                  type: string
                repo:
                  type: string
                url:
                  type: string
                  description: 远程地址，支持 http / https / ssh / scp 形式
                source:
                  type: string
      responses:
        "200":
          description: 结果
    delete:
      tags: [Forge]
      summary: 解除绑定
      operationId: forgeBindingDelete
      responses:
        "204":
          description: 已解除（无响应体）

  /api/forge/remotes:
    get:
      tags: [Forge]
      summary: git remote 列表
      operationId: forgeRemotes
      responses:
        "200":
          description: remote 列表

  /api/forge/test:
    post:
      tags: [Forge]
      summary: 连通性测试
      operationId: forgeTest
      responses:
        "200":
          description: 测试结果

  /api/forge/unread:
    get:
      tags: [Forge]
      summary: 未读条目数（按项目绑定的仓库）
      description: |
        返回该项目的仓库中「有新活动的条目」数量（按条目去重，不是事件数）。
        未绑定仓库时返回 count 为 0（正常状态，非错误）。
      operationId: forgeUnread
      responses:
        "200":
          description: 未读条目数
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /api/forge/unread-items:
    get:
      tags: [Forge]
      summary: 动态条目列表（按项目绑定的仓库）
      description: |
        返回该项目的仓库中有活动的条目，最近活动在前，供 forge 面板的「动态」页签使用。
        每个条目给出最新的 eventType（用于生成「有新评论」这类说明）与事件总数。
        流水线的 number 恒为 0，其运行 id 在 runId 字段；客户端应原样回传 itemKey
        给 /api/forge/read，不要用 type/number 重新拼装。
        `filter` 按条目的已读状态筛选：unread（默认）/ read / all。已读状态是**条目级**
        的——只有该条目的全部事件都已读，read 才为 true。非法或缺省的 filter 一律回落
        unread（它是视图选择器，写错最多回到默认视图，不应报错）。
        未绑定仓库时返回 count 为 0、items 为空（正常状态，非错误）。
      operationId: forgeUnreadItems
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [unread, read, all]
            default: unread
          description: 按条目已读状态筛选；非法值回落 unread
      responses:
        "200":
          description: 动态条目列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        itemKey:
                          type: string
                          description: '条目键，如 issue/42、pr/7、pipeline/run:555'
                        type:
                          type: string
                          description: issue / pr / pipeline
                        number:
                          type: integer
                          description: 议题或合并请求编号；流水线恒为 0
                        runId:
                          type: integer
                          description: 流水线运行 id；非流水线为 0
                        eventType:
                          type: string
                          description: 最新事件类型，如 opened/closed/merged/reopened/commented/pipeline_done
                        eventCount:
                          type: integer
                          description: 该条目的事件总数
                        url:
                          type: string
                        slug:
                          type: string
                          description: owner/repo
                        updatedAt:
                          type: string
                        read:
                          type: boolean
                          description: 该条目是否已全部读完（条目级，非事件级）

  /api/forge/read:
    post:
      tags: [Forge]
      summary: 标记已读
      description: |
        省略 body 或 itemKey 为空表示标记该仓库全部条目已读（「全部已读」）；
        传 itemKey 则只标记该条目（打开某一行时使用）。
        响应返回标记后剩余的未读条目数。
      operationId: forgeMarkRead
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                itemKey:
                  type: string
                  description: '条目键，如 issue/42、pr/7、pipeline/run:555'
      responses:
        "200":
          description: 剩余未读条目数
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  # ── Agents ────────────────────────────────────────────────────────────────
  /api/agents:
    get:
      tags: [Agents]
      summary: Agent 列表与 ACP 缓存状态
      description: |
        返回所有 agent，并附带 `acpStates`（模式、思考深度、斜杠命令 `commands`、
        模型列表、计划状态）。斜杠命令由 `acpStates[].commands` 提供，取代已移除的
        `/api/ai/commands`。

        **模型列表由服务端合并**：`agents[].models` 是已解析的最终列表——CLI 发现的
        列表提供顺序与名称，ACP 上报的**具体**模型列表在存在时对成员资格有权威性
        （ACP 未上报的 CLI 模型会被剔除）。ACP 若上报的是 `opus`/`sonnet`/`haiku`
        这类**档位别名**，则不参与成员资格判定，而是对齐到对应的 CLI 条目并只取其
        显示名（保留具体 ID，CLI 仍能识别）。`agents[].cliModels` 是未经合并的纯 CLI
        列表，供客户端在切换到 CLI 传输时直接渲染，无需自行保留基线并重新合并。

        同一对列表也挂在 `acpStates[].modelListState` 的 `resolvedModels` /
        `cliModels` 字段上，便于客户端仅凭 ACP 状态缓存刷新视图。
      operationId: agentsList
      responses:
        "200":
          description: agent 列表与 acpStates
    post:
      tags: [Agents]
      summary: 复制 / 新建 agent
      operationId: agentsCreate
      responses:
        "200":
          description: 新 agent
    patch:
      tags: [Agents]
      summary: 更新 agent
      operationId: agentsUpdate
      responses:
        "200":
          description: 更新结果
    delete:
      tags: [Agents]
      summary: 删除 agent
      operationId: agentsDelete
      responses:
        "200":
          description: 结果

  /api/agents/{id}:
    get:
      tags: [Agents]
      summary: agent 子资源
      description: |
        GET 子路径：`/api/agents/{id}/acp-sessions`。
        （`/api/agents/{id}/refresh-models` 与 `/api/agents/rescan` 只接受 POST。）
      operationId: agentSubGet
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 子资源内容
    post:
      tags: [Agents]
      summary: agent 子操作
      description: |
        `/api/agents/{id}/refresh-models`：重新执行该 agent 的 CLI 模型发现并落库，
        返回 `{ models, cliModels }`——与 GET /api/agents 同一形状。`models` 是发现结果
        与已缓存的 ACP 模型列表合并后的列表（ACP 对成员资格有权威性），`cliModels` 是
        未经合并的纯 CLI 列表，供客户端在切换到 CLI 传输时直接渲染。
      operationId: agentSubPost
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 操作结果

  /api/backends:
    get:
      tags: [Agents]
      summary: 可用后端列表
      operationId: backendsList
      responses:
        "200":
          description: 后端列表

  # ── TTS ───────────────────────────────────────────────────────────────────
