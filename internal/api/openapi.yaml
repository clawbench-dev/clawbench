openapi: "3.0.3"
info:
  title: ClawBench API
  description: |
    ClawBench 的完整 HTTP API。所有 `/api/` 路由默认经 `middleware.Auth`
    鉴权（会话 Cookie，或本机 AI 子进程的短时 `aiToken`），少数端点刻意免鉴权
    （见各 operation 的 `security: []`）。
    聊天流式内容通过 WebSocket 推送（见 `/api/ai/events/ws`），不在本文件建模。

    约定：
    - 统一错误体见 `components/schemas/ErrorResponse`。
    - 项目范围通过 `clawbench_project` Cookie 或 `project_path` 查询参数传递。
    - 时间戳为 epoch 毫秒（除显式说明外）。
  version: "1.0.0"

servers:
  - url: /
    description: 同源（文件管理器内的 Swagger UI 直接可用）

tags:
  - name: Auth
    description: 登录、会话与健康检查
  - name: System
    description: 系统资源与统计
  - name: Config
    description: 服务端配置读写与自检
  - name: Theme
    description: 壁纸与外观
  - name: Projects
    description: 项目与根目录
  - name: Chat
    description: 聊天、消息与推荐
  - name: Sessions
    description: 会话生命周期
  - name: Queue
    description: 排队消息
  - name: Events
    description: 事件推送与离线补偿
  - name: Git
    description: Git 仓库操作
  - name: Files
    description: 文件浏览、读写与目录
  - name: Share
    description: 文件分享链接
  - name: Forge
    description: GitHub / GitLab 集成
  - name: Agents
    description: AI Agent 与后端
  - name: TTS
    description: 语音合成
  - name: STT
    description: 语音识别
  - name: Terminal
    description: Web 终端
  - name: Tasks
    description: 任务
  - name: RAG
    description: 检索增强
  - name: Upgrade
    description: 应用自升级
  - name: Proxy
    description: 端口转发与 CORS 代理
  - name: SSH/FRP
    description: 隧道状态
  - name: Fonts
    description: 自定义字体
  - name: Upload
    description: 上传与最近记录
  - name: ClientLogs
    description: 客户端日志回传
  - name: APK
    description: Android 安装包

security:
  - cookieAuth: []
  - aiToken: []

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /login:
    get:
      tags: [Auth]
      summary: 登录页面
      description: 返回登录 HTML 页面（非 API）。
      operationId: loginPage
      security: []
      responses:
        "200":
          description: 登录页 HTML
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Auth]
      summary: 登录
      description: 校验密码并下发会话 Cookie。无需鉴权（登录本身即入口）。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          description: 登录成功，设置会话 Cookie
        "401":
          $ref: "#/components/responses/Error"

  /api/health:
    get:
      tags: [Auth]
      summary: 健康检查
      description: 免鉴权的存活探针。
      operationId: health
      security: []
      responses:
        "200":
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                  version:
                    type: string

  /api/me:
    get:
      tags: [Auth]
      summary: 当前会话状态
      description: 免鉴权，供前端判断是否需要登录（返回是否已认证）。
      operationId: me
      security: []
      responses:
        "200":
          description: 认证状态

  /api/config/password:
    post:
      tags: [Auth]
      summary: 修改密码
      operationId: configPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: 修改成功
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: 当前密码错误
        "429":
          description: 尝试过于频繁

  # ── System ────────────────────────────────────────────────────────────────
  /api/system/resources:
    get:
      tags: [System]
      summary: 系统资源实时指标
      description: CPU、内存、磁盘、网络等指标快照，供资源面板轮询。
      operationId: systemResources
      responses:
        "200":
          description: 指标快照

  /api/roots:
    get:
      tags: [System]
      summary: 可访问的根路径
      operationId: roots
      responses:
        "200":
          description: 根路径列表

  /api/usage/stats:
    get:
      tags: [System]
      summary: 用量统计
      description: |
        按维度聚合 `chat_metadata` 的 token / 成本统计。

        项目范围通过项目 Cookie 传递，不是查询参数——`dims` 里**没有** `project`。

        **响应结构**：
        - `totals`：所有行的合计，字段 `input` / `output` / `total` / `cacheHit` /
          `cacheMiss` / `credit` / `costUsd` / `messageCnt`。
        - `rows[]`：每个 dim 组合一行。`key` 是对象，键即请求的 dims
          （如 `{"model":"...","backend":"..."}`），行上带有与 `totals` 相同的字段。
          行的顺序由 `sort` / `order` 决定，`limit` 截断。
        - `trend[]`：仅 `trend=1` 时返回，在 `rows[]` 的基础上多一个 `day`
          （`YYYY-MM-DD`），用于按天走势图。

        注意 `chat_metadata.created_at` 记录的是元数据**最终写入**时刻
        （约等于助手回复完成），不是用户提问时刻。
      operationId: usageStats
      parameters:
        - name: start
          in: query
          required: true
          description: 起始时间（RFC3339）。
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 结束时间（RFC3339）。
          schema:
            type: string
            format: date-time
        - name: dims
          in: query
          required: true
          description: |
            聚合维度。**重复该参数**以多维分组（1..3 个，不可重复）——
            例如 `dims=model&dims=backend`。逗号分隔会被拒绝。
            合法值仅 `model` / `backend` / `agent`。
          schema:
            type: array
            items:
              type: string
              enum: [model, backend, agent]
        - name: metrics
          in: query
          required: true
          description: |
            指标。**重复该参数**（至少 1 个）——例如 `metrics=input&metrics=total`。
            逗号分隔会被拒绝。
          schema:
            type: array
            items:
              type: string
              enum: [input, output, total, cacheHit, credit, cost]
        - name: sort
          in: query
          description: 排序用的指标 id，默认 `total`。
          schema:
            type: string
        - name: order
          in: query
          description: 排序方向，默认 `desc`。
          schema:
            type: string
            enum: [asc, desc]
        - name: trend
          in: query
          description: 传 `1` 时额外返回按天分组的 `trend[]`。
          schema:
            type: string
        - name: top
          in: query
          description: trend 模式下保留的 dim 组合数，默认 10。
          schema:
            type: integer
        - name: limit
          in: query
          description: 最大行数，默认 50，上限 200。
          schema:
            type: integer
      responses:
        "200":
          description: 聚合结果

  /api/git/stats:
    get:
      tags: [System]
      summary: Git 仓库统计
      description: 代码增量统计（时间窗内）。
      operationId: gitStats
      parameters:
        - name: start
          in: query
          required: true
          description: 起始时间（RFC3339）。
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 结束时间（RFC3339）。
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 提交数、贡献者等

  /api/git/cloc:
    get:
      tags: [System]
      summary: 代码行数统计
      operationId: gitCloc
      responses:
        "200":
          description: 按语言的行数统计

  # ── Config ────────────────────────────────────────────────────────────────
  /api/config:
    get:
      tags: [Config]
      summary: 读取服务端配置
      description: |
        返回完整配置（密码等敏感字段被剥离）。`appearance.active_file` 由服务端
        按 mode/enabled/选中项解析后下发。
      operationId: getConfig
      responses:
        "200":
          description: 配置对象
    patch:
      tags: [Config]
      summary: 局部更新配置
      description: |
        仅白名单内的键可写；类型不符直接 400（避免写入后 `yaml.Unmarshal` 失败）。
        文件名类键（`appearance.local.selected`/`local.items`/`bing.file`）不在白名单，
        须经专用端点写入。
      operationId: patchConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 更新结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_restart:
                    type: boolean
                  changed_cold_fields:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/Error"

  /api/config/test:
    post:
      tags: [Config]
      summary: 测试配置连通性
      description: 例如测试 TTS/推送/模型服务连通性。
      operationId: configTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                values:
                  type: object
      responses:
        "200":
          description: 测试结果

  /api/config/restart:
    post:
      tags: [Config]
      summary: 重启服务
      operationId: configRestart
      responses:
        "200":
          description: 已触发重启

  # ── Theme ─────────────────────────────────────────────────────────────────
  /api/theme/local/upload:
    post:
      tags: [Theme]
      summary: 上传图库图片
      description: multipart，字段名 `files`（可多个）。逐文件尽力处理，失败项进 `errors`。
      operationId: themeLocalUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: 上传结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GalleryItem"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        error:
                          type: string

  /api/theme/local/item:
    delete:
      tags: [Theme]
      summary: 删除图库图片
      operationId: themeLocalItemDelete
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除后的壁纸状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperState"

  /api/theme/local/select:
    post:
      tags: [Theme]
      summary: 选中图库图片为当前壁纸
      operationId: themeLocalSelect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: 壁纸状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperState"

  /api/theme/wallpaper:
    post:
      tags: [Theme]
      summary: 切换壁纸来源 / 总开关
      description: 仅应用传入的字段。切到 `bing` 会同步打开抓取开关并立即触发一次抓取。
      operationId: themeWallpaperMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [local, bing]
                enabled:
                  type: boolean
      responses:
        "200":
          description: 壁纸状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperState"

  /api/theme/bing/sync:
    post:
      tags: [Theme]
      summary: 立即抓取 Bing 每日壁纸
      description: 后台执行，结果轮询 `/api/theme/bing/status`。
      operationId: themeBingSync
      responses:
        "202":
          description: 已受理，返回当前 Bing 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BingStatus"

  /api/theme/bing/status:
    get:
      tags: [Theme]
      summary: Bing 壁纸状态
      operationId: themeBingStatus
      responses:
        "200":
          description: 状态与署名
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BingStatus"

  /api/file/theme-wallpaper:
    get:
      tags: [Theme]
      summary: 读取单张壁纸图片
      description: 按裸文件名（图库或 Bing）流式返回图片，带缓存与安全头。
      operationId: themeWallpaperGet
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 图片字节
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

  # ── Projects ──────────────────────────────────────────────────────────────
  /api/projects:
    get:
      tags: [Projects]
      summary: 列出项目目录
      operationId: projectsList
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 目录条目
    post:
      tags: [Projects]
      summary: 创建项目目录
      operationId: projectsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: 创建结果

  /api/project:
    get:
      tags: [Projects]
      summary: 读取当前项目
      operationId: projectGet
      responses:
        "200":
          description: 当前项目
    post:
      tags: [Projects]
      summary: 设置当前项目
      operationId: projectSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 设置结果

  /api/recent-projects:
    get:
      tags: [Projects]
      summary: 最近项目
      operationId: recentProjectsList
      responses:
        "200":
          description: 最近项目列表
    post:
      tags: [Projects]
      summary: 记录最近项目
      operationId: recentProjectsAdd
      responses:
        "200":
          description: 结果
    delete:
      tags: [Projects]
      summary: 删除一条最近项目
      description: 按请求体 `{path}` 删除单条记录。
      operationId: recentProjectsClear
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果

  # ── Chat ──────────────────────────────────────────────────────────────────
  /api/ai/chat:
    get:
      tags: [Chat]
      summary: 聊天历史与运行状态
      description: 分页返回会话消息，并附带运行状态与 ACP 状态。`session_id` 缺省时回退到会话 Cookie。
      operationId: chatGet
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          description: 整数游标，取该 id 之前的消息。
          schema:
            type: integer
        - name: before
          in: query
          description: 时间戳游标（legacy，兼容旧客户端；优先用 `before_id`）。
          schema:
            type: string
      responses:
        "200":
          description: 消息列表与状态
    post:
      tags: [Chat]
      summary: 发送聊天消息
      description: |
        发送一条用户消息并启动 AI 流式响应。流式事件经 `/api/ai/events/ws` 推送。
        会话由 `session_id` 查询参数（或会话 Cookie）决定，**不在请求体里**。
      operationId: chatSend
      parameters:
        - name: session_id
          in: query
          description: 目标会话；缺省时回退到会话 Cookie。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                queueId:
                  type: string
                  description: 排队消息标识（忙碌时入队用）。
                filePaths:
                  type: array
                  items:
                    type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileEntry"
                agentId:
                  type: string
                modelId:
                  type: string
                thinkingEffort:
                  type: string
                modeId:
                  type: string
                transport:
                  type: string
                clientId:
                  type: string
      responses:
        "200":
          description: 已受理

  /api/ai/chat/cancel:
    post:
      tags: [Chat]
      summary: 取消当前生成
      operationId: chatCancel
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已取消

  /api/ai/chat/read:
    post:
      tags: [Chat]
      summary: 标记会话已读
      operationId: chatRead
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已标记

  /api/ai/chat/user-messages:
    get:
      tags: [Chat]
      summary: 用户消息索引
      description: 轻量返回该会话的用户消息列表（`{messages:[...]}`），供消息导航。
      operationId: chatUserMessages
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 用户消息索引
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      description: 用户消息（含 id / content / files / createdAt / role 等）。

  /api/ai/chat/tool-call:
    get:
      tags: [Chat]
      summary: 工具调用详情
      description: 按 tool_id + message_id 取完整输入输出；失败时可用 session_id 回退查找。
      operationId: chatToolCall
      parameters:
        - name: tool_id
          in: query
          required: true
          schema:
            type: string
        - name: message_id
          in: query
          required: true
          schema:
            type: integer
        - name: session_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 工具调用记录
        "404":
          $ref: "#/components/responses/Error"

  /api/ai/chat/thinking:
    get:
      tags: [Chat]
      summary: 思考内容详情
      operationId: chatThinking
      parameters:
        - name: think_id
          in: query
          required: true
          schema:
            type: string
        - name: message_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 思考内容

  /api/ai/permission/respond:
    post:
      tags: [Chat]
      summary: 回应权限审批
      operationId: permissionRespond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                toolCallId:
                  type: string
                  description: ACP 工具调用 ID。
                optionId:
                  type: string
                  description: 选中的权限选项；空字符串表示取消。
                cancelled:
                  type: boolean
      responses:
        "200":
          description: 已回应

  /api/chat/quick-send:
    get:
      tags: [Chat]
      summary: 列出聊天快捷发送
      operationId: quickSendList
      responses:
        "200":
          description: 快捷发送列表
    post:
      tags: [Chat]
      summary: 新建聊天快捷发送
      operationId: quickSendCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                command:
                  type: string
                project_only:
                  type: boolean
      responses:
        "200":
          description: 新建结果

  /api/chat/quick-send/reorder:
    put:
      tags: [Chat]
      summary: 批量重排聊天快捷发送
      description: 注意重排路径是 `/api/chat/quick-send/reorder`，不是 `/api/chat/quick-send`。
      operationId: quickSendReorder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: 结果

  /api/chat/quick-send/{id}:
    put:
      tags: [Chat]
      summary: 更新聊天快捷发送
      operationId: quickSendUpdate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 更新结果
    delete:
      tags: [Chat]
      summary: 删除聊天快捷发送
      operationId: quickSendDelete
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 结果

  /api/chat/recommendation:
    get:
      tags: [Chat]
      summary: 下一步推荐
      description: 拉取当前会话的推荐问题（离线时也通过此端点补偿）。
      operationId: chatRecommendation
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 推荐内容

  /api/chat/message-clusters:
    get:
      tags: [Chat]
      summary: 消息聚类结果
      description: 返回全局聚类结果（不按会话过滤）。
      operationId: messageClusters
      responses:
        "200":
          description: 聚类

  /api/chat/message-clusters/compute:
    post:
      tags: [Chat]
      summary: 触发消息聚类计算
      operationId: messageClustersCompute
      responses:
        "200":
          description: 已触发
        "409":
          description: 已有计算在运行

  /api/chat/message-clusters/compute/cancel:
    post:
      tags: [Chat]
      summary: 取消消息聚类计算
      operationId: messageClustersComputeCancel
      responses:
        "200":
          description: 已取消

  /api/chat/message-clusters/compute/status:
    get:
      tags: [Chat]
      summary: 消息聚类计算状态
      operationId: messageClustersComputeStatus
      responses:
        "200":
          description: 状态

  # ── Sessions ──────────────────────────────────────────────────────────────
  /api/ai/sessions:
    get:
      tags: [Sessions]
      summary: 会话列表
      operationId: sessionsList
      parameters:
        - name: cursor
          in: query
          description: 游标；上一页最后一行的 `createdAt`，需与 `cursor_id` 同时提供才生效。
          schema:
            type: string
        - name: cursor_id
          in: query
          schema:
            type: string
        - name: cursor_pinned
          in: query
          description: |
            游标；上一页最后一行的 `pinned`（`1`/`0`）。
            排序为 `pinned DESC, created_at DESC, id DESC`，游标必须携带 pinned，
            否则置顶会话会在每一页重复返回。省略时退回旧的 created_at-only 行为。
          schema:
            type: integer
            enum: [0, 1]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 会话列表
    post:
      tags: [Sessions]
      summary: 新建会话
      operationId: sessionsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                agentId:
                  type: string
                backend:
                  type: string
      responses:
        "200":
          description: 新会话

  /api/ai/sessions/overview:
    get:
      tags: [Sessions]
      summary: 会话总览
      operationId: sessionsOverview
      responses:
        "200":
          description: 各项目会话概览

  /api/ai/session/update:
    patch:
      tags: [Sessions]
      summary: 即时持久化会话设置
      description: 模式 / 思考深度 / 模型 / 传输方式的变更即时写库，无需发消息。会话由 `session_id` 查询参数（或会话 Cookie）决定。
      operationId: sessionUpdate
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modeId:
                  type: string
                thinkingEffort:
                  type: string
                modelId:
                  type: string
                transport:
                  type: string
                autoApprove:
                  type: boolean
                title:
                  type: string
      responses:
        "200":
          description: 已更新

  /api/ai/session/archive:
    delete:
      tags: [Sessions]
      summary: 归档会话
      operationId: sessionArchive
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: backend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 归档结果

  /api/ai/session/destroy:
    delete:
      tags: [Sessions]
      summary: 销毁会话（不可逆）
      operationId: sessionDestroy
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 销毁结果

  /api/ai/session/resume:
    post:
      tags: [Sessions]
      summary: 恢复会话
      operationId: sessionResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: 恢复结果

  /api/ai/session/acp-load:
    post:
      tags: [Sessions]
      summary: ACP 显式 LoadSession
      description: 强制触发一次 ACP LoadSession 回放（慢，仅显式调用）。
      operationId: sessionACPLoad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                acpSessionId:
                  type: string
      responses:
        "200":
          description: 回放结果

  /api/ai/session/acp-sync:
    post:
      tags: [Sessions]
      summary: ACP 会话同步
      description: 对比 ACP 回放消息与本地记录，仅补插缺失消息。
      operationId: sessionACPSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                sessionId:
                  type: string
      responses:
        "200":
          description: 同步结果

  /api/ai/session/fork:
    post:
      tags: [Sessions]
      summary: 分叉会话
      description: 请求体字段均可选；缺省时回退到查询参数 / 会话 Cookie。
      operationId: sessionFork
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                beforeMessageId:
                  type: integer
                agentId:
                  type: string
      responses:
        "200":
          description: 新会话

  /api/ai/session/reset:
    post:
      tags: [Sessions]
      summary: 重置卡死会话
      description: 保留外部会话 ID 映射，仅回收 agent 进程，历史完整保留。
      operationId: sessionReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
      responses:
        "200":
          description: 重置结果

  /api/ai/session/rewind:
    post:
      tags: [Sessions]
      summary: 回溯会话历史
      description: 原址截断到锚点 assistant 消息，事务删除其后历史并清理 RAG 分块。
      operationId: sessionRewind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                beforeMessageId:
                  type: integer
      responses:
        "200":
          description: 回溯结果

  # ── Queue ─────────────────────────────────────────────────────────────────
  /api/ai/queue:
    get:
      tags: [Queue]
      summary: 列出排队消息
      operationId: queueList
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 排队消息
    post:
      tags: [Queue]
      summary: 入队消息
      description: 会话由 `session_id` 查询参数决定（不在请求体里）。
      operationId: queueEnqueue
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                queueId:
                  type: string
                filePaths:
                  type: array
                  items:
                    type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileEntry"
                agentId:
                  type: string
                modelId:
                  type: string
                transport:
                  type: string
                clientId:
                  type: string
      responses:
        "200":
          description: 入队结果
    delete:
      tags: [Queue]
      summary: 删除排队消息
      description: |
        按 `queueId` 删除单条；**省略 `queueId` 时清空该会话的全部排队消息**。
        旧的按下标删除已不再支持（会返回 400）。
      operationId: queueDelete
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: queueId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 删除结果

  /api/ai/queue/inject:
    post:
      tags: [Queue]
      summary: 插入当前回复
      operationId: queueInject
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: queueId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已插入
        "409":
          description: 后端无法插入（无活跃连接），消息仍在队列

  /api/ai/queue/interrupt:
    post:
      tags: [Queue]
      summary: 中断并发送
      operationId: queueInterrupt
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: queueId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已中断

  # ── Events ────────────────────────────────────────────────────────────────
  /api/ai/events/ws:
    get:
      tags: [Events]
      summary: 事件 WebSocket（升级）
      description: |
        WebSocket 端点，承载聊天流式事件、通知与状态推送。OpenAPI 不建模升级握手：
        客户端使用 `ws(s)://<host>/api/ai/events/ws` 建连，消息为 JSON 事件对象。
        重连时服务端回放断线期间缓冲的事件（带 `replayed: true` 标记）。
      operationId: eventsWS
      responses:
        "101":
          description: Switching Protocols

  /api/ai/events/pending:
    get:
      tags: [Events]
      summary: 拉取离线期间漏发事件
      description: 按游标补偿，供 Android PendingEventsWorker 等离线回退使用。
      operationId: eventsPending
      parameters:
        - name: after
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 漏发事件

  # ── Git ───────────────────────────────────────────────────────────────────
  /api/git/branch:
    get:
      tags: [Git]
      summary: 当前分支
      operationId: gitBranch
      responses:
        "200":
          description: 分支信息
    delete:
      tags: [Git]
      summary: 删除本地分支
      operationId: gitBranchDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: 结果

  /api/git/branches:
    get:
      tags: [Git]
      summary: 分支列表
      operationId: gitBranches
      responses:
        "200":
          description: 分支列表

  /api/git/project-history:
    get:
      tags: [Git]
      summary: 项目提交历史
      operationId: gitProjectHistory
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 提交列表

  /api/git/history:
    get:
      tags: [Git]
      summary: 文件提交历史
      operationId: gitHistory
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 提交列表

  /api/git/file-diff:
    get:
      tags: [Git]
      summary: 单文件差异
      operationId: gitFileDiff
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: sha
          in: query
          required: true
          description: 提交哈希。
          schema:
            type: string
      responses:
        "200":
          description: diff 文本

  /api/git/diff:
    get:
      tags: [Git]
      summary: 差异
      operationId: gitDiff
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: commit
          in: query
          description: 可选提交哈希；省略则对比工作区。
          schema:
            type: string
      responses:
        "200":
          description: diff 文本

  /api/git/commit-files:
    get:
      tags: [Git]
      summary: 提交涉及的文件
      operationId: gitCommitFiles
      parameters:
        - name: sha
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文件列表

  /api/git/working-tree:
    get:
      tags: [Git]
      summary: 工作区状态
      description: 返回是否 git 仓库、是否有未提交改动及文件列表。取代已移除的 `/api/git/status`。
      operationId: gitWorkingTree
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 工作区状态

  /api/git/verify-commits:
    post:
      tags: [Git]
      summary: 校验提交哈希
      operationId: gitVerifyCommits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shas:
                  type: array
                  items:
                    type: string
                  description: 待校验的提交哈希列表。
      responses:
        "200":
          description: 校验结果

  /api/git/worktrees:
    get:
      tags: [Git]
      summary: 列出 worktree
      operationId: gitWorktrees
      responses:
        "200":
          description: worktree 列表
    delete:
      tags: [Git]
      summary: 删除 worktree
      operationId: gitWorktreeDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: 目标 worktree 路径（必填）。
                force:
                  type: boolean
      responses:
        "200":
          description: 结果

  /api/git/checkout:
    post:
      tags: [Git]
      summary: 切换分支 / 检出
      operationId: gitCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
                  description: 目标分支（必填）。
                stash:
                  type: boolean
                force:
                  type: boolean
      responses:
        "200":
          description: 结果

  /api/git/tags:
    get:
      tags: [Git]
      summary: 标签列表
      operationId: gitTags
      responses:
        "200":
          description: 标签列表
    delete:
      tags: [Git]
      summary: 删除标签
      operationId: gitTagDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: 结果

  # ── Files ─────────────────────────────────────────────────────────────────
  /api/dir:
    get:
      tags: [Files]
      summary: 列出目录
      description: 取代已移除的递归 `/api/files`；相对路径按项目根解析。
      operationId: dirList
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 目录条目

  /api/dir/create:
    post:
      tags: [Files]
      summary: 新建目录
      operationId: dirCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: 结果

  /api/dir/search:
    get:
      tags: [Files]
      summary: 目录搜索（SSE）
      description: Server-Sent Events 流式返回匹配项。OpenAPI 不建模事件流。
      operationId: dirSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
        - name: recursive
          in: query
          schema:
            type: boolean
        - name: exact
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string

  /api/file/list-tree:
    get:
      tags: [Files]
      summary: 目录树（下载用）
      operationId: fileListTree
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 树形条目

  /api/file/thumb:
    get:
      tags: [Files]
      summary: 图片缩略图
      description: 按绝对路径服务端缩放（png/jpg/gif），SVG 需回退到壁纸原图端点。
      operationId: fileThumb
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: w
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: JPEG 缩略图
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  /api/file/{path}:
    get:
      tags: [Files]
      summary: 读取文件内容
      description: |
        返回文本/结构化内容；二进制与不支持类型有专门处理。`{path}` 为项目相对路径。

        可选行窗口（快速预览窗格使用）：传 `lineStart`/`lineEnd` 时只返回该区间
        （1-based，闭区间）的行，并附带文件总行数 `totalLines`，避免大文件整体传输。
        行窗口只对文本文件生效；`forceText` / 二进制嗅探路径会忽略窗口并返回完整
        净化内容。窗口最多 `maxWindowLines` 行。

        非法区间（0 / 负数 / 非整数 / `lineEnd < lineStart` / 只传 `lineEnd`）一律返回
        400 `InvalidLineRange`，**与文件类型无关**——二进制文件同样先校验区间。
      operationId: fileGet
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - name: path
          in: query
          description: 绝对路径（外部文件）。
          schema:
            type: string
        - name: forceText
          in: query
          description: 置 1 时强制按文本返回。
          schema:
            type: string
        - name: lineStart
          in: query
          description: 行窗口起始行（1-based，含）。设置后仅返回该区间内容；单独使用时窗口即为该行。
          schema:
            type: integer
            minimum: 1
        - name: lineEnd
          in: query
          description: 行窗口结束行（1-based，含），须 >= lineStart。必须与 lineStart 同时提供，省略时窗口为单行 lineStart。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: |
            文件内容。带行窗口时额外返回 `totalLines`（文件总行数）、
            `windowStart`/`windowEnd`（本次返回内容覆盖的行区间，`windowEnd < windowStart`
            表示未取到任何行，如起始行超出文件末尾）、`windowTruncated`（是否因窗口上限被截断）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  name:
                    type: string
                  path:
                    type: string
                  supported:
                    type: boolean
                  isBinary:
                    type: boolean
                  truncated:
                    type: boolean
                  size:
                    type: integer
                  subtype:
                    type: string
                  specJson:
                    type: string
                  linkTarget:
                    type: string
                  isSymlink:
                    type: boolean
                  totalLines:
                    type: integer
                    description: 文件总行数（仅行窗口响应）。
                  windowStart:
                    type: integer
                    description: 返回内容起始行（1-based，含）。
                  windowEnd:
                    type: integer
                    description: |
                      返回内容结束行（1-based，含）。小于 windowStart 表示未取到任何行
                      （如起始行超出文件末尾）。该字段始终返回，便于区分「空窗口」与「无窗口元数据」。
                  windowTruncated:
                    type: boolean
                    description: 是否因窗口字节上限被截断（如存在超长行）。
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/local-file/{path}:
    get:
      tags: [Files]
      summary: 读取文件原始字节
      description: 供图片/PDF/音视频等直接渲染。项目相对路径走 URL 路径，绝对路径走 `?path=`。
      operationId: localFileGet
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - name: path
          in: query
          description: 绝对路径（外部文件）。
          schema:
            type: string
        - name: download
          in: query
          description: 置 1 时强制下载（附 Content-Disposition）。
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: 原始字节
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/file/write:
    post:
      tags: [Files]
      summary: 写入文件
      operationId: fileWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
