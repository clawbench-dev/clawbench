  # ── Tasks ─────────────────────────────────────────────────────────────────
  /api/tasks:
    get:
      tags: [Tasks]
      summary: 任务列表
      operationId: tasksList
      responses:
        "200":
          description: 任务列表
    post:
      tags: [Tasks]
      summary: 新建任务
      operationId: tasksCreate
      description: |
        创建任务。两种触发模式由 `trigger_mode` 决定：

        - `cron`（默认）：由 `cron_expr` 驱动，必填。
        - `event`：由 Forge（GitHub/GitLab）事件驱动，不需要 `cron_expr`，
          但必须提供 `event_types`（逗号分隔，且至少一个）。

        `event_types` 合法取值：`issue.opened`、`issue.closed`、`issue.reopened`、
        `issue.commented`、`pr.opened`、`pr.closed`、`pr.merged`、`pr.reopened`、
        `pr.commented`。历史拼写（不带 `issue.`/`pr.` 前缀）仍被接受。

        **cron 表达式**按服务器本地时区解释（5 字段，支持 `@daily` 等描述符）。
        没有单独的 cron 校验端点：非法表达式在创建时返回 400，这是唯一的验证方式。

        **`trigger_mode=event` 的额外语义**（与 `cron` 不同，配置时务必知晓）：

        - `repeat_mode` 与 `max_runs` 被忽略：按事件触发时不参与 cron 完成语义，
          每次匹配到事件都会执行，也不会因次数耗尽而停止。停止需 `pause` 或删除。
        - 任务**始终监听其项目绑定的仓库**（见 `GET /api/forge/binding`），
          没有按任务指定仓库的参数。项目未绑定仓库时事件不匹配，任务静默不执行
          （创建时前端会给出警告，但仍允许保存）。
        - 由**凭据账号自身**产生的动作（例如 AI 用该账号创建 PR）不触发事件，
          以防 AI 的写入自我触发形成循环。因此按事件触发时不会被自己创建的内容触发。
        - 触发时事件上下文（事件类型、仓库、编号、标题、链接、作者、状态、
          评论内容等）会**自动前置**到 `prompt` 之前，无需在 prompt 里写占位符。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, agent_id, prompt]
              properties:
                name:
                  type: string
                  description: 任务名（必填）。
                cron_expr:
                  type: string
                  description: 5 字段 cron 表达式。`trigger_mode=cron` 时必填。
                agent_id:
                  type: string
                  description: 执行任务的 agent ID（必填）。
                prompt:
                  type: string
                  description: 每次执行传给 AI 的提示词（必填）。
                repeat_mode:
                  type: string
                  enum: [once, limited, unlimited]
                  description: 重复模式，默认 `unlimited`。`trigger_mode=event` 时忽略此字段。
                max_runs:
                  type: integer
                  description: 最大执行次数，`repeat_mode=limited` 时必填且需 > 0。`trigger_mode=event` 时忽略此字段。
                session_id:
                  type: string
                  description: 预留字段，当前不生效。
                trigger_mode:
                  type: string
                  enum: [cron, event]
                  description: 触发模式，默认 `cron`。
                event_types:
                  type: string
                  description: 逗号分隔的事件订阅，`trigger_mode=event` 时必填。
      responses:
        "200":
          description: 新任务

  /api/tasks/{id}:
    get:
      tags: [Tasks]
      summary: 任务详情
      operationId: taskGet
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 任务详情
    put:
      tags: [Tasks]
      summary: 更新任务 / 删除执行记录
      description: |
        更新任务字段，并承载多种动作（`action`）：`update`、`pause`、`resume`、
        `read`、`trigger`、`cancel`、`deleteExecution`、`deleteAllExecutions`。
        删除执行记录走 `action: "deleteExecution"` + `executionId`（字符串）删除单条，
        或 `action: "deleteAllExecutions"` 清空该任务执行历史。
        **注意**：`trigger`（手动立即执行一次）对 `trigger_mode=event` 的任务不适用，
        返回 409 `TaskEventTriggerUnsupported`——事件任务的 prompt 依赖触发时注入的
        事件上下文（标题、链接、作者等字段），手动执行没有事件可注入，只会跑出
        字段未替换的无意义结果。事件任务需等待匹配的 Forge 事件触发。
        **注意**：子路径不会被父资源兜底。对 `/api/tasks/{id}/executions` 发 PUT
        返回 405，未知子路径（如 `/api/tasks/{id}/bogus`）返回 404，均不会更新任务。
      operationId: taskUpdate
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [update, pause, resume, read, trigger, cancel, deleteExecution, deleteAllExecutions]
                executionId:
                  type: string
                  description: 仅 `deleteExecution` 需要（字符串形式）。
      responses:
        "200":
          description: 结果
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Tasks]
      summary: 删除任务
      description: |
        删除整个任务（含其执行历史）。仅作用于 `/api/tasks/{id}` 本身；
        子路径不会被兜底——对 `/api/tasks/{id}/executions` 发 DELETE 返回 405，
        对未知子路径返回 404，都不会删除任务。
      operationId: taskDelete
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 结果

  /api/tasks/{id}/executions:
    get:
      tags: [Tasks]
      summary: 任务执行历史
      description: |
        该路径仅支持 GET。其他方法一律 405，不会落到父任务操作上。
        删除执行记录请用 `PUT /api/tasks/{id}` 的 `action: "deleteExecution"` 或
        `action: "deleteAllExecutions"`。
      operationId: taskExecutions
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          description: 游标；需与 `cursor_id` 同时提供才生效。
          schema:
            type: string
        - name: cursor_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 执行记录

  /api/tasks/{id}/executions/{execId}/continue:
    get:
      tags: [Tasks]
      summary: 查询续接会话是否存在
      description: 返回 `{exists, sessionId}`，供前端决定是「继续」还是「新建」。
      operationId: taskExecutionContinueCheck
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: execId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 存在性
    post:
      tags: [Tasks]
      summary: 以某次执行为起点继续对话
      operationId: taskExecutionContinue
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: execId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 结果

  # ── RAG ───────────────────────────────────────────────────────────────────
  /api/rag/search:
    post:
      tags: [RAG]
      summary: 语义 / 全文混合搜索
      description: 搜索历史对话（排除 thinking 与 tool_use 块）。
      operationId: ragSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 搜索词（必填）。
                limit:
                  type: integer
                backend:
                  type: string
                role:
                  type: string
                session_id:
                  type: string
                exclude_session_id:
                  type: string
                from:
                  type: string
                to:
                  type: string
      responses:
        "200":
          description: 匹配分块

  /api/rag/message:
    get:
      tags: [RAG]
      summary: 按 ID 取完整消息
      operationId: ragMessage
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 完整消息

  /api/rag/session:
    get:
      tags: [RAG]
      summary: 取会话全部消息
      operationId: ragSession
      parameters:
        - name: id
          in: query
          required: true
          description: 会话 ID。
          schema:
            type: string
      responses:
        "200":
          description: 会话消息

  /api/rag/status:
    get:
      tags: [RAG]
      summary: RAG 索引状态
      operationId: ragStatus
      responses:
        "200":
          description: 状态

  /api/rag/message-index-status:
    get:
      tags: [RAG]
      summary: 消息索引状态
      operationId: ragMessageIndexStatus
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 索引状态

  /api/rag/message/summarize:
    post:
      tags: [RAG]
      summary: 摘要消息
      operationId: ragMessageSummarize
      description: 为指定消息按需生成阅读摘要并返回。
      parameters:
        - name: id
          in: query
          required: true
          description: 消息数据库 ID。
          schema:
            type: integer
      responses:
        "200":
          description: 摘要结果

  /api/rag/reset-vector:
    post:
      tags: [RAG]
      summary: 仅重建向量索引
      description: 重建向量层；全文索引走 `/api/rag/rebuild-fts`。取代已移除的全量 `/api/rag/reset`。
      operationId: ragResetVector
      responses:
        "200":
          description: 结果

  /api/rag/rebuild-fts:
    post:
      tags: [RAG]
      summary: 仅重建全文索引
      operationId: ragRebuildFTS
      responses:
        "200":
          description: 结果

  /api/rag/session-search:
    post:
      tags: [RAG]
      summary: 会话聚合搜索
      operationId: ragSessionSearch
      description: |
        跨会话聚合搜索并返回命中位置，供会话搜索抽屉高亮。
        `q` 为空时进入「浏览全部」模式：列出该项目下的会话，此时
        `archived`/`sort`/`cursor` 仍然生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 搜索词；为空时列出会话而非搜索。
                backend:
                  type: string
                role:
                  type: string
                session_id:
                  type: string
                exclude_session_id:
                  type: string
                from:
                  type: string
                to:
                  type: string
                prefer_mode:
                  type: string
                  description: 强制检索模式，如 `fts`；缺省为混合检索。
                archived:
                  type: string
                  enum: [all, active, archived]
                  description: 归档筛选（字符串，非布尔）。默认 `all`。
                sort:
                  type: string
                  enum: [newest, oldest, relevance]
                  description: 排序方式，默认 `relevance`（未知值也回落到它）。
                cursor:
                  type: string
                  description: 游标时间戳；需与 `cursor_id` 同时提供才生效。
                cursor_id:
                  type: string
      responses:
        "200":
          description: 聚合结果

  /api/rag/session-first-message:
    get:
      tags: [RAG]
      summary: 会话首条消息
      operationId: ragSessionFirstMessage
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 首条消息

  # ── Upgrade ───────────────────────────────────────────────────────────────
  /api/upgrade/check:
    get:
      tags: [Upgrade]
      summary: 检查新版本
      description: |
        返回是否有可用升级；`is_docker` 指示容器部署（容器内自升级改为提示）。
        响应字段：`current_version`、`latest_version`、`has_upgrade`、
        `install_writable`、`install_dir`、`is_docker`、`verification_warning`。
        `verification_warning` 非空表示本次升级有校验无法完成，可能同时包含
        多个原因（发布签名未验证、registry 未提供完整性哈希）。前端须在
        **开始升级前**据此向用户展示并取得确认。
        唯一会中止升级的校验是「下载内容与已知哈希不符」——那是文件损坏或
        下载错误，而非仅仅无法校验。
      operationId: upgradeCheck
      responses:
        "200":
          description: 版本信息

  /api/upgrade/start:
    post:
      tags: [Upgrade]
      summary: 开始升级
      description: |
        请求体可选，字段 `verification_warning`：客户端向用户展示并取得确认的
        警告原文（无警告时省略或留空）。服务端会与本次 registry 查询得到的警告
        比对，不一致则以 `unverified_not_confirmed` 拒绝，避免未经确认就安装
        未校验的版本。
        请求体为空是合法的（表示本次升级无需确认）；请求体非法则返回 400。
      operationId: upgradeStart
      responses:
        "200":
          description: 已开始
        "400":
          description: 请求体非法
        "409":
          description: 已有升级在进行中

  /api/upgrade/status:
    get:
      tags: [Upgrade]
      summary: 升级进度
      operationId: upgradeStatus
      responses:
        "200":
          description: 进度

  # ── Proxy ─────────────────────────────────────────────────────────────────
  /api/proxy/ports:
    get:
      tags: [Proxy]
      summary: 端口转发列表
      operationId: proxyPortsList
      responses:
        "200":
          description: 端口列表
    post:
      tags: [Proxy]
      summary: 新增端口转发
      operationId: proxyPortsCreate
      responses:
        "200":
          description: 结果
    put:
      tags: [Proxy]
      summary: 更新端口转发
      operationId: proxyPortsUpdate
      responses:
        "200":
          description: 结果
    delete:
      tags: [Proxy]
      summary: 删除端口转发
      operationId: proxyPortsDelete
      responses:
        "200":
          description: 结果

  /api/proxy/ports/enabled:
    put:
      tags: [Proxy]
      summary: 启停端口转发
      operationId: proxyPortsSetEnabled
      responses:
        "200":
          description: 结果

  /api/proxy/detect:
    get:
      tags: [Proxy]
      summary: 检测端口占用
      operationId: proxyDetect
      responses:
        "200":
          description: 检测结果

  /api/openapi-proxy:
    get:
      tags: [Proxy]
      summary: CORS 代理
      description: |
        为 Swagger UI 的 "Try it out" 转发 API 请求以绕过浏览器 CORS。**透传任意 HTTP 方法**
        （含 OPTIONS 预检与 POST），仅转发 HTTP/HTTPS，过滤 hop-by-hop 头。
        生产可设 `AllowLocalProxy=false` 阻止私有 IP（防 SSRF）。
      operationId: openapiProxy
      responses:
        "200":
          description: 上游响应

  # ── SSH/FRP ───────────────────────────────────────────────────────────────
  /api/ssh/info:
    get:
      tags: [SSH/FRP]
      summary: SSH 隧道最小信息（端口发现）
      description: |
        免鉴权：Android 原生在无 WebView Cookie 时需先发现 SSH 端口，否则回退到
        错误端口导致隧道静默失败。
        仅返回 `enabled` 与 `port`。指纹、用户名、`ssh -L` 命令与连接统计
        已移至需鉴权的 `/api/ssh/info/full`——其中命令会枚举全部转发端口及其
        内网目标主机，等同于内网拓扑，不应提供给匿名调用方。
      operationId: sshInfo
      security: []
      responses:
        "200":
          description: 最小 SSH 信息（enabled、port）

  /api/ssh/info/full:
    get:
      tags: [SSH/FRP]
      summary: SSH 隧道完整信息
      description: |
        需鉴权。供 Web UI 展示隧道命令、指纹与连接统计。
        返回 host、port、username、fingerprint、command、connectionStats。
      operationId: sshInfoFull
      responses:
        "200":
          description: 完整 SSH 信息

  /api/frp/info:
    get:
      tags: [SSH/FRP]
      summary: FRP 完整状态
      description: 需鉴权（会暴露公网 IP）。
      operationId: frpInfo
      responses:
        "200":
          description: FRP 状态

  /api/frp/status:
    get:
      tags: [SSH/FRP]
      summary: FRP 最小状态
      description: 免鉴权，仅返回 enabled + running。
      operationId: frpStatus
      security: []
      responses:
        "200":
          description: 最小状态

  # ── Fonts ─────────────────────────────────────────────────────────────────
  /api/fonts/list:
    get:
      tags: [Fonts]
      summary: 自定义字体列表
      operationId: fontsList
      responses:
        "200":
          description: 字体列表

  /api/fonts/file:
    get:
      tags: [Fonts]
      summary: 读取字体文件
      operationId: fontFile
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 字体字节
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ── Upload ────────────────────────────────────────────────────────────────
  /api/upload/file:
    post:
      tags: [Upload]
      summary: 上传文件
      description: multipart 上传；除 `file` 外还支持 `dir`（目标目录）与 `relpath`（相对路径）。
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传结果

  /api/upload/recent:
    get:
      tags: [Upload]
      summary: 最近上传
      operationId: uploadRecentList
      responses:
        "200":
          description: 最近上传记录
    delete:
      tags: [Upload]
      summary: 删除一条最近上传记录
      description: 按请求体 `{path}` 删除单条记录（不是清空全部；清空需逐条调用）。
      operationId: uploadRecentClear
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果

  /api/share-in/recent:
    get:
      tags: [Upload]
      summary: 最近接收的分享
      operationId: shareInRecentList
      responses:
        "200":
          description: 记录
    delete:
      tags: [Upload]
      summary: 删除一条最近接收记录
      description: 按请求体 `{path}` 删除单条记录（不是清空全部）。
      operationId: shareInRecentClear
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果

  # ── ClientLogs ────────────────────────────────────────────────────────────
  /api/client-log:
    post:
      tags: [ClientLogs]
      summary: 回传客户端日志
      description: |
        需鉴权：这是向服务端文件追加写入的原语，匿名调用者可伪造日志行或反复触发轮转
        以销毁上一代日志。两个客户端上报时均已登录——JS 中继受「调试日志捕获」开关门控
        且仅在已认证的应用内启用，Android 的 `AppLog.startCapture` 由登录后的 WebView
        桥触发，且 WebView Cookie 与它同进程。
        仅写日志（不可读），汇入 `{LogDir}/logs/client.log`，行内带 `[js]`/`[android]`
        来源标记；50MiB 轮转到 `.1`。单请求上限 200 条，且所有字段均被清洗
        （转义换行/CR/NUL 并截断）。磁盘由字节上限与文件上限封死，故不限流。
      operationId: clientLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/ClientLogEntry"
      responses:
        "200":
          description: 写入条数

  # ── APK ───────────────────────────────────────────────────────────────────
  /api/apk:
    get:
      tags: [APK]
      summary: 下载 Android APK
      description: 免鉴权（用户需先下载安装才能登录）。从 go:embed 读取。
      operationId: apkDownload
      security: []
      responses:
        "200":
          description: APK 字节
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: clawbench_session
      description: 登录后下发的会话 Cookie；CLI 使用 `<DataDir>/cookie-token`。
    aiToken:
      type: apiKey
      in: header
      name: X-ClawBench-AI-Token
      description: |
        本机 AI 子进程使用的短时令牌，由内置斜杠命令（`/cb-task` 等）在注入提示词时签发，
        有效期 30 分钟，以 `CookieToken` 做 HMAC 签名。仅接受来自回环地址的请求：
        地址与签名须同时成立。地址单独不再放行——FRP 隧道的 frpc 亦从 `127.0.0.1` 回拨。

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    FilePath:
      name: path
      in: path
      required: true
      description: 项目相对路径（可含 `/`）。
      schema:
        type: string

  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      description: 统一错误体。
      properties:
        error:
          type: string
        code:
          type: string
        msgKey:
          type: string
          description: i18n 消息键，前端据此本地化。
        detail:
          description: 可选的附加细节。
      required: [error]

    FileEntry:
      type: object
      description: |
        附件条目，可为本地文件/目录，也可为**外部链接**（`kind=url`）。
        链接条目不参与文件系统校验，且其地址会以
        `[Referenced external link: <url>]` 前缀注入 AI 的 prompt。
      properties:
        path:
          type: string
          description: 本地路径；`kind=url` 时为人类可读标签（如 `owner/repo#123`）。
        isDir:
          type: boolean
        startLine:
          type: integer
        endLine:
          type: integer
        kind:
          type: string
          enum: [file, url]
          description: 缺省为本地文件；`url` 表示外部地址。
        url:
          type: string
          description: 外部地址，仅当 `kind=url` 时使用；只接受 http(s)。

    GalleryItem:
      type: object
      description: |
        图库中的一张图片，由 `POST /api/theme/local/upload` 返回。
        注意：绝对路径 `abs_path` 不在此响应中，只出现在 `GET /api/config` 的
        `appearance.local.items[]` 里。
      properties:
        file:
          type: string
          description: 存储用的生成文件名。
        name:
          type: string
          description: 上传时的原始文件名。
        uploaded_at:
          type: integer
        size:
          type: integer

    WallpaperState:
      type: object
      description: 壁纸变更端点统一返回的状态。
      properties:
        mode:
          type: string
          enum: [local, bing]
        enabled:
          type: boolean
        active_file:
          type: string
        selected:
          type: string

    BingStatus:
      type: object
      properties:
        enabled:
          type: boolean
        file:
          type: string
        last_success_date:
          type: string
        copyright:
          type: string
        title:
          type: string
        mkt:
          type: string
        last_error:
          type: string
        last_attempt_at:
          type: integer

    ClientLogEntry:
      type: object
      properties:
        level:
          type: string
          enum: [D, I, W, E]
        tag:
