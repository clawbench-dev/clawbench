  # ── Events ────────────────────────────────────────────────────────────────
  /api/ai/events/ws:
    get:
      tags: [Events]
      summary: 事件 WebSocket（升级）
      description: |
        WebSocket 端点，承载聊天流式事件、通知与状态推送。OpenAPI 不建模升级握手：
        客户端使用 `ws(s)://<host>/api/ai/events/ws` 建连，消息为 JSON 事件对象。
        重连时服务端回放断线期间缓冲的事件（带 `replayed: true` 标记）。

        客户端消息类型：`subscribe` / `unsubscribe` / `cancel` /
        `permission_respond` / `ack` / `pong` / `metrics_preference`。
        `metrics_preference` 声明是否订阅系统资源推送及速率
        （`{"type":"metrics_preference","metrics_enabled":true,"metrics_interval_ms":1000}`），
        服务端据此按需采样并推送 `system_resources` 事件；该事件不进回放缓冲。
      operationId: eventsWS
      responses:
        "101":
          description: Switching Protocols

  /api/ai/events/pending:
    get:
      tags: [Events]
      summary: 拉取离线期间漏发事件
      description: 按游标补偿，供 Android PendingEventsWorker 等离线回退使用。
      operationId: eventsPending
      parameters:
        - name: after
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 漏发事件

