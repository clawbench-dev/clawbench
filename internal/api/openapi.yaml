openapi: "3.0.3"
info:
  title: ClawBench API
  description: |
    ClawBench 的完整 HTTP API。所有 `/api/` 路由默认经 `middleware.Auth`
    鉴权（会话 Cookie，或本机 AI 子进程的短时 `aiToken`），少数端点刻意免鉴权
    （见各 operation 的 `security: []`）。
    聊天流式内容通过 WebSocket 推送（见 `/api/ai/events/ws`），不在本文件建模。

    约定：
    - 统一错误体见 `components/schemas/ErrorResponse`。
    - 项目范围通过 `clawbench_project` Cookie 或 `project_path` 查询参数传递。
    - 时间戳为 epoch 毫秒（除显式说明外）。
  version: "1.0.0"

servers:
  - url: /
    description: 同源（文件管理器内的 Swagger UI 直接可用）

tags:
  - name: Auth
    description: 登录、会话与健康检查
  - name: System
    description: 系统资源与统计
  - name: Config
    description: 服务端配置读写与自检
  - name: Theme
    description: 壁纸与外观
  - name: Projects
    description: 项目与根目录
  - name: Chat
    description: 聊天、消息与推荐
  - name: Sessions
    description: 会话生命周期
  - name: Queue
    description: 排队消息
  - name: Events
    description: 事件推送与离线补偿
  - name: Git
    description: Git 仓库操作
  - name: Files
    description: 文件浏览、读写与目录
  - name: Share
    description: 文件分享链接
  - name: Forge
    description: GitHub / GitLab 集成
  - name: Agents
    description: AI Agent 与后端
  - name: TTS
    description: 语音合成
  - name: STT
    description: 语音识别
  - name: Terminal
    description: Web 终端
  - name: Tasks
    description: 任务
  - name: RAG
    description: 检索增强
  - name: Upgrade
    description: 应用自升级
  - name: Proxy
    description: 端口转发与 CORS 代理
  - name: SSH/FRP
    description: 隧道状态
  - name: Fonts
    description: 自定义字体
  - name: Upload
    description: 上传与最近记录
  - name: ClientLogs
    description: 客户端日志回传
  - name: APK
    description: Android 安装包

security:
  - cookieAuth: []
  - aiToken: []

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /login:
    get:
      tags: [Auth]
      summary: 登录页面
      description: 返回登录 HTML 页面（非 API）。
      operationId: loginPage
      security: []
      responses:
        "200":
          description: 登录页 HTML
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Auth]
      summary: 登录
      description: 校验密码并下发会话 Cookie。无需鉴权（登录本身即入口）。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          description: 登录成功，设置会话 Cookie
        "401":
          $ref: "#/components/responses/Error"

  /api/health:
    get:
      tags: [Auth]
      summary: 健康检查
      description: 免鉴权的存活探针。
      operationId: health
      security: []
      responses:
        "200":
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                  version:
                    type: string

  /api/me:
    get:
      tags: [Auth]
      summary: 当前会话状态
      description: 免鉴权，供前端判断是否需要登录（返回是否已认证）。
      operationId: me
      security: []
      responses:
        "200":
          description: 认证状态

  /api/config/password:
    post:
      tags: [Auth]
      summary: 修改密码
      operationId: configPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: 修改成功
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: 当前密码错误
        "429":
          description: 尝试过于频繁

  # ── System ────────────────────────────────────────────────────────────────
  /api/system/resources:
    get:
      tags: [System]
      summary: 系统资源实时指标
      description: |
        CPU、内存、磁盘、网络等指标快照，供程序化访问 / 健康检查使用。

        UI 已改为 WebSocket 推送，不再轮询本端点：客户端通过
        `/api/ai/events/ws` 发送 `metrics_preference` 声明订阅速率
        （前台 1000ms / 后台 5000ms / 关闭），服务端仅在存在订阅者时
        按最快请求速率采样并推送 `system_resources` 事件。
        本端点保留给无 WS 能力的调用方，不使用时零成本（采样是惰性的）。
      operationId: systemResources
      responses:
        "200":
          description: 指标快照

  /api/ws/delivery-stats:
    get:
      tags: [System]
      summary: WebSocket 事件投递丢弃计数
      description: |
        统计「已产生但未投递」的流式事件，按原因分组。

        事件投递此前是静默失败的：会话没有活跃订阅者时事件被直接丢弃，
        既无日志也无计数，导致「UI 卡在缺少终态事件」与「后端根本没发」
        在日志上完全无法区分。此端点让这类丢失可观测。

        **响应字段**：
        - `no_subscribers`：为无活跃订阅者的会话发出的事件数。非 0 即值得
          排查——通常意味着客户端订阅已丢失（WS 重连）而其 UI 仍认为在订阅中。
        - `no_manager`：WS manager 不可用时丢弃的事件数（启动/关闭窗口内正常）。
        - `total`：两者之和。
      operationId: wsDeliveryStats
      responses:
        "200":
          description: 丢弃计数快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  no_subscribers:
                    type: integer
                  no_manager:
                    type: integer
                  total:
                    type: integer

  /api/roots:
    get:
      tags: [System]
      summary: 可访问的根路径
      operationId: roots
      responses:
        "200":
          description: 根路径列表

  /api/usage/stats:
    get:
      tags: [System]
      summary: 用量统计
      description: |
        按维度聚合 `chat_metadata` 的 token / 成本统计。

        **项目范围**由 `scope` 决定：
        - `scope=project`（默认）：限制在项目 Cookie 指定的单个项目内，Cookie
          必填。浏览器面板走这条路径。Cookie 值可以是任意项目路径。
        - `scope=all`：聚合实例内**全部项目**，仅授予携带本机 AI 令牌的调用方
          （`/cb-usage` 斜杠命令）；浏览器会话请求会被拒绝。该模式要求**不**发送
          项目 Cookie，同时发送两者返回 400。跨项目统计通常配合 `dims=project`。

        `dims` 合法值含 `project`，但只在 `scope=all` 下有区分度——单项目范围内
        所有行项目相同。

        **响应结构**：
        - `totals`：所有行的合计，字段 `input` / `output` / `total` / `cacheHit` /
          `cacheMiss` / `credit` / `costUsd` / `messageCnt`。
        - `rows[]`：每个 dim 组合一行。`key` 是对象，键即请求的 dims
          （如 `{"model":"...","backend":"..."}`），行上带有与 `totals` 相同的字段。
          行的顺序由 `sort` / `order` 决定，`limit` 截断。
        - `trend[]`：仅 `trend=1` 时返回，在 `rows[]` 的基础上多一个 `day`
          （`YYYY-MM-DD`），用于按天走势图。

        注意 `chat_metadata.created_at` 记录的是元数据**最终写入**时刻
        （约等于助手回复完成），不是用户提问时刻。
      operationId: usageStats
      parameters:
        - name: scope
          in: query
          description: |
            统计范围。默认 `project`（限制在项目 Cookie 指定的项目内）。
            `all` 聚合实例内全部项目，仅本机 AI 令牌可用，且必须不带项目 Cookie。
          schema:
            type: string
            enum: [project, all]
        - name: start
          in: query
          required: true
          description: 起始时间（RFC3339）。
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 结束时间（RFC3339）。
          schema:
            type: string
            format: date-time
        - name: dims
          in: query
          required: true
          description: |
            聚合维度。**重复该参数**以多维分组（1..4 个，不可重复）——
            例如 `dims=model&dims=backend`。逗号分隔会被拒绝。
            合法值为 `model` / `backend` / `agent` / `project`；`project`
            只在 `scope=all` 下有区分度。
          schema:
            type: array
            items:
              type: string
              enum: [model, backend, agent, project]
        - name: metrics
          in: query
          required: true
          description: |
            指标。**重复该参数**（至少 1 个）——例如 `metrics=input&metrics=total`。
            逗号分隔会被拒绝。
          schema:
            type: array
            items:
              type: string
              enum: [input, output, total, cacheHit, credit, cost]
        - name: sort
          in: query
          description: 排序用的指标 id，默认 `total`。
          schema:
            type: string
        - name: order
          in: query
          description: 排序方向，默认 `desc`。
          schema:
            type: string
            enum: [asc, desc]
        - name: trend
          in: query
          description: 传 `1` 时额外返回按天分组的 `trend[]`。
          schema:
            type: string
        - name: top
          in: query
          description: trend 模式下保留的 dim 组合数，默认 10。
          schema:
            type: integer
        - name: limit
          in: query
          description: 最大行数，默认 50，上限 200。
          schema:
            type: integer
      responses:
        "200":
          description: 聚合结果

  /api/git/stats:
    get:
      tags: [System]
      summary: Git 仓库统计
      description: 代码增量统计（时间窗内）。
      operationId: gitStats
      parameters:
        - name: start
          in: query
          required: true
          description: 起始时间（RFC3339）。
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 结束时间（RFC3339）。
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 提交数、贡献者等

  /api/git/cloc:
    get:
      tags: [System]
      summary: 代码行数统计
      description: |
        对当前工作区做快照式盘点（gocloc），按语言统计代码/注释/空白行与文件数。

        排除分两层取交集：一是内置的构建产物/依赖目录名与生成文件后缀正则；
        二是项目自身的 .gitignore 规则（含嵌套 .gitignore 与 .git/info/exclude），
        已跟踪文件即使命中规则也会保留。非 git 仓库时只应用第一层。
      operationId: gitCloc
      responses:
        "200":
          description: 按语言的行数统计

  # ── Config ────────────────────────────────────────────────────────────────
  /api/config:
    get:
      tags: [Config]
      summary: 读取服务端配置
      description: |
        返回完整配置（密码等敏感字段被剥离）。`appearance.active_file` 由服务端
        按 mode/enabled/选中项解析后下发。
      operationId: getConfig
      responses:
        "200":
          description: 配置对象
    patch:
      tags: [Config]
      summary: 局部更新配置
      description: |
        仅白名单内的键可写；类型不符直接 400（避免写入后 `yaml.Unmarshal` 失败）。
        文件名类键（`appearance.local.selected`/`local.items`/`bing.file`）不在白名单，
        须经专用端点写入。
      operationId: patchConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 更新结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_restart:
                    type: boolean
                  changed_cold_fields:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/Error"

  /api/config/test:
    post:
      tags: [Config]
      summary: 测试配置连通性
      description: 例如测试 TTS/推送/模型服务连通性。
      operationId: configTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                values:
                  type: object
      responses:
        "200":
          description: 测试结果

  /api/config/restart:
    post:
      tags: [Config]
      summary: 重启服务
      operationId: configRestart
      responses:
        "200":
          description: 已触发重启

  # ── Theme ─────────────────────────────────────────────────────────────────
  /api/theme/local/upload:
    post:
      tags: [Theme]
      summary: 上传图库图片
      description: multipart，字段名 `files`（可多个）。逐文件尽力处理，失败项进 `errors`。
      operationId: themeLocalUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: 上传结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GalleryItem"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        error:
                          type: string

  /api/theme/local/item:
    delete:
      tags: [Theme]
      summary: 删除图库图片
      operationId: themeLocalItemDelete
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除后的壁纸状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperState"

  /api/theme/local/select:
    post:
      tags: [Theme]
      summary: 选中图库图片为当前壁纸
      operationId: themeLocalSelect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: 壁纸状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperState"

  /api/theme/wallpaper:
    post:
      tags: [Theme]
      summary: 切换壁纸来源 / 总开关
      description: 仅应用传入的字段。切到 `bing` 会同步打开抓取开关并立即触发一次抓取。
      operationId: themeWallpaperMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [local, bing]
                enabled:
                  type: boolean
      responses:
        "200":
          description: 壁纸状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperState"

  /api/theme/bing/sync:
    post:
      tags: [Theme]
      summary: 立即抓取 Bing 每日壁纸
      description: 后台执行，结果轮询 `/api/theme/bing/status`。
      operationId: themeBingSync
      responses:
        "202":
          description: 已受理，返回当前 Bing 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BingStatus"

  /api/theme/bing/status:
    get:
      tags: [Theme]
      summary: Bing 壁纸状态
      operationId: themeBingStatus
      responses:
        "200":
          description: 状态与署名
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BingStatus"

  /api/file/theme-wallpaper:
    get:
      tags: [Theme]
      summary: 读取单张壁纸图片
      description: 按裸文件名（图库或 Bing）流式返回图片，带缓存与安全头。
      operationId: themeWallpaperGet
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 图片字节
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

  # ── Projects ──────────────────────────────────────────────────────────────
  /api/projects:
    get:
      tags: [Projects]
      summary: 列出项目目录
      description: |
        列出任意目录，用于项目选择与**项目外目录浏览**：`path` 可为绝对路径
        （在配置的根路径下校验）或相对路径（按第一个根路径解析）。空/`/`
        时列出根层级（Windows 为盘符列表）。条目结构与 `/api/dir` 的
        DirEntry 一致，故文件管理器浏览项目外目录时复用同一套渲染与操作。
      operationId: projectsList
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 目录条目
    post:
      tags: [Projects]
      summary: 创建项目目录
      operationId: projectsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: 创建结果

  /api/project:
    get:
      tags: [Projects]
      summary: 读取当前项目
      operationId: projectGet
      responses:
        "200":
          description: 当前项目
    post:
      tags: [Projects]
      summary: 设置当前项目
      operationId: projectSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 设置结果

  /api/conversation-projects:
    get:
      tags: [Projects]
      summary: 有对话历史的项目列表
      description: |
        列出所有产生过对话的项目，按最近活动时间倒序。目录已被删除的项目也会列出
        （响应中的 `exists` 为 false），因此历史对话仍可检索。
      operationId: conversationProjectsList
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: 项目目录路径（目录可能已被删除）
                        session_count:
                          type: integer
                          description: 该项目记录的会话数
                        last_active_at:
                          type: string
                          description: 最近一次活动时间（UTC，`2006-01-02 15:04:05`）
                        exists:
                          type: boolean
                          description: 目录当前是否仍存在于磁盘上

  /api/recent-projects:
    get:
      tags: [Projects]
      summary: 最近项目（按 git 仓库分组）
      description: |
        返回最近项目，按 git 仓库分组。同一仓库的多个路径（主仓库、链接工作树、
        作为独立项目打开的仓库内子目录）归入同一组，便于客户端展示从属关系；
        不属于任何仓库的路径各自成组（`items` 长度为 1）。
        排序由服务端决定：组按组内最近访问时间倒序，组内按各自访问时间倒序。
      operationId: recentProjectsList
      responses:
        "200":
          description: 最近项目分组列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    repoRoot:
                      type: string
                      description: 仓库主工作树根目录；非仓库分组为空字符串
                    groupName:
                      type: string
                      description: 分组显示名（repoRoot 的目录名）；非仓库分组为空字符串
                    items:
                      type: array
                      description: 组内路径，按访问时间倒序
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                          kind:
                            type: string
                            enum: [main, worktree, subdir, plain]
                            description: |
                              main=仓库主工作树；worktree=链接工作树；
                              subdir=仓库内子目录（非仓库根）；plain=不属于任何仓库
    post:
      tags: [Projects]
      summary: 记录最近项目
      operationId: recentProjectsAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果
    delete:
      tags: [Projects]
      summary: 删除一条最近项目
      description: 按请求体 `{path}` 删除单条记录。
      operationId: recentProjectsClear
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
      responses:
        "200":
          description: 结果

  # ── Chat ──────────────────────────────────────────────────────────────────
  /api/ai/chat:
    get:
      tags: [Chat]
      summary: 聊天历史与运行状态
      description: |
        分页返回会话消息，并附带运行状态与 ACP 状态。`session_id` 缺省时回退到会话 Cookie。

        **`modelListState` 与 `/api/agents` 同构**：返回原始 ACP 列表 `models`、
        未经合并的纯 CLI 列表 `cliModels`，以及已解析的最终列表 `resolvedModels`
        （CLI 提供顺序与名称，具体 ACP 列表对成员资格有权威性；档位别名只取其
        显示名）。客户端直接渲染 `resolvedModels`，无需自行合并。

        新建会话从不与 ACP 通信，其模型列表只能来自这里（后端从 agent 级能力
        注册表解析）。CLI 会话不返回该字段。当 agent 没有 CLI 列表可合并时，
        `resolvedModels` 为空但 `models` 仍会返回，避免整个列表丢失。
      operationId: chatGet
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          description: 整数游标，取该 id 之前的消息。
          schema:
            type: integer
        - name: before
          in: query
          description: 时间戳游标（legacy，兼容旧客户端；优先用 `before_id`）。
          schema:
            type: string
      responses:
        "200":
          description: 消息列表与状态
    post:
      tags: [Chat]
      summary: 发送聊天消息
      description: |
        发送一条用户消息并启动 AI 流式响应。流式事件经 `/api/ai/events/ws` 推送。
        会话由 `session_id` 查询参数（或会话 Cookie）决定，**不在请求体里**。
      operationId: chatSend
      parameters:
        - name: session_id
          in: query
          description: 目标会话；缺省时回退到会话 Cookie。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                queueId:
                  type: string
                  description: 排队消息标识（忙碌时入队用）。
                filePaths:
                  type: array
                  items:
                    type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileEntry"
                agentId:
                  type: string
                modelId:
                  type: string
                thinkingEffort:
                  type: string
                modeId:
                  type: string
                transport:
                  type: string
                clientId:
                  type: string
      responses:
        "200":
          description: 已受理

  /api/ai/chat/cancel:
    post:
      tags: [Chat]
      summary: 取消当前生成
      operationId: chatCancel
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已取消

  /api/ai/chat/quote:
    patch:
      tags: [Chat]
      summary: 修改已发送消息中引用的批注
      description: |
        引用以结构化条目（`kind=quote`）持久化在消息的 `files` 中，因此发送后修改批注
        是一次定向写入，而非重写消息文本。
        引用按其稳定 `quoteId` 定位（见 `FileEntry.id`）；用数组下标在条目增删后会错位。
        修改只影响**下一轮** AI 看到的提示词（每轮由存储的 `files` 重建），
        不会追溯改变已在执行中的回合。
      operationId: chatQuoteUpdateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId, quoteId]
              properties:
                sessionId:
                  type: string
                  description: 目标会话；缺省时回退到查询参数 / Cookie。
                messageId:
                  type: integer
                  description: 承载该引用的用户消息 ID。
                quoteId:
                  type: string
                  description: 引用的稳定 ID（`FileEntry.id`）。
                note:
                  type: string
                  description: 新的批注内容（可为空字符串以清空）。
      responses:
        "200":
          description: 已更新，返回该消息更新后的附件条目
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
        "404":
          description: 未找到该引用（消息不存在、非用户消息、或 quoteId 不匹配）

  /api/ai/chat/read:
    post:
      tags: [Chat]
      summary: 标记会话已读
      operationId: chatRead
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已标记

  /api/ai/chat/user-messages:
    get:
      tags: [Chat]
      summary: 用户消息索引
      description: 轻量返回该会话的用户消息列表（`{messages:[...]}`），供消息导航。
      operationId: chatUserMessages
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 用户消息索引
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      description: 用户消息（含 id / content / files / createdAt / role 等）。

  /api/ai/chat/tool-call:
    get:
      tags: [Chat]
      summary: 工具调用详情
      description: 按 tool_id + message_id 取完整输入输出；失败时可用 session_id 回退查找。
      operationId: chatToolCall
      parameters:
        - name: tool_id
          in: query
          required: true
          schema:
            type: string
        - name: message_id
          in: query
          required: true
          schema:
            type: integer
        - name: session_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 工具调用记录
        "404":
          $ref: "#/components/responses/Error"

  /api/ai/chat/thinking:
    get:
      tags: [Chat]
      summary: 思考内容详情
      operationId: chatThinking
      parameters:
        - name: think_id
          in: query
          required: true
          schema:
            type: string
        - name: message_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 思考内容

  /api/ai/permission/respond:
    post:
      tags: [Chat]
      summary: 回应权限审批
      operationId: permissionRespond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                toolCallId:
                  type: string
                  description: ACP 工具调用 ID。
                optionId:
                  type: string
                  description: 选中的权限选项；空字符串表示取消。
                cancelled:
                  type: boolean
      responses:
        "200":
          description: 已回应

  /api/chat/quick-send:
    get:
      tags: [Chat]
      summary: 列出聊天快捷发送
      operationId: quickSendList
      responses:
        "200":
          description: 快捷发送列表
    post:
      tags: [Chat]
      summary: 新建聊天快捷发送
      operationId: quickSendCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                command:
                  type: string
                project_only:
                  type: boolean
      responses:
        "200":
          description: 新建结果

  /api/chat/quick-send/reorder:
    put:
      tags: [Chat]
      summary: 批量重排聊天快捷发送
      description: 注意重排路径是 `/api/chat/quick-send/reorder`，不是 `/api/chat/quick-send`。
      operationId: quickSendReorder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: 结果

  /api/chat/quick-send/{id}:
    put:
      tags: [Chat]
      summary: 更新聊天快捷发送
      operationId: quickSendUpdate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 更新结果
    delete:
      tags: [Chat]
      summary: 删除聊天快捷发送
      operationId: quickSendDelete
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 结果

  /api/chat/recommendation:
    get:
      tags: [Chat]
      summary: 下一步推荐
      description: 拉取当前会话的推荐问题（离线时也通过此端点补偿）。
      operationId: chatRecommendation
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 推荐内容

  /api/chat/message-clusters:
    get:
      tags: [Chat]
      summary: 消息聚类结果
      description: 返回全局聚类结果（不按会话过滤）。
      operationId: messageClusters
      responses:
        "200":
          description: 聚类

  /api/chat/message-clusters/compute:
    post:
      tags: [Chat]
      summary: 触发消息聚类计算
      operationId: messageClustersCompute
      responses:
        "200":
          description: 已触发
        "409":
          description: 已有计算在运行

  /api/chat/message-clusters/compute/cancel:
    post:
      tags: [Chat]
      summary: 取消消息聚类计算
      operationId: messageClustersComputeCancel
      responses:
        "200":
          description: 已取消

  /api/chat/message-clusters/compute/status:
    get:
      tags: [Chat]
      summary: 消息聚类计算状态
      operationId: messageClustersComputeStatus
      responses:
        "200":
          description: 状态

  # ── Sessions ──────────────────────────────────────────────────────────────
  /api/ai/sessions:
    get:
      tags: [Sessions]
      summary: 会话列表
      operationId: sessionsList
      parameters:
        - name: cursor
          in: query
          description: 游标；上一页最后一行的 `createdAt`，需与 `cursor_id` 同时提供才生效。
          schema:
            type: string
        - name: cursor_id
          in: query
          schema:
            type: string
        - name: cursor_sort_order
          in: query
          description: |
            游标；上一页最后一行的 `sortOrder`。
            排序为 `pinned DESC, sort_order ASC, created_at DESC, id DESC`，
            游标必须同时携带 sort_order 与 pinned，否则同一 (pinned, sort_order) 的行会在每一页重复返回。
            省略时退回旧的 created_at-only 行为。
          schema:
            type: integer
        - name: cursor_pinned
          in: query
          description: |
            游标；上一页最后一行的 `pinned`（`1`/`0`）。置顶会话是固定在最前的区块，
            游标必须携带它才能正确翻页。省略时退回旧的 created_at-only 行为。
          schema:
            type: integer
            enum: [0, 1]
        - name: limit
          in: query
          schema:
            type: integer
        - name: tag
          in: query
          description: |
            仅返回带有该标签的会话（标签需在本项目可见：全局标签或本项目标签）。
            在服务端过滤，因此 `hasMore` 反映的是过滤后的集合。
            大小写不敏感；省略或空值表示不按标签过滤。
          schema:
            type: string
      responses:
        "200":
          description: 会话列表
    post:
      tags: [Sessions]
      summary: 新建会话
      operationId: sessionsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                agentId:
                  type: string
                backend:
                  type: string
      responses:
        "200":
          description: 新会话

  /api/ai/sessions/reorder:
    put:
      tags: [Sessions]
      summary: 持久化会话手动排序
      description: |
        拖拽排序后写回会话顺序。请求体 `ids` 是**当前可见的完整顺序**，
        第 i 个会话的 `sort_order` 变为 i（0 在最上）。
        只作用于当前项目、`session_type='chat'`、**未置顶且未归档**的会话：
        置顶会话是固定在最前的区块（`pinned DESC` 为第一排序键），不参与重排，
        出现在 ids 中也会被忽略；归档会话不在列表中，也绝不被重编号
        （否则每次拖拽都会重写项目里全部归档行，实测 1993 行/3 秒）。
        未出现在 ids 中的可见会话按原有相对顺序接在其后。
        新建会话 `sort_order` 默认为 0，靠 `created_at DESC` 的并列规则落在最上。
      operationId: sessionsReorder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: 按目标顺序排列的会话 ID 列表
      responses:
        "200":
          description: 已重排

  /api/ai/sessions/overview:
    get:
      tags: [Sessions]
      summary: 会话总览
      operationId: sessionsOverview
      responses:
        "200":
          description: 各项目会话概览

  /api/ai/session/update:
    patch:
      tags: [Sessions]
      summary: 即时持久化会话设置
      description: 模式 / 思考深度 / 模型 / 传输方式的变更即时写库，无需发消息。会话由 `session_id` 查询参数（或会话 Cookie）决定。
      operationId: sessionUpdate
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modeId:
                  type: string
                thinkingEffort:
                  type: string
                modelId:
                  type: string
                transport:
                  type: string
                autoApprove:
                  type: boolean
                title:
                  type: string
                pinned:
                  type: boolean
                tags:
                  type: array
                  description: |
                    替换该会话的完整标签集合（整表覆盖，不是增量）。字段省略 = 不改动标签；
                    传 `[]` = 清空该会话的全部标签。不存在的标签会按 `scope` 新建，
                    已存在的标签保留其原有 scope（重新打标签不会把项目标签变成全局标签）。
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      scope:
                        type: string
                        enum: [project, global]
                        description: 仅对新建标签生效；缺省为 `project`
      responses:
        "200":
          description: 已更新

  /api/ai/session/tags:
    get:
      tags: [Sessions]
      summary: 会话标签候选列表
      description: 返回当前项目可选的标签：全部全局标签 + 当前项目自己的标签。同名时全局定义优先。
      operationId: sessionTagsList
      parameters:
        - name: inUse
          in: query
          description: |
            传 `1` 时只返回「本项目已有会话在使用」的标签（带使用计数），
            供会话列表的标签过滤栏使用；省略时返回全部可选候选（含未被使用的
            全局标签），供标签设置弹窗使用。
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: 标签候选列表
    delete:
      tags: [Sessions]
      summary: 删除标签本身
      description: |
        删除标签定义及其在所有会话上的关联，即该标签从所有会话消失。
        全局标签任意项目可删；项目标签只能由所属项目删除（其他项目看不到它）。
      operationId: sessionTagsDelete
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          description: |
            要删除的定义的作用范围（`project`/`global`），即客户端在候选列表中看到的那一条。
            同名标签同时存在全局与项目内两条时，必须传 scope 才能精确删除；
            省略则退回旧的「全局优先，其次本项目」查找，可能删掉其他项目共享的全局标签。
          schema:
            type: string
            enum: [project, global]
      responses:
        "200":
          description: 已删除
        "400":
          description: 缺少 name，或标签不存在 / 属于其他项目

  /api/ai/session/archive:
    delete:
      tags: [Sessions]
      summary: 归档会话
      operationId: sessionArchive
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: backend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 归档结果

  /api/ai/session/destroy:
    delete:
      tags: [Sessions]
      summary: 销毁会话（不可逆）
      operationId: sessionDestroy
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 销毁结果

  /api/ai/session/resume:
    post:
      tags: [Sessions]
      summary: 恢复会话
      operationId: sessionResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: 恢复结果

  /api/ai/session/acp-load:
    post:
      tags: [Sessions]
      summary: ACP 显式 LoadSession
      description: 强制触发一次 ACP LoadSession 回放（慢，仅显式调用）。
      operationId: sessionACPLoad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                acpSessionId:
                  type: string
      responses:
        "200":
          description: 回放结果

  /api/ai/session/acp-sync:
    post:
      tags: [Sessions]
      summary: ACP 会话同步
      description: 对比 ACP 回放消息与本地记录，仅补插缺失消息。
      operationId: sessionACPSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                sessionId:
                  type: string
      responses:
        "200":
          description: 同步结果

  /api/ai/session/fork:
    post:
      tags: [Sessions]
      summary: 分叉会话
      description: 请求体字段均可选；缺省时回退到查询参数 / 会话 Cookie。
      operationId: sessionFork
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                beforeMessageId:
                  type: integer
                agentId:
                  type: string
      responses:
        "200":
          description: 新会话

  /api/ai/session/reset:
    post:
      tags: [Sessions]
      summary: 重置卡死会话
      description: 保留外部会话 ID 映射，仅回收 agent 进程，历史完整保留。
      operationId: sessionReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
      responses:
        "200":
          description: 重置结果

  /api/ai/session/rewind:
    post:
      tags: [Sessions]
      summary: 回溯会话历史
      description: 原址截断到锚点 assistant 消息，事务删除其后历史并清理 RAG 分块。
      operationId: sessionRewind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                beforeMessageId:
                  type: integer
      responses:
        "200":
          description: 回溯结果

  # ── Queue ─────────────────────────────────────────────────────────────────
  /api/ai/queue:
    get:
      tags: [Queue]
      summary: 列出排队消息
      operationId: queueList
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 排队消息
    post:
      tags: [Queue]
      summary: 入队消息
      description: 会话由 `session_id` 查询参数决定（不在请求体里）。
      operationId: queueEnqueue
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                queueId:
                  type: string
                filePaths:
                  type: array
                  items:
                    type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileEntry"
                agentId:
                  type: string
                modelId:
                  type: string
                transport:
                  type: string
                clientId:
                  type: string
      responses:
        "200":
          description: 入队结果
    delete:
      tags: [Queue]
      summary: 删除排队消息
      description: |
        按 `queueId` 删除单条；**省略 `queueId` 时清空该会话的全部排队消息**。
        旧的按下标删除已不再支持（会返回 400）。
      operationId: queueDelete
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: queueId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 删除结果

  /api/ai/queue/inject:
    post:
      tags: [Queue]
      summary: 插入当前回复
      operationId: queueInject
