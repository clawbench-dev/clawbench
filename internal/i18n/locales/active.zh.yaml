# IM 推送（钉钉 / 飞书）——机器人写进用户聊天里的文案。推送后端跑在各自
# goroutine 里、没有 HTTP 请求上下文，故与 AutoContinue 一样走
# LocalizerForLocale(model.Language) 本地化。钉钉渲染 sampleMarkdown、飞书渲染
# 交互式卡片，少数文案仅强调或语序不同，故按平台分列以保留各自既有输出。
