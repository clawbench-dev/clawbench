# IM push (DingTalk / Feishu) — the strings the bot writes into the user's chat.
# The push backends run on their own goroutines with no HTTP request in scope,
# so they localize via LocalizerForLocale(model.Language), exactly like
# AutoContinue. DingTalk renders sampleMarkdown; Feishu renders an interactive
# card, so a few strings differ only in emphasis or word order and are kept
# separate to preserve each platform's existing output.
