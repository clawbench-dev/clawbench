# Config for the REAL clawbench server used by Tier 2's **negative-config
# probe** — the control that proves the 503 branch is real and reachable.
#
# This is the one and only combination that legitimately leaves the h2 tunnel
# endpoints unavailable:
#
#   port_forward.enabled: false   # SSH listener off
#   port_forward.transport: ssh   # h2 explicitly excluded
#
# `shouldCreateProxyRegistry` (cmd/server/proxy_registry_gate.go) is
# `Enabled || Transport != "ssh"`, so this is the single "no" cell: no SSH
# listener and no h2, therefore no ProxyRegistry. With `service.ProxyService`
# nil, both tunnel handlers take their nil guard
# (internal/handler/tunnel_stream.go, tunnel_control.go) and answer
# 503 PortForwardUnavailable.
#
# The DEFAULT config (server-config/config.yaml) is `enabled: false,
# transport: h2`, which MUST still create the registry and answer 401/200
# rather than 503. That is the regression `tests/tunnel.server.mjs` guards by
# status class; THIS config is the control that makes the 503 assertion
# meaningful rather than vacuous.
#
# WHY A DIFFERENT PORT (20002): this server runs *alongside* the h2 server in
# the same emulator network namespace for the whole Tier 2 phase. Two listeners
# cannot share :20000, so this one takes 20002. That is far cheaper than a
# second emulator boot + wdio session just to observe one status code, and it
# keeps the 503 assertion in the same spec file as the 401 one it complements.
# The runner reaches it at http://emulator:20002 (the emulator's netns, exactly
# like 20000).
port: 20002

# Same known password as the default config: the 503 assertion is made on an
# AUTHENTICATED request, so this server must be able to log in. (An
# unauthenticated probe is rejected by middleware.Auth with 401 before the
# handler's nil guard is ever reached — which is exactly why the old
# unauthenticated assertion could never observe 503.)
#
# NOTE the cookie is scoped to the non-default port: model.ScopedCookieName
# prefixes it to `cb20002_clawbench_session`. The spec's fetchSessionToken
# matches on the suffix, so it works for both servers.
password: e2e-test-password

port_forward:
  enabled: false   # SSH listener off
  transport: ssh   # h2 explicitly excluded -> no ProxyRegistry -> 503
