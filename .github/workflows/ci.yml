name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      # Only consumed by the `android-e2e` job. Underscored (not `android-e2e-tier`)
      # so it is addressable with dot notation in expressions; a hyphenated name
      # forces bracket notation (`github.event.inputs['android-e2e-tier']`).
      # Named `android_e2e_tier` rather than `tier` because this repo already uses
      # "Tier 1 / Tier 2" for the *coverage* gates, which mean something unrelated
      # (baseline drift vs. changed lines).
      android_e2e_tier:
        description: 'Android E2E harness tier (all = Tier 1 then Tier 2)'
        type: choice
        options: ['all', '1', '2']
        default: 'all'

jobs:
  golangci-lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle (for go:embed)
        # The isolated React editor is deliberately NOT part of the root Vite
        # build (see web/vendor-build/excalidraw/vite.config.ts) — it has its own
        # package.json and writes into .clawbench-web/vendor/excalidraw/. Without
        # this step the iframe at /vendor/excalidraw/index.html 404s on every
        # released binary, because ServeIndex finds no such file in the FS.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend (for go:embed)
        run: |
          npm ci
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
          only-new-issues: true

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle (for go:embed)
        # The isolated React editor is deliberately NOT part of the root Vite
        # build (see web/vendor-build/excalidraw/vite.config.ts) — it has its own
        # package.json and writes into .clawbench-web/vendor/excalidraw/. Without
        # this step the iframe at /vendor/excalidraw/index.html 404s on every
        # released binary, because ServeIndex finds no such file in the FS.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend (for go:embed)
        run: |
          npm ci
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build ./cmd/server

  coverage-go:
    name: Coverage Gate (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download main baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: ci.yml
          branch: main
          name: main-go-coverage
          path: .clawbench-ci/baseline/
        continue-on-error: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle (for go:embed)
        # The isolated React editor is deliberately NOT part of the root Vite
        # build (see web/vendor-build/excalidraw/vite.config.ts) — it has its own
        # package.json and writes into .clawbench-web/vendor/excalidraw/. Without
        # this step the iframe at /vendor/excalidraw/index.html 404s on every
        # released binary, because ServeIndex finds no such file in the FS.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend (for go:embed)
        run: |
          npm ci
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: Run coverage gate check
        run: |
          set +e
          ./scripts/check-go-coverage.sh
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "::warning::Tier 1 (Project) coverage gate failed — baseline drift, non-blocking"
            exit 0
          fi
          exit $exit_code

      - name: Upload coverage profile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: main-go-coverage
          path: coverage.out
          retention-days: 90

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: ESLint
        working-directory: web
        run: npx eslint src/

      - name: Stylelint
        working-directory: web
        run: npx stylelint "src/**/*.{css,vue}" "css/**/*.css"

  typecheck-frontend:
    name: Typecheck (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  typecheck-desktop:
    name: Typecheck (Desktop)
    # The desktop app is otherwise compiled ONLY by release.yml, at tag time —
    # so a type error there (e.g. a stale interface member) survives every PR
    # and only fails after the tag is pushed, taking the whole release down and
    # skipping the desktop payload publish. tsc is what catches that class: the
    # desktop vitest run strips types without checking them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        # --ignore-scripts skips the electron postinstall (a ~100 MB binary
        # download this job never runs); tsc only needs the type declarations.
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

  coverage-frontend:
    name: Coverage Gate (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download main baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: ci.yml
          branch: main
          name: main-frontend-coverage
          path: .clawbench-ci/baseline/
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage gate check
        run: |
          set +e
          ./scripts/check-frontend-coverage.sh
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "::warning::Tier 1 (Project) coverage gate failed — baseline drift, non-blocking"
            exit 0
          fi
          exit $exit_code

      - name: Upload coverage data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: main-frontend-coverage
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          retention-days: 90

  coverage-android:
    name: Coverage Gate (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download main baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: ci.yml
          branch: main
          name: main-android-coverage
          path: .clawbench-ci/baseline/
        continue-on-error: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is 'tools platform-tools'. cmdline-tools 16.0
          # (which the action itself installs) no longer ships the legacy
          # 'tools' package, so installing it fails with
          # "Failed to find package 'tools'" and aborts the whole job.
          # platform-tools is the only one we actually need on PATH.
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run coverage gate check
        run: ./scripts/check-android-coverage.sh

      - name: Upload coverage data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: main-android-coverage
          path: android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 90

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend, typecheck-frontend, coverage-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Excalidraw vendor bundle
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build
        run: npm run build

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is 'tools platform-tools'. cmdline-tools 16.0
          # (which the action itself installs) no longer ships the legacy
          # 'tools' package, so installing it fails with
          # "Failed to find package 'tools'" and aborts the whole job.
          # platform-tools is the only one we actually need on PATH.
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch version tags only
        # The versionCode needs a version tag, not the commit graph. Explicit
        # refspec because actions/checkout runs `fetch --no-tags` when
        # fetch-depth=1, and git's tag auto-follow does NOT pick up a tag
        # pointing at a commit outside the fetched slice.
        run: git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'

      - name: Build debug APK
        working-directory: android
        run: |
          # Newest version tag, not `git rev-list --count HEAD`: the default
          # depth=1 checkout makes the commit count collapse to 1.
          # $GITHUB_WORKSPACE because this step runs with working-directory=android.
          # See scripts/lib/version-code.sh.
          VERSION_CODE=$("$GITHUB_WORKSPACE/scripts/lib/version-code.sh" --tag-only)
          VERSION_NAME=$(git describe --tags --always 2>/dev/null || echo "dev")
          ./gradlew assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/clawbench-android-debug.apk

  # --------------------------------------------------------------------------
  # Playwright E2E — the full 3-browser suite (chromium/firefox/webkit).
  #
  # Runs on EVERY `pull_request` (and manual dispatch), like `android-e2e`
  # below. It used to sit behind a `run-e2e` label, which meant it effectively
  # never ran: the suite was red for a long stretch, so nobody labelled PRs and
  # CI silently skipped all Playwright coverage (see the E2E infrastructure
  # memory: ~60 consecutive runs with Playwright skipped). The suite is now
  # green (324 passed / 0 failed across the three browsers), so the label gate
  # is removed and it runs on each PR. It is skipped on `push`: the same commit
  # is already covered by the `pull_request` event.
  #
  # `continue-on-error: true` (matching `android-e2e`) keeps the *workflow run*
  # from turning red when the suite flakes. It is NOT a free pass, though: the
  # job's own check-run still reports `failure` (observed via the API for
  # android-e2e on 77f1d1ba — job= failure, run= success), and auto-merge.yml
  # skips any PR whose check-runs contain a `failure`. So a genuinely red e2e
  # still blocks auto-merge; the flag only keeps the run badge green. Treat a
  # red e2e as blocking.
  #
  # Local discipline (see AGENTS.md): do NOT run this full 3-browser suite
  # locally — it takes ~33 min and contends with concurrent agents. Locally run
  # only the specs you added or that your change touches (`--project=chromium
  # <spec>`); let CI cover the full matrix.
  # --------------------------------------------------------------------------
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    continue-on-error: true
    # A hang must fail rather than burn the 6-hour default. The full suite
    # measures ~33 min; the margin covers a cold Playwright browser install.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build Excalidraw vendor bundle
        # Same reason as the go:embed steps above: the root `npm run build` does
        # not produce vendor/excalidraw/, so the server would 404 the iframe.
        # Must precede `Build frontend`, which copies .clawbench-web/ wholesale
        # into internal/frontend/dist — excalidraw output included.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend
        # MUST run before `Build Go binary`. `go build ./cmd/server` compiles
        # internal/frontend/embed.go, whose `//go:embed all:dist` resolves at
        # COMPILE time against internal/frontend/dist/ — a generated, gitignored
        # directory that does not exist on a fresh checkout. Building the Go
        # binary first fails with "pattern all:dist: no matching files found".
        #
        # `npm run build` alone is NOT enough: vite's outDir is .clawbench-web/,
        # a sibling of dist/, so the copy below is what actually populates the
        # embed directory (the same two steps build.sh performs, and the same
        # ones the `Build frontend (for go:embed)` steps in the other jobs run).
        run: |
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: Build Go binary
        run: go build -o clawbench ./cmd/server

      - name: Build ACP mock agent
        run: go build -o acp-mock ./cmd/acp-mock

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          E2E_PORT: '20100'
          E2E_PASSWORD: 'e2e-test-password'

      - name: Generate E2E coverage report
        if: always()
        run: ./scripts/check-e2e-coverage.sh

      - name: Upload E2E coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: coverage/e2e/
          retention-days: 90

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Android E2E harness (android-e2e/) — emulator + Appium + a real runtime.
  #
  # Runs on EVERY `pull_request` (and manual dispatch), unlike the Playwright
  # `e2e` job above, which stays behind the `run-e2e` label. This harness is the
  # only automated coverage of the Android h2 tunnel, so it is worth the cost on
  # each PR. It is skipped on `push`: the same commit is already covered by the
  # `pull_request` event, and running both would double a ~25 min, 9.1 GB job.
  #
  # DELIBERATELY `continue-on-error: true`: the harness is new to CI and its
  # Tier 2 reverse-forward suite is still being stabilised, so it reports red
  # without blocking merges. Flip this to `false` once it has a green streak —
  # that is a one-line change, and until then the job's result is advisory.
  #
  # Why a job in this file rather than a separate workflow: it reuses the same
  # trigger block (`push`/`pull_request` with paths-ignore + `workflow_dispatch`)
  # and the same checkout/java/go action versions. A second file would duplicate
  # that surface and need its own `paths-ignore` tuning.
  # --------------------------------------------------------------------------
  android-e2e:
    name: E2E Tests (Android emulator)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    continue-on-error: true
    # A hang must fail rather than burn the 6-hour default. Budget from the
    # harness's own measured costs: image pull ~6 min (2.65 GB compressed),
    # APK build ~2-4 min, emulator boot ~2-4 min, Tier 1 ~3.5 min, Tier 2 ~6 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Report disk space (before)
        # The emulator image is 9.14 GB uncompressed and this job also builds an
        # APK; a runner that cannot fit both fails late and confusingly. Logged
        # before and after the reclamation below so the headroom is visible.
        run: df -h / /tmp

      - name: Reclaim disk space
        # ubuntu-latest has ~14 GB free on `/`. Budget: base image ~9.2 GB +
        # emulator container layer (~2-3 GB, the AVD/userdata) + Gradle/APK
        # (~1-2 GB). That does not fit without reclaiming.
        #
        # RECONCILING THE SDK: `/usr/local/lib/android/sdk` is where the runner's
        # preinstalled SDK lives, and this job does need an Android SDK — so the
        # tree is NOT deleted wholesale. Only the subdirectories this build never
        # touches are removed: the NDK, system images, the host emulator, sources
        # and cmake. Those dominate the tree (~6-8 GB) while `platforms`,
        # `build-tools`, `platform-tools` and `cmdline-tools` (a few hundred MB)
        # are kept, so android-actions/setup-android@v3 below reuses the existing
        # install instead of re-downloading one. Deleting the whole tree would
        # free slightly more but throw away exactly the thing the job needs.
        run: |
          set -x
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/sources \
            /usr/local/lib/android/sdk/cmake \
            /usr/local/lib/android/sdk/extras
          sudo apt-get clean
          df -h / /tmp

      - name: Enable KVM
        # GitHub-hosted ubuntu runners are themselves VMs and expose a KVM
        # device, but /dev/kvm starts non-writable for the runner user. This
        # udev rule sets MODE=0666 so the unprivileged `docker run --device
        # /dev/kvm` works. The rule + reload is the standard incantation.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is present and usable
        # Distinct step so a KVM problem is attributable rather than surfacing
        # as a 15-minute "emulator did not boot". `-w` is the plain check (the
        # node must be writable); the authoritative `emulator -accel-check` needs
        # the 9 GB image, so it is repeated in its own step after the pull.
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not writable — the Enable KVM step did not take effect"
            exit 1
          fi
          echo "/dev/kvm is writable"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          # Tier 2 compiles the real server binary from this worktree
          # (android-e2e/scripts/prepare-assets.sh --with-server), so the Go
          # toolchain must be on PATH. Same version as every other job here.
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          # Tier 2 embeds the real frontend into the server binary (see the
          # `Build frontend` step below). Same Node version as the other jobs.
          node-version: '24'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is 'tools platform-tools'. cmdline-tools 16.0
          # (which the action itself installs) no longer ships the legacy
          # 'tools' package, so installing it fails with
          # "Failed to find package 'tools'" and aborts the whole job.
          # platform-tools is the only one we actually need on PATH.
          packages: 'platform-tools'

      - name: Install Android SDK components
        # Must match android/app/build.gradle, which sets `compileSdk 36`.
        # build-tools 34.0.0 is what the rest of CI pins; the platform is what
        # actually matters for compilation, and it is 36 here — installing
        # android-34 (as the other Android jobs do) would fail the build.
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Fetch version tags only
        # The debug APK's versionName comes from `git describe`, which needs the
        # tags. actions/checkout's default depth=1 fetch does not bring tags
        # pointing outside the fetched slice, so fetch them explicitly (same
        # refspec as the build-android job above).
        run: git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'

      - name: Build debug APK
        # Same command as the build-android job above, and the same one the
        # harness runs locally. Building it here (rather than letting run.sh do
        # it) gives this step its own attribution and lets the staging step
        # below see output-metadata.json. Quoted (unlike build-android) so
        # actionlint's shellcheck pass stays clean.
        #
        # AGP 8.2 needs JDK 17. `setup-java` puts it on PATH as the default, so
        # the gradle invocation picks it up; run.sh is also passed --skip-build
        # below, so its own JDK17 resolution (a dev-container path) is unused.
        working-directory: android
        run: |
          VERSION_CODE=$("$GITHUB_WORKSPACE/scripts/lib/version-code.sh" --tag-only)
          VERSION_NAME=$(git describe --tags --always 2>/dev/null || echo "dev")
          ./gradlew assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Build frontend (Tier 2 real server needs the SPA shell)
        # Same consumer-before-producer class as the `e2e` job's go build: the
        # server binary is compiled with `//go:embed all:dist`, and Tier 2 drives
        # the app to the REAL server's root, where tunnel.server.mjs asserts
        # `document.getElementById('app')` exists ("the served page has no #app
        # root — not the SPA shell"). Without this step prepare-assets.sh falls
        # back to a `.gitkeep`-only stub embed, `GET /` answers 404, and that
        # assertion fails — before the 503 control is even reached.
        #
        # Only the tiers that run the real server (all|2) need it; Tier 1 talks
        # to the dependency-free mock, which serves its own marker home page, so
        # building ~1 GB of frontend deps for it would be pure waste. Same
        # `E2E_TIER_INPUT` + case shape as the staging step below, deliberately.
        env:
          E2E_TIER_INPUT: ${{ github.event.inputs.android_e2e_tier || 'all' }}
        run: |
          set -euo pipefail
          case "$E2E_TIER_INPUT" in
            all|2)
              # Excalidraw first: the copy below is wholesale, and the isolated
              # React editor writes into .clawbench-web/vendor/excalidraw/.
              (cd web/vendor-build/excalidraw && npm ci && npm run build)
              npm ci
              npm run build
              ;;
            *) echo "Tier $E2E_TIER_INPUT runs the mock — no frontend build needed";;
          esac

      - name: Stage harness assets
        # `--with-server` ONLY for the tiers that run the real server. run.sh
        # scopes its compose build to the selected tier's services (ce4c649c):
        # Tier 1 builds `emulator mock runner`, Tier 2 `emulator server target
        # runner`, `all` all five. Tier 1 therefore never touches the `server`
        # service and never needs assets/clawbench-server, so building it there
        # would be one Go link (~10-20 s) for nothing.
        #
        # A PR run has no `github.event.inputs`, so the `|| 'all'` fallback
        # resolves to `all`, which does need the server — same expression the
        # run step below uses, kept in sync deliberately.
        env:
          E2E_TIER_INPUT: ${{ github.event.inputs.android_e2e_tier || 'all' }}
        run: |
          set -euo pipefail
          case "$E2E_TIER_INPUT" in
            all|2) ./android-e2e/scripts/prepare-assets.sh --with-server ;;
            1)     ./android-e2e/scripts/prepare-assets.sh ;;
            *) echo "::error::unknown android_e2e_tier '$E2E_TIER_INPUT'"; exit 2 ;;
          esac

      - name: Pull emulator image
        # Plain `docker pull`, NOT android-e2e/scripts/pull-image.sh. That script
        # exists only because *this repo's dev container* talks to a host daemon
        # whose proxy resets every external HTTPS CONNECT; on a GitHub runner the
        # daemon has direct egress, so the ordinary pull is simpler and lets the
        # Docker layer cache do its job. Do not swap in the script here.
        #
        # run.sh calls pull-image.sh itself and it will no-op when the image is
        # already present (docker image inspect succeeds), so pre-pulling here
        # both warms the cache and keeps the timing/attribution in this step.
        run: |
          df -h /
          time docker pull budtmo/docker-android:emulator_9.0
          docker image inspect budtmo/docker-android:emulator_9.0 >/dev/null
          df -h /

      - name: Verify KVM acceleration with the pulled image
        # The authoritative KVM check — but `emulator -accel-check` is NOT
        # fail-fast: measured, with /dev/kvm absent it prints
        #   accel: 8  /dev/kvm is not found: VT disabled in BIOS ...
        # and still EXITS 0. So the status cannot be trusted; the success text
        # ("KVM (version N) is installed and usable.") must be asserted.
        #
        # Must run as root (`-u root`): budtmo's startup chowns /dev/kvm to uid
        # 1300, so as the default user this reports "This user doesn't have
        # permissions to use KVM" even on a perfectly good host.
        run: |
          set -euo pipefail
          out="$(docker run --rm --device /dev/kvm -u root --entrypoint sh \
            budtmo/docker-android:emulator_9.0 -c 'emulator -accel-check' 2>&1 || true)"
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -q 'is installed and usable'; then
            echo "::error::KVM acceleration is not usable — the emulator would fall back to software emulation"
            exit 1
          fi
          echo "KVM acceleration verified"

      - name: Run Android E2E harness
        # run.sh brings the emulator up, waits for sys.boot_completed, disables
        # the soft IME, runs the wdio suite for the selected tier, and tears
        # everything down. `--skip-build` reuses the APK built above.
        #
        # Bind mounts: the harness deliberately uses `docker build` + `docker cp`
        # rather than compose `volumes:` bind mounts. That works both here and in
        # the dev container, so it is left exactly as-is.
        env:
          # workflow_dispatch input (default 'all'); a PR run has no inputs, so
          # fall back to 'all'. run.sh accepts --all/--tier1/--tier2.
          E2E_TIER_INPUT: ${{ github.event.inputs.android_e2e_tier || 'all' }}
        run: |
          set -euo pipefail
          case "$E2E_TIER_INPUT" in
            all)    TIER_FLAG=--all ;;
            1)      TIER_FLAG=--tier1 ;;
            2)      TIER_FLAG=--tier2 ;;
            *) echo "::error::unknown android_e2e_tier '$E2E_TIER_INPUT'"; exit 2 ;;
          esac
          echo "running: android-e2e/scripts/run.sh $TIER_FLAG --skip-build"
          ./android-e2e/scripts/run.sh "$TIER_FLAG" --skip-build

      - name: Show harness artifacts
        if: always()
        run: |
          echo "--- android-e2e/artifacts ---"
          ls -la android-e2e/artifacts || true

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Failure screenshots / page source / context lists written by
          # wdio.conf.mjs. artifacts/ is cleared at the start of every run, so
          # anything here belongs to this run. `if-no-files-found: ignore` keeps
          # a green run (which writes none) from failing this step.
          name: android-e2e-artifacts
          path: android-e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14
