name: Deploy Landing

# The landing page (`web/landing/`) is hosted on Cloudflare Pages, together
# with the user-manual site generated from `docs/user-guide/` into `docs/`.
#
# Why a workflow instead of Cloudflare's own Git integration: the Pages
# builder runs `git submodule update --init --recursive` after cloning and
# this repo carries 8 historical gitlinks under `test/git-graph-repos/`
# (nested fixture repos committed as submodules) with no `.gitmodules`
# entry for them. That step fails with "No url found for submodule path"
# before the build ever starts. Deploying from a checkout we already have
# sidesteps it entirely.

on:
  push:
    branches: [main]
    paths:
      - 'web/landing/**'
      - 'web/docs/**'
      - 'docs/user-guide/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy; the site is a single
  # artifact, so running two at once would race on which one goes live.
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # The manual site builder (web/docs/build.mjs) renders Markdown with
      # marked + highlight.js and ships mermaid for the one diagram — all
      # already in the root package.json, so no extra dependency graph.
      # --ignore-scripts: the only lifecycle script is `prepare`, which
      # installs git hooks; the builder needs no native postinstalls.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # `wrangler pages deploy` uploads a directory as-is. The test file must
      # be excluded — it would otherwise be published at /landing.test.ts.
      #
      # `robots.txt` / `sitemap.xml` go to this host only: the sitemap lists
      # this host's URL, and a sitemap served from another host is rejected
      # wholesale (Google: URLs must be from a single host). The GitHub Pages
      # copy is the duplicate, so it carries neither file.
      - name: Stage site
        run: |
          mkdir -p dist
          cp -r web/landing/css web/landing/img web/landing/js \
                web/landing/index.html web/landing/_headers \
                web/landing/robots.txt web/landing/sitemap.xml dist/
          rm -f dist/*.test.ts

      # The manual lives at /docs/ next to the landing page and links back to
      # it via ../css + ../img, so it must land under the staged root.
      - name: Build user guide
        run: node web/docs/build.mjs --out dist/docs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=clawbench --branch=main
