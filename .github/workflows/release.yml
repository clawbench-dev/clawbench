name: Release

on:
  push:
    tags:
      - 'v*'

# Every published asset carries the release tag in its filename, so a file
# sitting in someone's Downloads folder says which version it is. Defined once
# here (not per step) so the zip step and the upload's `files:` cannot drift —
# a mismatch uploads nothing and the release silently ships without that
# platform. Note this is the TAG (v0.99.1), not the bare version: the npm
# packages in publish-npm strip the "v" themselves.
env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  golangci-lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle (for go:embed)
        # The isolated React editor is deliberately NOT part of the root Vite
        # build (see web/vendor-build/excalidraw/vite.config.ts) — it has its own
        # package.json and writes into .clawbench-web/vendor/excalidraw/. Without
        # this step the iframe at /vendor/excalidraw/index.html 404s on every
        # released binary, because ServeIndex finds no such file in the FS.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend (for go:embed)
        run: |
          npm ci
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test & Coverage Gate
    needs: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle (for go:embed)
        # The isolated React editor is deliberately NOT part of the root Vite
        # build (see web/vendor-build/excalidraw/vite.config.ts) — it has its own
        # package.json and writes into .clawbench-web/vendor/excalidraw/. Without
        # this step the iframe at /vendor/excalidraw/index.html 404s on every
        # released binary, because ServeIndex finds no such file in the FS.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend (for go:embed)
        run: |
          npm ci
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: Go coverage gate
        run: ./scripts/check-go-coverage.sh

      - name: Frontend coverage gate
        run: |
          set +e
          ./scripts/check-frontend-coverage.sh
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "::warning::Tier 1 (Project) coverage gate failed — baseline drift, non-blocking"
            exit 0
          fi
          exit $exit_code

  build-frontend:
    name: Build Frontend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle
        # MUST run before the artifact upload: this job's web-dist artifact is
        # the frontend embedded into every platform binary, so the vendor bundle
        # has to be inside .clawbench-web/ before it is captured. The root
        # `npm run build` does not produce it — the isolated React editor is a
        # separate build with its own package.json (see
        # web/vendor-build/excalidraw/vite.config.ts).
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/
          # upload-artifact v4 skips dotfiles/dot-directories by default. The path
          # itself is a hidden dir, so without this the artifact uploads nothing
          # and every downstream build embeds an empty frontend.
          include-hidden-files: true

  build-linux:
    name: Build Linux amd64
    needs: [build-frontend, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION" -o clawbench-linux ./cmd/server
          echo "Built with CGO_ENABLED=1: dynamically linked, SQLite FTS5/RAG enabled"

      - name: Verify Linux binary
        run: |
          file clawbench-linux
          ldd clawbench-linux

      - name: Package Linux
        # The release tag is part of the asset name so a downloaded file is
        # self-identifying. The zip step and the upload's `files:` use the same
        # $RELEASE_TAG value, so they cannot drift apart — a mismatch silently
        # uploads nothing and the release ships without that platform.
        run: |
          mkdir -p pkg-linux/clawbench
          cp clawbench-linux pkg-linux/clawbench/clawbench
          chmod +x pkg-linux/clawbench/clawbench
          cd pkg-linux && zip -r "clawbench-linux-amd64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-linux/clawbench-linux-amd64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: pkg-linux/clawbench/
          include-hidden-files: true

  build-linux-arm64:
    name: Build Linux arm64
    needs: [build-frontend, build-android]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux arm64 binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION" -o clawbench-linux-arm64 ./cmd/server
          echo "Built with CGO_ENABLED=1: dynamically linked, SQLite FTS5/RAG enabled"

      - name: Verify Linux arm64 binary
        run: |
          file clawbench-linux-arm64
          ldd clawbench-linux-arm64

      - name: Package Linux arm64
        run: |
          mkdir -p pkg-linux-arm64/clawbench
          cp clawbench-linux-arm64 pkg-linux-arm64/clawbench/clawbench
          chmod +x pkg-linux-arm64/clawbench/clawbench
          cd pkg-linux-arm64 && zip -r "clawbench-linux-arm64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-linux-arm64/clawbench-linux-arm64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-package
          path: pkg-linux-arm64/clawbench/
          include-hidden-files: true

  build-android-go:
    name: Build Android arm64 Go binary
    needs: [build-frontend, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Android arm64 binary (PIE for Termux)
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          # GOOS=android emits a PIE binary (interpreter /system/bin/linker64).
          # wlynxg/anet (via frp -> pion) uses go:linkname to net.zoneCache, which
          # Go >= 1.23 rejects at link time, so disable linkname checks for this target.
          GOOS=android GOARCH=arm64 go build -ldflags="-checklinkname=0 -s -w -X clawbench/internal/version.Version=$VERSION" -o clawbench-android-arm64 ./cmd/server

      - name: Verify Android arm64 binary
        run: |
          file clawbench-android-arm64

      - name: Package Android arm64
        run: |
          mkdir -p pkg-android-arm64/clawbench
          cp clawbench-android-arm64 pkg-android-arm64/clawbench/clawbench
          chmod +x pkg-android-arm64/clawbench/clawbench
          cd pkg-android-arm64 && zip -r "clawbench-android-arm64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-android-arm64/clawbench-android-arm64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-package
          path: pkg-android-arm64/clawbench/
          include-hidden-files: true

  build-windows:
    name: Build Windows amd64
    needs: [build-frontend, build-android]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        shell: pwsh
        run: |
          if (Test-Path internal/frontend/dist) { Remove-Item -Recurse -Force internal/frontend/dist }
          Copy-Item -Recurse .clawbench-web internal/frontend/dist
          New-Item -ItemType Directory -Force -Path internal/frontend/dist/assets | Out-Null
          Copy-Item android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Windows binary
        env:
          CGO_ENABLED: 1
        run: |
          $VERSION = if (git describe --tags --always 2>$null) { git describe --tags --always } else { "dev" }
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION" -o clawbench.exe ./cmd/server

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg-windows/clawbench
          Copy-Item clawbench.exe pkg-windows/clawbench/
          Compress-Archive -Path pkg-windows/clawbench -DestinationPath "pkg-windows/clawbench-windows-amd64-$env:RELEASE_TAG.zip"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-windows/clawbench-windows-amd64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: pkg-windows/clawbench/

  build-macos-arm64:
    name: Build macOS arm64
    needs: [build-frontend, build-android]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build macOS arm64 binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION" -o clawbench-darwin-arm64 ./cmd/server

      - name: Package macOS arm64
        run: |
          mkdir -p pkg-mac-arm64/clawbench
          cp clawbench-darwin-arm64 pkg-mac-arm64/clawbench/clawbench
          chmod +x pkg-mac-arm64/clawbench/clawbench
          cd pkg-mac-arm64 && zip -r "clawbench-darwin-arm64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-mac-arm64/clawbench-darwin-arm64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-package
          path: pkg-mac-arm64/clawbench/

  build-macos-amd64:
    name: Build macOS amd64
    needs: [build-frontend, build-android]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build macOS amd64 binary (cross-compile on arm64)
        env:
          CGO_ENABLED: 1
          GOARCH: amd64
          CC: clang -target x86_64-apple-macos13.0
          CXX: clang++ -target x86_64-apple-macos13.0
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION" -o clawbench-darwin-amd64 ./cmd/server

      - name: Package macOS amd64
        run: |
          mkdir -p pkg-mac-amd64/clawbench
          cp clawbench-darwin-amd64 pkg-mac-amd64/clawbench/clawbench
          chmod +x pkg-mac-amd64/clawbench/clawbench
          cd pkg-mac-amd64 && zip -r "clawbench-darwin-amd64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-mac-amd64/clawbench-darwin-amd64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-amd64-package
          path: pkg-mac-amd64/clawbench/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is 'tools platform-tools'. cmdline-tools 16.0
          # (which the action itself installs) no longer ships the legacy
          # 'tools' package, so installing it fails with
          # "Failed to find package 'tools'" and aborts the whole job.
          # platform-tools is the only one we actually need on PATH.
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/clawbench.jks

      - name: Fetch version tags only
        # The versionCode needs a version tag, not the commit graph. Fetching
        # just the tag refs keeps this cheap — no history is pulled.
        # Explicit refspec because actions/checkout runs `fetch --no-tags`
        # when fetch-depth=1, and git's tag auto-follow does NOT pick up a tag
        # pointing at a commit outside the fetched slice (verified: depth=1
        # with fetch-tags:true still ends up with zero tags).
        run: git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ../clawbench.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # versionCode comes from the newest version tag, not the commit count:
          # actions/checkout defaults to depth=1, so `git rev-list --count HEAD`
          # returns 1 here and every release APK shipped versionCode=1 — unable
          # to replace an older dev build. --tag-only reads the tag alone (no
          # history); --assert turns a recurrence into a failed release instead
          # of a silently un-installable APK.
          # $GITHUB_WORKSPACE, not a relative path: this step runs with
          # working-directory=android.
          # See scripts/lib/version-code.sh.
          VERSION_CODE=$("$GITHUB_WORKSPACE/scripts/lib/version-code.sh" --tag-only --assert)
          VERSION_NAME=$(git describe --tags --always 2>/dev/null || echo "dev")
          ./gradlew assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Upload APK artifact (for inclusion in platform packages)
        # Keeps the unversioned name: build.sh and internal/handler/apk.go embed
        # it at the fixed path assets/clawbench-android.apk, and every Go binary
        # job below copies it from there.
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/clawbench-android.apk

      - name: Stage versioned APK for the release
        # The published asset carries the tag, but Gradle's output filename and
        # the go:embed path are both fixed — so the versioned copy is staged
        # here instead of renaming the build output.
        run: |
          cp android/app/build/outputs/apk/release/clawbench-android.apk \
             "android/app/build/outputs/apk/release/clawbench-android-${RELEASE_TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            android/app/build/outputs/apk/release/clawbench-android-${{ env.RELEASE_TAG }}.apk

  docker:
    name: Build & Push Docker Image
    needs: [build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: pkg-linux/clawbench/

      - name: Prepare Docker build context
        run: |
          cp pkg-linux/clawbench/clawbench .
          chmod +x ./clawbench

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check package visibility
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG="${GITHUB_REPOSITORY_OWNER}"
          PKG_SLUG="clawbench"
          SETTINGS_URL="https://github.com/orgs/${ORG}/packages/container/${PKG_SLUG}/settings"
          ORG_PACKAGES_URL="https://github.com/orgs/${ORG}/settings/packages"

          # GitHub has no API to change package visibility — this can only be
          # done via the web UI.  We check and warn if the package is private.
          VISIBILITY=$(gh api "/orgs/${ORG}/packages/container/${PKG_SLUG}" --jq '.visibility' 2>/dev/null || echo "not_found")

          if [ "$VISIBILITY" = "public" ]; then
            echo "✅ Package is already public"
          elif [ "$VISIBILITY" = "private" ]; then
            echo "::warning::Docker image package is PRIVATE. Users cannot pull without authentication. Fix: ${SETTINGS_URL} → Danger Zone → Change visibility → Public. To make this permanent: ${ORG_PACKAGES_URL} → Package Creation → Public."
          else
            echo "::warning::Could not determine package visibility. If it's private, set it to public at: ${SETTINGS_URL}"
          fi

  build-desktop-linux:
    name: Build Desktop Linux
    # Gate on lint + tests like every other build job. Without this the
    # desktop packages were the only ones that could reach npm while the
    # rest of the release was still failing its checks.
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Set desktop version from tag
        # desktop/package.json keeps a placeholder version (0.1.0) in the repo.
        # app.getVersion() reads it, and the updater compares that against the
        # version published to npm — so leaving it unset makes every startup
        # report an available update and re-download the tarball forever.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "desktop version set to $VERSION"

      - name: Build desktop (Linux)
        run: |
          cd desktop
          npm ci
          npm run build

      - name: Write shell fingerprint (Linux)
        # Records the shell's IDENTITY (electron-builder.yml + icon sources)
        # into the build, so a later payload install can verify it is being
        # applied over a shell of the same identity. The value must be written
        # BEFORE zipping, since it ships inside the full package.
        #
        # Hashing the built binary instead would be wrong: electron-builder
        # writes the app version into the Windows executable, and the version
        # is rewritten from the tag on every release, so the fingerprint would
        # change every time and no payload would ever match.
        run: node desktop/scripts/shell-fingerprint.mjs desktop/release/linux-unpacked

      - name: Zip desktop (Linux)
        # Archive the CONTENTS of the unpacked directory, not the directory
        # itself. `zip -r ... linux-unpacked` prefixes every entry with
        # `linux-unpacked/`, so anyone unzipping the release lands in a
        # pointless extra folder before reaching the binary.
        #
        # The macOS step is the deliberate exception — read the comment there
        # before "fixing" it the same way.
        run: |
          cd desktop/release/linux-unpacked
          zip -r "../clawbench-desktop-linux-x64-${RELEASE_TAG}.zip" .

      - name: Build desktop payload (Linux)
        # The payload is the same app WITHOUT the Electron runtime (~3MB vs
        # ~150MB), for the incremental-upgrade path. Archived from INSIDE the
        # payload dir so entries are `payload.json` + `resources/…`: those share
        # no top-level directory, which is what stops install.ts's extractZip
        # from stripping a prefix (a zip of only `resources/…` would lose it and
        # drop app.asar at the app root). Read desktop/scripts/stage-payload.mjs.
        run: |
          cd desktop
          node scripts/stage-payload.mjs release/linux-unpacked
          cd release/linux-unpacked-payload
          zip -r "../clawbench-desktop-linux-x64-payload-${RELEASE_TAG}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            desktop/release/clawbench-desktop-linux-x64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-linux-x64-payload-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-package
          path: desktop/release/linux-unpacked/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-payload
          path: desktop/release/linux-unpacked-payload/
          # upload-artifact v4 skips dotfiles/dot-directories by default, and
          # the payload contains six (cpu-features' .eslintrc.js / .clang-format
          # / .dockerignore / .grenrc.yml, ssh2's .eslintrc.js / .eslintignore).
          # Without this the published npm package is silently incomplete: it
          # installs fine and only fails at runtime. Same reason as web-dist.
          include-hidden-files: true

  build-desktop-linux-arm64:
    name: Build Desktop Linux arm64
    # Gate on lint + tests like every other build job. Without this the
    # desktop packages were the only ones that could reach npm while the
    # rest of the release was still failing its checks.
    needs: [test]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Set desktop version from tag
        # desktop/package.json keeps a placeholder version (0.1.0) in the repo.
        # app.getVersion() reads it, and the updater compares that against the
        # version published to npm — so leaving it unset makes every startup
        # report an available update and re-download the tarball forever.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "desktop version set to $VERSION"

      - name: Build desktop (Linux arm64)
        run: |
          cd desktop
          npm ci
          npm run build -- --arm64

      - name: Write shell fingerprint (Linux arm64)
        # See the x64 job — must run before the zip, since it ships inside it.
        run: node desktop/scripts/shell-fingerprint.mjs desktop/release/linux-arm64-unpacked

      - name: Zip desktop (Linux arm64)
        # Contents, not the directory — see the x64 step above.
        run: |
          cd desktop/release/linux-arm64-unpacked
          zip -r "../clawbench-desktop-linux-arm64-${RELEASE_TAG}.zip" .

      - name: Build desktop payload (Linux arm64)
        # Archived from inside the payload dir so the entries share no top-level
        # directory — see the x64 payload step for why that matters.
        run: |
          cd desktop
          node scripts/stage-payload.mjs release/linux-arm64-unpacked
          cd release/linux-arm64-unpacked-payload
          zip -r "../clawbench-desktop-linux-arm64-payload-${RELEASE_TAG}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            desktop/release/clawbench-desktop-linux-arm64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-linux-arm64-payload-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-arm64-package
          path: desktop/release/linux-arm64-unpacked/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-arm64-payload
          path: desktop/release/linux-arm64-unpacked-payload/
          # See the x64 job: dotfiles are skipped by default.
          include-hidden-files: true

  build-desktop-windows:
    name: Build Desktop Windows
    # Gate on lint + tests like every other build job. Without this the
    # desktop packages were the only ones that could reach npm while the
    # rest of the release was still failing its checks.
    needs: [test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Set desktop version from tag
        # desktop/package.json keeps a placeholder version (0.1.0) in the repo.
        # app.getVersion() reads it, and the updater compares that against the
        # version published to npm — so leaving it unset makes every startup
        # report an available update and re-download the tarball forever.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "desktop version set to $VERSION"

      - name: Build desktop (Windows)
        run: |
          cd desktop
          npm ci
          npm run build

      - name: Write shell fingerprint (Windows)
        # See the Linux job. Windows needs it too: it installs the full package
        # first, and without the sidecar that install could never verify a
        # payload and would re-download ~150MB on every upgrade.
        run: node desktop/scripts/shell-fingerprint.mjs desktop/release/win-unpacked

      - name: Zip desktop (Windows)
        # The trailing `/*` is load-bearing: `-Path <dir>` would put a
        # `win-unpacked/` level inside the archive, so unzipping the release
        # would give users a pointless extra folder. With the wildcard the
        # directory's contents land at the archive root (subdirectories are
        # still included recursively).
        #
        # Unlike `zip -r`, this is not an equivalent-command swap: it changes
        # what the archive looks like, which is exactly the point.
        #
        # NOTE: `*` also skips hidden items, which is why the fingerprint
        # sidecar is NOT dot-prefixed (see shell-fingerprint.mjs).
        shell: pwsh
        run: Compress-Archive -Path desktop/release/win-unpacked/* -DestinationPath "desktop/release/clawbench-desktop-windows-x64-$env:RELEASE_TAG.zip"

      - name: Build desktop payload (Windows)
        # `node` (not Copy-Item) because resources/ contains dotfiles — notably
        # cpu-features' .eslintrc.js and .clang-format — and PowerShell's `*`
        # glob silently SKIPS hidden items. That would ship an incomplete
        # payload on Windows only, and the failure would surface at runtime
        # rather than here.
        #
        # The payload dir is a SIBLING of win-unpacked, so the `-Path
        # win-unpacked/*` archive above cannot pick it up.
        shell: pwsh
        run: |
          cd desktop
          node scripts/stage-payload.mjs release/win-unpacked
          Compress-Archive -Path release/win-unpacked-payload/* -DestinationPath "release/clawbench-desktop-windows-x64-payload-$env:RELEASE_TAG.zip"

      - name: Verify payload archive (Windows)
        # Compress-Archive reports success even if it wrote an incomplete
        # archive, and a partial payload installs cleanly then fails at runtime.
        # Assert the entries the client depends on, including a dotfile (the
        # case a PowerShell glob would have dropped) and the native modules.
        shell: pwsh
        run: |
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/desktop/release/clawbench-desktop-windows-x64-payload-$env:RELEASE_TAG.zip")
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            $required = @(
              'payload.json',
              'resources/app.asar',
              'resources/login.html',
              'resources/logo.png',
              'resources/app.asar.unpacked/node_modules/ssh2/lib/protocol/crypto/build/Release/sshcrypto.node',
              'resources/app.asar.unpacked/node_modules/cpu-features/build/Release/cpufeatures.node',
              'resources/app.asar.unpacked/node_modules/cpu-features/.eslintrc.js'
            )
            foreach ($r in $required) {
              if ($names -notcontains $r) { throw "payload archive is missing $r" }
            }
            # The manifest must carry a shell fingerprint, or every client
            # refuses the payload and silently falls back to the full download.
            $manifest = ($zip.Entries | Where-Object { $_.FullName -eq 'payload.json' })
            $json = [System.IO.StreamReader]::new($manifest.Open()).ReadToEnd() | ConvertFrom-Json
            if (-not $json.shell) { throw 'payload.json has no shell fingerprint' }
            Write-Host "payload archive OK: $($names.Count) entries, shell $($json.shell)"
          } finally { $zip.Dispose() }

      - name: Verify full package (Windows)
        # The fingerprint sidecar must be IN the full package: an install
        # without it can never verify a payload, so every upgrade would fall
        # back to the full download. A `*` glob skipping it is the realistic
        # failure, hence asserting it explicitly.
        shell: pwsh
        run: |
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/desktop/release/clawbench-desktop-windows-x64-$env:RELEASE_TAG.zip")
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains 'shell-fingerprint.txt') { throw 'full package is missing shell-fingerprint.txt' }
            if ($names -match 'payload') { throw 'full package contains payload artifacts' }
            Write-Host "full package OK: $($names.Count) entries"
          } finally { $zip.Dispose() }

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            desktop/release/clawbench-desktop-windows-x64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-windows-x64-payload-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-package
          path: desktop/release/win-unpacked/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-payload
          path: desktop/release/win-unpacked-payload/
          # See the Linux job: dotfiles are skipped by default.
          include-hidden-files: true

  build-desktop-macos:
    name: Build Desktop macOS
    # Gate on lint + tests like every other build job. Without this the
    # desktop packages were the only ones that could reach npm while the
    # rest of the release was still failing its checks.
    needs: [test]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Set desktop version from tag
        # desktop/package.json keeps a placeholder version (0.1.0) in the repo.
        # app.getVersion() reads it, and the updater compares that against the
        # version published to npm — so leaving it unset makes every startup
        # report an available update and re-download the tarball forever.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "desktop version set to $VERSION"

      - name: Install desktop deps
        run: |
          cd desktop
          npm ci

      - name: Set macOS signing cert env (only if secret exists)
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        # NOTE: `secrets` is not allowed in step `if:` conditions (workflow
        # fails to parse). Check for an empty secret inside the script instead.
        run: |
          if [ -n "$MAC_CERT" ]; then
            echo "CSC_LINK=$MAC_CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build desktop (macOS arm64 + x64)
        # CSC_LINK is only set when the MAC_CERT secret exists (see step above).
        # Without it electron-builder skips signing (ad-hoc) instead of failing.
        run: |
          cd desktop
          npx tsc -p tsconfig.json
          npx electron-builder --dir --arm64
          npx electron-builder --dir --x64

      - name: Zip desktop (macOS)
        # No shell-fingerprint sidecar here, unlike the Linux/Windows jobs: it
        # is only ever read when INSTALLING a payload, and macOS never does
        # (replacing app.asar inside a signed .app breaks the signature seal),
        # so the server publishes no macOS payload either.
        #
        # DELIBERATELY still wraps the payload in `mac-arm64/` / `mac/` — do
        # NOT flatten this like the Windows/Linux steps. The wrapper is what
        # makes the archive distinguishable from one whose top level is
        # `ClawBench.app/`.
        #
        # Why that matters: install.ts's extractZip strips the single
        # top-level directory every entry shares. Without the wrapper, the
        # shared top level IS `ClawBench.app/`, so the installer would strip
        # the app bundle itself and then fail to find the executable inside
        # it. Flattening this would also break self-upgrade for clients that
        # already shipped with the wrapper — they run the old installer,
        # which strips the wrapper unconditionally.
        run: |
          cd desktop/release
          zip -r "clawbench-desktop-darwin-arm64-${RELEASE_TAG}.zip" mac-arm64
          # electron-builder outputs the x64 (default-arch) build to `mac/`,
          # not `mac-x64/` — only non-default archs get an arch suffix.
          zip -r "clawbench-desktop-darwin-x64-${RELEASE_TAG}.zip" mac

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            desktop/release/clawbench-desktop-darwin-arm64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-darwin-x64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-package
          path: desktop/release/mac*/

  publish-npm:
    name: Publish to npm
    needs: [build-frontend, build-linux, build-linux-arm64, build-android-go, build-windows, build-macos-arm64, build-macos-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # 去掉 v 前缀（npm 语义化版本不允许 v 前缀）
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download Linux amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: pkg-linux/clawbench/

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-package
          path: pkg-linux-arm64/clawbench/

      - name: Download Android arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-package
          path: pkg-android-arm64/clawbench/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: pkg-windows/clawbench/

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-package
          path: pkg-mac-arm64/clawbench/

      - name: Download macOS amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-amd64-package
          path: pkg-mac-amd64/clawbench/

      - name: Assemble npm platform packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Assembling npm packages for version: $VERSION"

          # --- @xulongzhe/clawbench-linux-x64 ---
          PLATFORM_DIR="npm/platforms/linux-x64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-linux/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-linux-arm64 ---
          PLATFORM_DIR="npm/platforms/linux-arm64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-linux-arm64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-android-arm64 ---
          PLATFORM_DIR="npm/platforms/android-arm64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-android-arm64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-darwin-x64 ---
          PLATFORM_DIR="npm/platforms/darwin-x64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-mac-amd64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-darwin-arm64 ---
          PLATFORM_DIR="npm/platforms/darwin-arm64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-mac-arm64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-win32-x64 ---
          PLATFORM_DIR="npm/platforms/win32-x64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-windows/clawbench/clawbench.exe "$PLATFORM_DIR/bin/clawbench.exe"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- Update main package ---
          MAIN_DIR="npm/main"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$MAIN_DIR/package.json','utf8'));p.version='$VERSION';for(const d in p.optionalDependencies)p.optionalDependencies[d]='$VERSION';fs.writeFileSync('$MAIN_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          echo "All npm packages assembled"

      - name: Configure npm registry for publishing
        run: |
          # The project .npmrc sets registry=npmmirror which overrides even
          # NPM_CONFIG_USERCONFIG (project config has higher priority).
          # Remove it and write auth config to the userconfig file instead.
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          } >> "${NPM_CONFIG_USERCONFIG}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xulongzhe/clawbench-linux-x64
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if npm view "@xulongzhe/clawbench-linux-x64@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish ./npm/platforms/linux-x64 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xulongzhe/clawbench-linux-arm64
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if npm view "@xulongzhe/clawbench-linux-arm64@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish ./npm/platforms/linux-arm64 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xulongzhe/clawbench-android-arm64
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if npm view "@xulongzhe/clawbench-android-arm64@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish ./npm/platforms/android-arm64 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xulongzhe/clawbench-darwin-x64
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if npm view "@xulongzhe/clawbench-darwin-x64@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish ./npm/platforms/darwin-x64 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xulongzhe/clawbench-darwin-arm64
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if npm view "@xulongzhe/clawbench-darwin-arm64@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish ./npm/platforms/darwin-arm64 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xulongzhe/clawbench-win32-x64
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if npm view "@xulongzhe/clawbench-win32-x64@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish ./npm/platforms/win32-x64 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package (@xulongzhe/clawbench)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if npm view "@xulongzhe/clawbench@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish ./npm/main --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes the desktop incremental-upgrade payloads to npm, so the client can
  # fetch a ~1.2MB archive from an npm mirror (npmmirror in mainland China)
  # instead of only from GitHub Release. The full ~150MB package deliberately
  # stays GitHub-only: the mirror is unreliable at that size (a 110MB desktop
  # tarball 404s while a 49MB one syncs).
  publish-npm-desktop:
    name: Publish desktop payloads to npm
    needs: [build-desktop-linux, build-desktop-linux-arm64, build-desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # npm versions are semver and must not carry the tag's "v" prefix.
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Linux x64 payload
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux-payload
          path: npm/desktop-payloads/linux-x64/

      - name: Download Linux arm64 payload
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux-arm64-payload
          path: npm/desktop-payloads/linux-arm64/

      - name: Download Windows payload
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-payload
          path: npm/desktop-payloads/win32-x64/

      - name: Verify payloads are complete
        # The published package must be installable AND complete. A payload
        # missing files installs cleanly and only breaks at runtime, which is
        # exactly the failure the hidden-file trap produces — so assert the
        # files the client requires, including one dotfile.
        run: |
          for KEY in linux-x64 linux-arm64 win32-x64; do
            DIR="npm/desktop-payloads/$KEY"
            for f in \
              payload.json \
              resources/app.asar \
              resources/login.html \
              resources/logo.png \
              resources/app.asar.unpacked/node_modules/ssh2/lib/protocol/crypto/build/Release/sshcrypto.node \
              resources/app.asar.unpacked/node_modules/cpu-features/build/Release/cpufeatures.node \
              resources/app.asar.unpacked/node_modules/cpu-features/.eslintrc.js
            do
              if [ ! -f "$DIR/$f" ]; then
                echo "::error::$KEY payload is missing $f (upload-artifact drops dotfiles unless include-hidden-files is set)"
                exit 1
              fi
            done
            # The manifest must carry the shell fingerprint, or every client
            # refuses the payload and silently re-downloads the full package.
            if ! grep -q '"shell"' "$DIR/payload.json"; then
              echo "::error::$KEY payload.json has no shell fingerprint"
              exit 1
            fi
          done
          echo "all payloads complete"

      - name: Set payload package versions
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for KEY in linux-x64 linux-arm64 win32-x64; do
            node -e "const fs=require('fs');const p='npm/desktop-payloads/$KEY/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          done

      - name: Verify npm pack would publish the whole payload
        # npm applies packlist defaults that DROP files (`.gitignore`, `*.orig`,
        # `.npmrc`, …). Today nothing in resources/ matches them, but that is a
        # property of the current tree, not of this pipeline — and a dropped
        # file installs cleanly and only fails at runtime. Compare what npm
        # would pack against what is on disk, so a future payload file that npm
        # silently excludes fails here instead of in the field.
        run: |
          for KEY in linux-x64 linux-arm64 win32-x64; do
            DIR="npm/desktop-payloads/$KEY"
            node -e "
              const {execFileSync} = require('child_process');
              const fs = require('fs'), path = require('path');
              const dir = '$DIR';
              const packed = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json', dir], {encoding:'utf8'}))[0].files.map(f => f.path).sort();
              const walk = (root, base = root, out = []) => {
                for (const e of fs.readdirSync(root, {withFileTypes:true})) {
                  const p = path.join(root, e.name);
                  if (e.isDirectory()) walk(p, base, out);
                  else if (e.isFile() && path.relative(base, p) !== 'package.json') out.push(path.relative(base, p));
                }
                return out;
              };
              const onDisk = walk(dir).sort();
              const missing = onDisk.filter(f => !packed.includes(f));
              if (missing.length) {
                console.error('::error::npm would omit files from ' + dir + ': ' + missing.slice(0,5).join(', '));
                process.exit(1);
              }
              console.log(dir + ': npm packs all ' + onDisk.length + ' files');
            "
          done

      - name: Configure npm registry for publishing
        run: |
          # The project .npmrc sets registry=npmmirror, and project config
          # outranks even NPM_CONFIG_USERCONFIG. Without removing it this job
          # would publish to the mirror with no credentials.
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          } >> "${NPM_CONFIG_USERCONFIG}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish payload packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for KEY in linux-x64 linux-arm64 win32-x64; do
            PKG=$(node -p "require('./npm/desktop-payloads/$KEY/package.json').name")
            # A re-run of a partially-failed release must not try to republish
            # an immutable version (E403).
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION already published, skipping"
              continue
            fi
            npm publish "./npm/desktop-payloads/$KEY" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-notes:
    name: Generate Release Notes
    needs: [build-linux, build-linux-arm64, build-android-go, build-windows, build-macos-arm64, build-macos-amd64, build-android, docker, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating default notes"
            gh release edit "$TAG" --generate-notes
            exit 0
          fi

          NOTES=""

          # Helper: extract categorized commits with hashes
          # Format: "hash subject" — strip conventional prefix for display

          # 🚀 Features
          FEATS=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ (feat|feature)\b" || true)
          if [ -n "$FEATS" ]; then
            NOTES="${NOTES}## 🚀 新特性\n\n"
            while IFS= read -r line; do
              HASH=$(echo "$line" | cut -d' ' -f1)
              DESC=$(echo "$line" | sed -E 's/^[0-9a-f]+ (feat|feature)(\(.+\))?:\s*//')
              NOTES="${NOTES}- ${DESC} (${HASH})\n"
            done <<< "$FEATS"
            NOTES="${NOTES}\n"
          fi

          # 🐛 Bug Fixes
          FIXES=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ fix\b" || true)
          if [ -n "$FIXES" ]; then
            NOTES="${NOTES}## 🐛 问题修复\n\n"
            while IFS= read -r line; do
              HASH=$(echo "$line" | cut -d' ' -f1)
              DESC=$(echo "$line" | sed -E 's/^[0-9a-f]+ fix(\(.+\))?:\s*//')
              NOTES="${NOTES}- 修复了 ${DESC} (${HASH})\n"
            done <<< "$FIXES"
            NOTES="${NOTES}\n"
          fi

          # ⚡ Performance
          PERFS=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ perf\b" || true)
          if [ -n "$PERFS" ]; then
            NOTES="${NOTES}## ⚡ 性能优化\n\n"
            while IFS= read -r line; do
              HASH=$(echo "$line" | cut -d' ' -f1)
              DESC=$(echo "$line" | sed -E 's/^[0-9a-f]+ perf(\(.+\))?:\s*//')
              NOTES="${NOTES}- ${DESC} (${HASH})\n"
            done <<< "$PERFS"
            NOTES="${NOTES}\n"
          fi

          # 🔧 Internal
          INTERNAL=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ (refactor|chore|style|ci|build)\b" || true)
          if [ -n "$INTERNAL" ]; then
            NOTES="${NOTES}## 🔧 内部改进\n\n"
            COUNT=$(echo "$INTERNAL" | wc -l)
            NOTES="${NOTES}- ${COUNT} 项内部改进（重构、依赖更新、代码风格等）\n\n"
          fi

          # 💥 Breaking Changes
          BREAKING=$(git log "${PREV_TAG}..${TAG}" --format="%B" | grep -i "BREAKING CHANGE" || true)
          if [ -n "$BREAKING" ]; then
            NOTES="${NOTES}## 💥 破坏性变更\n\n"
            NOTES="${NOTES}${BREAKING}\n\n"
          fi

          NOTES="${NOTES}---\n\n**完整变更日志**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}\n"

          # Write notes to file and update release
          printf '%b\n' "$NOTES" > /tmp/release-notes.md
          gh release edit "$TAG" --notes-file /tmp/release-notes.md
