name: Release

on:
  push:
    tags:
      - 'v*'

# Every published asset carries the release tag in its filename, so a file
# sitting in someone's Downloads folder says which version it is. Defined once
# here (not per step) so the zip step and the upload's `files:` cannot drift —
# a mismatch uploads nothing and the release silently ships without that
# platform. Note this is the TAG (v0.99.1), not the bare version: the npm
# packages in publish-npm strip the "v" themselves.
env:
  RELEASE_TAG: ${{ github.ref_name }}

# One release per tag, and a newer run supersedes an older one for the SAME tag.
#
# Without this, pushing a tag more than once — a retry after a transient
# failure, a delete-and-recreate, or (observed on v0.121.0) four runs spawned
# within five minutes by repeated ref writes — starts several pipelines for one
# version. They then race on resources that are not safe to touch twice:
#
#   * npm, where a version is immutable. Two runs publish the same version and
#     the loser dies with `E409 Cannot publish over previously staged version`
#     even though the release itself is fine. On v0.121.0 that made the whole
#     `Publish to npm` job report failure while npm already carried 0.121.0.
#   * GitHub Releases, where the asset upload would collide.
#
# `github.ref` (not `github.run_id`) is the group key on purpose: the whole
# point is to collapse runs of the *same* tag, while a new tag must never
# cancel an in-flight release of the previous one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle (for go:embed)
        # The isolated React editor is deliberately NOT part of the root Vite
        # build (see web/vendor-build/excalidraw/vite.config.ts) — it has its own
        # package.json and writes into .clawbench-web/vendor/excalidraw/. Without
        # this step the iframe at /vendor/excalidraw/index.html 404s on every
        # released binary, because ServeIndex finds no such file in the FS.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend (for go:embed)
        run: |
          npm ci
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test & Coverage Gate
    needs: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle (for go:embed)
        # The isolated React editor is deliberately NOT part of the root Vite
        # build (see web/vendor-build/excalidraw/vite.config.ts) — it has its own
        # package.json and writes into .clawbench-web/vendor/excalidraw/. Without
        # this step the iframe at /vendor/excalidraw/index.html 404s on every
        # released binary, because ServeIndex finds no such file in the FS.
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend (for go:embed)
        run: |
          npm ci
          npm run build
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
        shell: bash

      - name: Install desktop dependencies
        # The ROOT vitest run collects `desktop/**/*.test.ts`, and those specs
        # import `electron` at module scope. Without this install they die at
        # import with "Failed to resolve import 'electron'" — which used to be
        # invisible because the coverage script treated "coverage data exists"
        # as proof the run was fine (fixed in scripts/check-frontend-coverage.sh).
        # Mirrors ci.yml's Coverage (Frontend) job.
        #
        # `--ignore-scripts` skips electron's ~100 MB binary postinstall: the
        # specs only need the module to resolve, and this job never launches
        # Electron.
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Go coverage gate
        run: ./scripts/check-go-coverage.sh

      - name: Frontend coverage gate
        # Same budget as ci.yml's Coverage Gate (Frontend). V8 coverage roughly
        # triples the suite's wall clock, and the suite has outgrown the
        # script's default 20-minute watchdog: on v0.134.0 the run was killed
        # at 1200s mid-suite, never wrote coverage-summary.json, and read as a
        # gate failure even though the identical commit was green in ci.yml.
        # The script still kills workers that stop making CPU progress, so a
        # real hang is not hidden by the longer budget.
        env:
          VITEST_TIMEOUT_S: 2700
        run: |
          set +e
          ./scripts/check-frontend-coverage.sh
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "::warning::Tier 1 (Project) coverage gate failed — baseline drift, non-blocking"
            exit 0
          fi
          exit $exit_code

  client-guard:
    name: Client Build Guard
    # Decides whether this release has to rebuild the APK and the desktop
    # packages, and enforces the protocol-bump discipline. The clients are thin
    # shells that load the web UI from the server, so a normal release changes
    # neither — rebuilding five jobs (four desktop platforms, macOS twice) for
    # byte-identical output was the single largest cost of a release.
    #
    # Reuse is only safe because both gates compare the client PROTOCOL number
    # instead of version strings (internal/version/client_protocol.txt), so an
    # older shell keeps working against a newer server as long as the contract
    # did not change. The job fails the release when a contract file changed
    # without a bump — shipping an incompatible pair is worse than a slow one.
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prev_tag: ${{ steps.guard.outputs.prev_tag }}
      protocol: ${{ steps.guard.outputs.protocol }}
      android_changed: ${{ steps.guard.outputs.android_changed }}
      desktop_changed: ${{ steps.guard.outputs.desktop_changed }}
      android_source: ${{ steps.guard.outputs.android_source }}
      desktop_source: ${{ steps.guard.outputs.desktop_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Diffing against the previous release tag needs both the tags and the
          # commits they point at. A shallow clone silently finds no previous
          # tag, which would force a rebuild every time (safe, but pointless).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decide what to rebuild
        id: guard
        run: node scripts/lib/client-guard.mjs

  build-frontend:
    name: Build Frontend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Excalidraw vendor bundle
        # MUST run before the artifact upload: this job's web-dist artifact is
        # the frontend embedded into every platform binary, so the vendor bundle
        # has to be inside .clawbench-web/ before it is captured. The root
        # `npm run build` does not produce it — the isolated React editor is a
        # separate build with its own package.json (see
        # web/vendor-build/excalidraw/vite.config.ts).
        working-directory: web/vendor-build/excalidraw
        run: |
          npm ci
          npm run build

      - name: Build frontend
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/
          # upload-artifact v4 skips dotfiles/dot-directories by default. The path
          # itself is a hidden dir, so without this the artifact uploads nothing
          # and every downstream build embeds an empty frontend.
          include-hidden-files: true

  build-linux:
    name: Build Linux amd64
    needs: [build-frontend, build-android, client-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION -X clawbench/internal/version.ClientBuildVersion=${{ needs.client-guard.outputs.desktop_source }}" -o clawbench-linux ./cmd/server
          echo "Built with CGO_ENABLED=1: dynamically linked, SQLite FTS5/RAG enabled"

      - name: Verify Linux binary
        run: |
          file clawbench-linux
          ldd clawbench-linux

      - name: Package Linux
        # The release tag is part of the asset name so a downloaded file is
        # self-identifying. The zip step and the upload's `files:` use the same
        # $RELEASE_TAG value, so they cannot drift apart — a mismatch silently
        # uploads nothing and the release ships without that platform.
        run: |
          mkdir -p pkg-linux/clawbench
          cp clawbench-linux pkg-linux/clawbench/clawbench
          chmod +x pkg-linux/clawbench/clawbench
          cd pkg-linux && zip -r "clawbench-linux-amd64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-linux/clawbench-linux-amd64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: pkg-linux/clawbench/
          include-hidden-files: true

  build-linux-arm64:
    name: Build Linux arm64
    needs: [build-frontend, build-android, client-guard]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux arm64 binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION -X clawbench/internal/version.ClientBuildVersion=${{ needs.client-guard.outputs.desktop_source }}" -o clawbench-linux-arm64 ./cmd/server
          echo "Built with CGO_ENABLED=1: dynamically linked, SQLite FTS5/RAG enabled"

      - name: Verify Linux arm64 binary
        run: |
          file clawbench-linux-arm64
          ldd clawbench-linux-arm64

      - name: Package Linux arm64
        run: |
          mkdir -p pkg-linux-arm64/clawbench
          cp clawbench-linux-arm64 pkg-linux-arm64/clawbench/clawbench
          chmod +x pkg-linux-arm64/clawbench/clawbench
          cd pkg-linux-arm64 && zip -r "clawbench-linux-arm64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-linux-arm64/clawbench-linux-arm64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-package
          path: pkg-linux-arm64/clawbench/
          include-hidden-files: true

  build-android-go:
    name: Build Android arm64 Go binary
    needs: [build-frontend, build-android, client-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Android arm64 binary (PIE for Termux)
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          GOOS=android GOARCH=arm64 go build -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION -X clawbench/internal/version.ClientBuildVersion=${{ needs.client-guard.outputs.desktop_source }}" -o clawbench-android-arm64 ./cmd/server

      - name: Verify Android arm64 binary
        run: |
          file clawbench-android-arm64

      - name: Package Android arm64
        run: |
          mkdir -p pkg-android-arm64/clawbench
          cp clawbench-android-arm64 pkg-android-arm64/clawbench/clawbench
          chmod +x pkg-android-arm64/clawbench/clawbench
          cd pkg-android-arm64 && zip -r "clawbench-android-arm64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-android-arm64/clawbench-android-arm64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-package
          path: pkg-android-arm64/clawbench/
          include-hidden-files: true

  build-windows:
    name: Build Windows amd64
    needs: [build-frontend, build-android, client-guard]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        shell: pwsh
        run: |
          if (Test-Path internal/frontend/dist) { Remove-Item -Recurse -Force internal/frontend/dist }
          Copy-Item -Recurse .clawbench-web internal/frontend/dist
          New-Item -ItemType Directory -Force -Path internal/frontend/dist/assets | Out-Null
          Copy-Item android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Windows binary
        env:
          CGO_ENABLED: 1
        run: |
          $VERSION = if (git describe --tags --always 2>$null) { git describe --tags --always } else { "dev" }
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION -X clawbench/internal/version.ClientBuildVersion=${{ needs.client-guard.outputs.desktop_source }}" -o clawbench.exe ./cmd/server

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg-windows/clawbench
          Copy-Item clawbench.exe pkg-windows/clawbench/
          Compress-Archive -Path pkg-windows/clawbench -DestinationPath "pkg-windows/clawbench-windows-amd64-$env:RELEASE_TAG.zip"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-windows/clawbench-windows-amd64-${{ env.RELEASE_TAG }}.zip

      - name: Upload server for the desktop build
        uses: actions/upload-artifact@v4
        with:
          name: windows-server
          # The only copy of the server built with the frontend embedded — which
          # is exactly what the desktop app ships and starts. The desktop job
          # consumes it instead of rebuilding (desktop/scripts/build-server.mjs
          # reuses it when present).
          path: clawbench.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: pkg-windows/clawbench/

  build-macos-arm64:
    name: Build macOS arm64
    needs: [build-frontend, build-android, client-guard]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build macOS arm64 binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION -X clawbench/internal/version.ClientBuildVersion=${{ needs.client-guard.outputs.desktop_source }}" -o clawbench-darwin-arm64 ./cmd/server

      - name: Package macOS arm64
        run: |
          mkdir -p pkg-mac-arm64/clawbench
          cp clawbench-darwin-arm64 pkg-mac-arm64/clawbench/clawbench
          chmod +x pkg-mac-arm64/clawbench/clawbench
          cd pkg-mac-arm64 && zip -r "clawbench-darwin-arm64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-mac-arm64/clawbench-darwin-arm64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-package
          path: pkg-mac-arm64/clawbench/

  build-macos-amd64:
    name: Build macOS amd64
    needs: [build-frontend, build-android, client-guard]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Copy frontend for Go embed
        run: |
          rm -rf internal/frontend/dist
          cp -r .clawbench-web internal/frontend/dist
          mkdir -p internal/frontend/dist/assets
          cp android-apk/clawbench-android.apk internal/frontend/dist/assets/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build macOS amd64 binary (cross-compile on arm64)
        env:
          CGO_ENABLED: 1
          GOARCH: amd64
          CC: clang -target x86_64-apple-macos13.0
          CXX: clang++ -target x86_64-apple-macos13.0
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -tags "fts5" -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION -X clawbench/internal/version.ClientBuildVersion=${{ needs.client-guard.outputs.desktop_source }}" -o clawbench-darwin-amd64 ./cmd/server

      - name: Package macOS amd64
        run: |
          mkdir -p pkg-mac-amd64/clawbench
          cp clawbench-darwin-amd64 pkg-mac-amd64/clawbench/clawbench
          chmod +x pkg-mac-amd64/clawbench/clawbench
          cd pkg-mac-amd64 && zip -r "clawbench-darwin-amd64-${RELEASE_TAG}.zip" clawbench/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: pkg-mac-amd64/clawbench-darwin-amd64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-amd64-package
          path: pkg-mac-amd64/clawbench/

  build-android:
    name: Build Android APK
    needs: [client-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to rebuild
        # Defaults to the guard's decision; the reuse step below flips it
        # back to true if the previous artifact cannot be fetched, so a
        # broken mirror degrades to a slow release rather than a missing
        # package.
        shell: bash
        run: echo "NEEDS_BUILD=${{ needs.client-guard.outputs.android_changed }}" >> "$GITHUB_ENV"

      - name: Reuse the previous release's APK
        if: env.NEEDS_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ needs.client-guard.outputs.android_source }}
        shell: bash
        run: |
          if ./scripts/lib/reuse-client-artifact.sh apk "$SOURCE_TAG" \
               android/app/build/outputs/apk/release/clawbench-android.apk; then
            echo "reusing the APK from $SOURCE_TAG (client protocol unchanged)"
          else
            echo "::warning::could not reuse the APK from $SOURCE_TAG; rebuilding instead"
            echo "NEEDS_BUILD=true" >> "$GITHUB_ENV"
          fi


      - uses: actions/setup-java@v4
        if: env.NEEDS_BUILD == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: env.NEEDS_BUILD == 'true'
        uses: android-actions/setup-android@v3
        with:
          # The action's default is 'tools platform-tools'. cmdline-tools 16.0
          # (which the action itself installs) no longer ships the legacy
          # 'tools' package, so installing it fails with
          # "Failed to find package 'tools'" and aborts the whole job.
          # platform-tools is the only one we actually need on PATH.
          packages: 'platform-tools'

      - name: Install Android SDK components
        if: env.NEEDS_BUILD == 'true'
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore
        if: env.NEEDS_BUILD == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/clawbench.jks

      - name: Fetch version tags only
        if: env.NEEDS_BUILD == 'true'
        # The versionCode needs a version tag, not the commit graph. Fetching
        # just the tag refs keeps this cheap — no history is pulled.
        # Explicit refspec because actions/checkout runs `fetch --no-tags`
        # when fetch-depth=1, and git's tag auto-follow does NOT pick up a tag
        # pointing at a commit outside the fetched slice (verified: depth=1
        # with fetch-tags:true still ends up with zero tags).
        run: git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'

      - name: Build release APK
        if: env.NEEDS_BUILD == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ../clawbench.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # versionCode comes from the newest version tag, not the commit count:
          # actions/checkout defaults to depth=1, so `git rev-list --count HEAD`
          # returns 1 here and every release APK shipped versionCode=1 — unable
          # to replace an older dev build. --tag-only reads the tag alone (no
          # history); --assert turns a recurrence into a failed release instead
          # of a silently un-installable APK.
          # $GITHUB_WORKSPACE, not a relative path: this step runs with
          # working-directory=android.
          # See scripts/lib/version-code.sh.
          VERSION_CODE=$("$GITHUB_WORKSPACE/scripts/lib/version-code.sh" --tag-only --assert)
          VERSION_NAME=$(git describe --tags --always 2>/dev/null || echo "dev")
          ./gradlew assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Upload APK artifact (for inclusion in platform packages)
        # Keeps the unversioned name: build.sh and internal/handler/apk.go embed
        # it at the fixed path assets/clawbench-android.apk, and every Go binary
        # job below copies it from there.
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/clawbench-android.apk

      - name: Stage versioned APK for the release
        # The published asset carries the tag, but Gradle's output filename and
        # the go:embed path are both fixed — so the versioned copy is staged
        # here instead of renaming the build output.
        run: |
          cp android/app/build/outputs/apk/release/clawbench-android.apk \
             "android/app/build/outputs/apk/release/clawbench-android-${RELEASE_TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            android/app/build/outputs/apk/release/clawbench-android-${{ env.RELEASE_TAG }}.apk

  docker:
    name: Build & Push Docker Image
    needs: [build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: pkg-linux/clawbench/

      - name: Prepare Docker build context
        run: |
          cp pkg-linux/clawbench/clawbench .
          chmod +x ./clawbench

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check package visibility
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG="${GITHUB_REPOSITORY_OWNER}"
          PKG_SLUG="clawbench"
          SETTINGS_URL="https://github.com/orgs/${ORG}/packages/container/${PKG_SLUG}/settings"
          ORG_PACKAGES_URL="https://github.com/orgs/${ORG}/settings/packages"

          # GitHub has no API to change package visibility — this can only be
          # done via the web UI.  We check and warn if the package is private.
          VISIBILITY=$(gh api "/orgs/${ORG}/packages/container/${PKG_SLUG}" --jq '.visibility' 2>/dev/null || echo "not_found")

          if [ "$VISIBILITY" = "public" ]; then
            echo "✅ Package is already public"
          elif [ "$VISIBILITY" = "private" ]; then
            echo "::warning::Docker image package is PRIVATE. Users cannot pull without authentication. Fix: ${SETTINGS_URL} → Danger Zone → Change visibility → Public. To make this permanent: ${ORG_PACKAGES_URL} → Package Creation → Public."
          else
            echo "::warning::Could not determine package visibility. If it's private, set it to public at: ${SETTINGS_URL}"
          fi

  build-desktop-linux:
    name: Build Desktop Linux
    # Gate on lint + tests like every other build job. Without this the
    # desktop packages were the only ones that could reach npm while the
    # rest of the release was still failing its checks.
    needs: [test, client-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to rebuild
        # Defaults to the guard's decision; the reuse step below flips it
        # back to true if the previous artifact cannot be fetched, so a
        # broken mirror degrades to a slow release rather than a missing
        # package.
        shell: bash
        run: echo "NEEDS_BUILD=${{ needs.client-guard.outputs.desktop_changed }}" >> "$GITHUB_ENV"

      - name: Reuse the previous release's desktop build
        if: env.NEEDS_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ needs.client-guard.outputs.desktop_source }}
        shell: bash
        run: |
          if ./scripts/lib/reuse-client-artifact.sh desktop \
               clawbench-desktop-linux-x64 \
               "$SOURCE_TAG" \
               "desktop/release/clawbench-desktop-linux-x64-${RELEASE_TAG}.zip"; then
            echo "reusing the desktop build from $SOURCE_TAG (client protocol unchanged)"
          else
            echo "::warning::could not reuse the desktop build from $SOURCE_TAG; rebuilding instead"
            echo "NEEDS_BUILD=true" >> "$GITHUB_ENV"
          fi


      - uses: actions/setup-node@v4
        if: env.NEEDS_BUILD == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@v5
        if: env.NEEDS_BUILD == 'true'
        with:
          go-version: '1.25'

      - name: Set desktop version from tag
        if: env.NEEDS_BUILD == 'true'
        # desktop/package.json keeps a placeholder version (0.1.0) in the repo.
        # app.getVersion() reads it, and the updater compares that against the
        # version published to npm — so leaving it unset makes every startup
        # report an available update and re-download the tarball forever.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "desktop version set to $VERSION"

      - name: Build desktop (Linux)
        if: env.NEEDS_BUILD == 'true'
        run: |
          cd desktop
          npm ci
          npm run build

      - name: Zip desktop (Linux)
        if: env.NEEDS_BUILD == 'true'
        # Archive the CONTENTS of the unpacked directory, not the directory
        # itself. `zip -r ... linux-unpacked` prefixes every entry with
        # `linux-unpacked/`, so anyone unzipping the release lands in a
        # pointless extra folder before reaching the binary.
        #
        # The macOS step is the deliberate exception — read the comment there
        # before "fixing" it the same way.
        run: |
          cd desktop/release/linux-unpacked
          zip -r "../clawbench-desktop-linux-x64-${RELEASE_TAG}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: desktop/release/clawbench-desktop-linux-x64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-zip
          path: desktop/release/clawbench-desktop-linux-x64-${{ env.RELEASE_TAG }}.zip

