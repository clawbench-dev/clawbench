  build-desktop-windows:
    name: Build Desktop Windows
    # Gate on lint + tests like every other build job. Without this the
    # desktop packages were the only ones that could reach npm while the
    # rest of the release was still failing its checks.
    #
    # build-windows is here for the embedded server: the desktop app ships the
    # SAME binary the standalone package does (frontend embedded once, version
    # stamped once), rather than a second go build that could drift.
    needs: [test, client-guard, build-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to rebuild
        # Defaults to the guard's decision; the reuse step below flips it
        # back to true if the previous artifact cannot be fetched, so a
        # broken mirror degrades to a slow release rather than a missing
        # package.
        shell: bash
        run: echo "NEEDS_BUILD=${{ needs.client-guard.outputs.desktop_changed }}" >> "$GITHUB_ENV"

      - name: Reuse the previous release's desktop build
        if: env.NEEDS_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ needs.client-guard.outputs.desktop_source }}
        shell: bash
        run: |
          if ./scripts/lib/reuse-client-artifact.sh desktop \
               clawbench-desktop-windows-x64 \
               "$SOURCE_TAG" \
               "desktop/release/clawbench-desktop-windows-x64-${RELEASE_TAG}.zip"; then
            echo "reusing the desktop build from $SOURCE_TAG (client protocol unchanged)"
          else
            echo "::warning::could not reuse the desktop build from $SOURCE_TAG; rebuilding instead"
            echo "NEEDS_BUILD=true" >> "$GITHUB_ENV"
          fi


      - uses: actions/setup-node@v4
        if: env.NEEDS_BUILD == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@v5
        if: env.NEEDS_BUILD == 'true'
        with:
          go-version: '1.25'

      - name: Download the embedded server
        # NOT conditional on NEEDS_BUILD: the fused package must exist for every
        # release, including one that reuses the previous desktop shell. The
        # shell is reused; the server is always this release's build.
        uses: actions/download-artifact@v4
        with:
          name: windows-server
          path: clawbench-server/

      - name: Set desktop version from tag
        if: env.NEEDS_BUILD == 'true'
        # desktop/package.json keeps a placeholder version (0.1.0) in the repo.
        # app.getVersion() reads it, and the updater compares that against the
        # version published to npm — so leaving it unset makes every startup
        # report an available update and re-download the tarball forever.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "desktop version set to $VERSION"

      - name: Build desktop (Windows)
        if: env.NEEDS_BUILD == 'true'
        # prebuild runs scripts/build-server.mjs, which COPIES the downloaded
        # artifact (clawbench-server/clawbench.exe) into assets/server/ for
        # electron-builder. It never rebuilds: that copy carries the embedded
        # frontend and the release's version stamp, both produced exactly once
        # by build-windows.
        run: |
          cd desktop
          npm ci
          npm run build

      - name: Strip the server for the thin package (Windows)
        if: env.NEEDS_BUILD == 'true'
        # The thin package connects to a server elsewhere. Keeping the 150MB
        # binary here would silently turn every Windows desktop install into the
        # embedded one. The fused package is assembled from this zip plus the
        # server artifact below, so both variants are produced on every release
        # — including the ones where the desktop shell itself is reused from a
        # previous tag.
        shell: pwsh
        run: |
          $dir = "$PWD/desktop/release/win-unpacked/server"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          if (Test-Path $dir) { throw "failed to strip $dir from the thin package" }

      - name: Zip desktop (Windows)
        if: env.NEEDS_BUILD == 'true'
        # The trailing `/*` is load-bearing: `-Path <dir>` would put a
        # `win-unpacked/` level inside the archive, so unzipping the release
        # would give users a pointless extra folder. With the wildcard the
        # directory's contents land at the archive root (subdirectories are
        # still included recursively).
        #
        # Unlike `zip -r`, this is not an equivalent-command swap: it changes
        # what the archive looks like, which is exactly the point.
        shell: pwsh
        run: Compress-Archive -Path desktop/release/win-unpacked/* -DestinationPath "desktop/release/clawbench-desktop-windows-x64-$env:RELEASE_TAG.zip"

      - name: Assemble fused desktop (Windows)
        # Thin zip + the server at the app root = the "all-in-one" package. Doing
        # it from the zip (rather than the unpacked dir) is what lets a release
        # that REUSED the previous shell still ship a fused package: the shell is
        # byte-identical to the thin one, only `server/` differs.
        #
        # .NET's ZipFile, not Compress-Archive: the latter's `*` glob skips
        # hidden entries, and `resources/` contains dotfiles (cpu-features'
        # .eslintrc.js) that must survive the round trip.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $thin = "$PWD/desktop/release/clawbench-desktop-windows-x64-$env:RELEASE_TAG.zip"
          $fusedDir = "$PWD/desktop/release/fused-unpacked"
          $out = "$PWD/desktop/release/clawbench-desktop-windows-x64-local-$env:RELEASE_TAG.zip"
          if (Test-Path $fusedDir) { Remove-Item -Recurse -Force $fusedDir }
          if (Test-Path $out) { Remove-Item -Force $out }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($thin, $fusedDir)
          New-Item -ItemType Directory -Force -Path "$fusedDir/server" | Out-Null
          Copy-Item "$PWD/clawbench-server/clawbench.exe" "$fusedDir/server/clawbench.exe"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($fusedDir, $out)
          Remove-Item -Recurse -Force $fusedDir

      - name: Verify full package (Windows)
        if: env.NEEDS_BUILD == 'true'
        # A `*` glob that silently drops the executable is the realistic
        # failure mode here, so assert it explicitly.
        shell: pwsh
        run: |
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/desktop/release/clawbench-desktop-windows-x64-$env:RELEASE_TAG.zip")
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains 'clawbench-desktop.exe') { throw 'full package is missing the desktop executable' }
            if ($names -match 'payload') { throw 'full package contains payload artifacts' }
            Write-Host "full package OK: $($names.Count) entries"
          } finally { $zip.Dispose() }

      - name: Verify fused package (Windows)
        # Runs on BOTH paths: the fused package is assembled unconditionally, so
        # a release that reused the shell still has one to check.
        #
        # The fused package is the one feature that is invisible until launch:
        # without the binary the app opens to an error dialog every time. Assert
        # the server is at the archive root (extraFiles), not under resources/.
        shell: pwsh
        run: |
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/desktop/release/clawbench-desktop-windows-x64-local-$env:RELEASE_TAG.zip")
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains 'server/clawbench.exe') { throw 'fused package is missing server/clawbench.exe' }
            if ($names -contains 'resources/server/clawbench.exe') { throw 'fused package put the server under resources/' }
            Write-Host "fused package OK: $($names.Count) entries"
          } finally { $zip.Dispose() }

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            desktop/release/clawbench-desktop-windows-x64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-windows-x64-local-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-zip
          path: |
            desktop/release/clawbench-desktop-windows-x64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-windows-x64-local-${{ env.RELEASE_TAG }}.zip

  build-desktop-macos:
    name: Build Desktop macOS
    # Gate on lint + tests like every other build job. Without this the
    # desktop packages were the only ones that could reach npm while the
    # rest of the release was still failing its checks.
    needs: [test, client-guard]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to rebuild
        # Defaults to the guard's decision; the reuse step below flips it
        # back to true if the previous artifact cannot be fetched, so a
        # broken mirror degrades to a slow release rather than a missing
        # package.
        shell: bash
        run: echo "NEEDS_BUILD=${{ needs.client-guard.outputs.desktop_changed }}" >> "$GITHUB_ENV"

      - name: Reuse the previous release's desktop build
        if: env.NEEDS_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ needs.client-guard.outputs.desktop_source }}
        shell: bash
        run: |
          if ./scripts/lib/reuse-client-artifact.sh desktop \
               clawbench-desktop-darwin-arm64 \
               "$SOURCE_TAG" \
               "desktop/release/clawbench-desktop-darwin-arm64-${RELEASE_TAG}.zip" && \
             ./scripts/lib/reuse-client-artifact.sh desktop \
               clawbench-desktop-darwin-x64 \
               "$SOURCE_TAG" \
               "desktop/release/clawbench-desktop-darwin-x64-${RELEASE_TAG}.zip"; then
            echo "reusing the desktop build from $SOURCE_TAG (client protocol unchanged)"
          else
            echo "::warning::could not reuse the desktop build from $SOURCE_TAG; rebuilding instead"
            echo "NEEDS_BUILD=true" >> "$GITHUB_ENV"
          fi


      - uses: actions/setup-node@v4
        if: env.NEEDS_BUILD == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@v5
        if: env.NEEDS_BUILD == 'true'
        with:
          go-version: '1.25'

      - name: Set desktop version from tag
        if: env.NEEDS_BUILD == 'true'
        # desktop/package.json keeps a placeholder version (0.1.0) in the repo.
        # app.getVersion() reads it, and the updater compares that against the
        # version published to npm — so leaving it unset makes every startup
        # report an available update and re-download the tarball forever.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "desktop version set to $VERSION"

      - name: Install desktop deps
        if: env.NEEDS_BUILD == 'true'
        run: |
          cd desktop
          npm ci

      - name: Set macOS signing cert env (only if secret exists)
        if: env.NEEDS_BUILD == 'true'
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        # NOTE: `secrets` is not allowed in step `if:` conditions (workflow
        # fails to parse). Check for an empty secret inside the script instead.
        run: |
          if [ -n "$MAC_CERT" ]; then
            echo "CSC_LINK=$MAC_CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build desktop (macOS arm64 + x64)
        if: env.NEEDS_BUILD == 'true'
        # CSC_LINK is only set when the MAC_CERT secret exists (see step above).
        # Without it electron-builder skips signing (ad-hoc) instead of failing.
        run: |
          cd desktop
          # The remote-control helper is an extraResource for every platform's
          # package; without it electron-builder is asked to copy a missing file.
          node scripts/build-input-helper.mjs
          npx tsc -p tsconfig.json
          npx electron-builder --dir --arm64
          npx electron-builder --dir --x64

      - name: Zip desktop (macOS)
        if: env.NEEDS_BUILD == 'true'
        # DELIBERATELY still wraps the app in `mac-arm64/` / `mac/` — do NOT
        # flatten this like the Windows/Linux steps. The wrapper is what makes
        # the archive distinguishable from one whose top level is
        # `ClawBench.app/`.
        #
        # Why that matters: install.ts's extractZip strips the single
        # top-level directory every entry shares. Without the wrapper, the
        # shared top level IS `ClawBench.app/`, so the installer would strip
        # the app bundle itself and then fail to find the executable inside
        # it. Flattening this would also break self-upgrade for clients that
        # already shipped with the wrapper — they run the old installer,
        # which strips the wrapper unconditionally.
        run: |
          cd desktop/release
          zip -r "clawbench-desktop-darwin-arm64-${RELEASE_TAG}.zip" mac-arm64
          # electron-builder outputs the x64 (default-arch) build to `mac/`,
          # not `mac-x64/` — only non-default archs get an arch suffix.
          zip -r "clawbench-desktop-darwin-x64-${RELEASE_TAG}.zip" mac

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            desktop/release/clawbench-desktop-darwin-arm64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-darwin-x64-${{ env.RELEASE_TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-zip
          path: |
            desktop/release/clawbench-desktop-darwin-arm64-${{ env.RELEASE_TAG }}.zip
            desktop/release/clawbench-desktop-darwin-x64-${{ env.RELEASE_TAG }}.zip

  desktop-checksums:
    name: Desktop checksums
    # Collect the zips every desktop job uploaded, hash them, and attach one
    # SHA256SUMS to the release. The server reads that manifest and hands the
    # hashes to the client, which verifies each download.
    #
    # Each desktop job uploads its zip as a `desktop-*-zip` artifact precisely
    # so this job can see it: `action-gh-release` uploads straight to the
    # release and leaves no local artifact to hash. The reuse path uploads the
    # zip too, so a release that reused a shell still gets a checksum.
    needs: [build-desktop-linux, build-desktop-linux-arm64, build-desktop-windows, build-desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-zip
          path: desktop-zips
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          cd desktop-zips
          sha256sum *.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" desktop-zips/SHA256SUMS --clobber

  publish-npm:
    name: Publish to npm
    needs: [build-frontend, build-linux, build-linux-arm64, build-android-go, build-windows, build-macos-arm64, build-macos-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm trusted publishing. Without this the publish steps
      # have no credential at all and fail with a misleading 404.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # `registry-url` is deliberately NOT set: it makes setup-node write an
          # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and npm treats
          # that placeholder as a configured token, which defeats trusted
          # publishing (see the Configure step below).

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # 去掉 v 前缀（npm 语义化版本不允许 v 前缀）
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .clawbench-web/

      - name: Download Linux amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: pkg-linux/clawbench/

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-package
          path: pkg-linux-arm64/clawbench/

      - name: Download Android arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-package
          path: pkg-android-arm64/clawbench/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: pkg-windows/clawbench/

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-package
          path: pkg-mac-arm64/clawbench/

      - name: Download macOS amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-amd64-package
          path: pkg-mac-amd64/clawbench/

      - name: Assemble npm platform packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Assembling npm packages for version: $VERSION"

          # --- @xulongzhe/clawbench-linux-x64 ---
          PLATFORM_DIR="npm/platforms/linux-x64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-linux/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-linux-arm64 ---
          PLATFORM_DIR="npm/platforms/linux-arm64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-linux-arm64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-android-arm64 ---
          PLATFORM_DIR="npm/platforms/android-arm64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-android-arm64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-darwin-x64 ---
          PLATFORM_DIR="npm/platforms/darwin-x64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-mac-amd64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-darwin-arm64 ---
          PLATFORM_DIR="npm/platforms/darwin-arm64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-mac-arm64/clawbench/clawbench "$PLATFORM_DIR/bin/clawbench"
          chmod +x "$PLATFORM_DIR/bin/clawbench"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- @xulongzhe/clawbench-win32-x64 ---
          PLATFORM_DIR="npm/platforms/win32-x64"
          mkdir -p "$PLATFORM_DIR/bin"
          cp pkg-windows/clawbench/clawbench.exe "$PLATFORM_DIR/bin/clawbench.exe"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PLATFORM_DIR/package.json','utf8'));p.version='$VERSION';fs.writeFileSync('$PLATFORM_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          # --- Update main package ---
          MAIN_DIR="npm/main"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$MAIN_DIR/package.json','utf8'));p.version='$VERSION';for(const d in p.optionalDependencies)p.optionalDependencies[d]='$VERSION';fs.writeFileSync('$MAIN_DIR/package.json',JSON.stringify(p,null,2)+'\n')"

          echo "All npm packages assembled"

      - name: Configure npm registry for publishing
        # Auth is OIDC trusted publishing (see the job's `id-token: write`).
        # Two things must be true for npm to use it, and both are counterintuitive:
        #
        #  1. The project .npmrc sets registry=npmmirror, which project config
        #     makes outrank everything else. Rewriting it to registry.npmjs.org
        #     is what keeps the publish pointed at the public registry.
        #
        #  2. No token may be configured. npm tries a configured token first and
        #     only falls back to OIDC when there is none — and an .npmrc line of
        #     `_authToken=${NODE_AUTH_TOKEN}` counts as *configured* even when
        #     the variable is unset (the literal placeholder string is sent as
        #     the token). That is the usual cause of "trusted publishing is set
        #     up but publish still 404s", so setup-node's registry-url is left
        #     unset above and no NODE_AUTH_TOKEN is exported below.
        #
        # The rewrite targets the project .npmrc rather than
        # $NPM_CONFIG_USERCONFIG: that variable is only exported by setup-node
        # when `registry-url` is set, so with it removed the redirect would
        # expand to "" and the shell would fail with "No such file or
        # directory". A project .npmrc needs no env var and is read from the
        # working directory npm runs in.
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > .npmrc

      - name: Publish @xulongzhe/clawbench-linux-x64
        run: ./scripts/npm-publish-idempotent.sh ./npm/platforms/linux-x64 --access public

      - name: Publish @xulongzhe/clawbench-linux-arm64
        run: ./scripts/npm-publish-idempotent.sh ./npm/platforms/linux-arm64 --access public

      - name: Publish @xulongzhe/clawbench-android-arm64
        run: ./scripts/npm-publish-idempotent.sh ./npm/platforms/android-arm64 --access public

      - name: Publish @xulongzhe/clawbench-darwin-x64
        run: ./scripts/npm-publish-idempotent.sh ./npm/platforms/darwin-x64 --access public

      - name: Publish @xulongzhe/clawbench-darwin-arm64
        run: ./scripts/npm-publish-idempotent.sh ./npm/platforms/darwin-arm64 --access public

      - name: Publish @xulongzhe/clawbench-win32-x64
        run: ./scripts/npm-publish-idempotent.sh ./npm/platforms/win32-x64 --access public

      - name: Publish main package (@xulongzhe/clawbench)
        # Idempotent: skips a version already on the registry, and treats a
        # concurrent run's win as success. On v0.121.0 this step reported
        # failure with `E409 ... previously staged version` while npm ended up
        # carrying 0.121.0 anyway — a red job for a release that shipped.
        run: ./scripts/npm-publish-idempotent.sh ./npm/main --access public

  sync-npmmirror:
    name: Sync npmmirror
    # 国内用户默认走 npmmirror，而镜像并不总是自己跟上：v0.132.0 发布后，
    # 主包和 android 包已是 0.132.0，但 linux-x64 / linux-arm64 / darwin-* /
    # win32-x64 五个平台包全停在 0.131.0。主包的 optionalDependencies 指向
    # 新版本，从镜像装的人直接拉不到对应平台包——装不上，且没有任何提示。
    #
    # 所以发布完要主动催一次同步，并等到「元数据 + tarball 都可用」才算完。
    # 单独成 job：失败只让流水线变红，已经发出去的包不受影响，重跑这一个
    # job 就能补齐（脚本本身幂等）。
    needs: [publish-npm]
    runs-on: ubuntu-latest
    # 脚本内部有统一的等待窗口（默认 10 分钟），加上每个包一次 tarball 探测，
    # 这里再兜一层防止卡死。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # npm 语义化版本不允许 v 前缀。
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Trigger and wait for mirror sync
        run: |
          ./scripts/npmmirror-sync.sh "${{ steps.version.outputs.VERSION }}" \
            @xulongzhe/clawbench \
            @xulongzhe/clawbench-linux-x64 \
            @xulongzhe/clawbench-linux-arm64 \
            @xulongzhe/clawbench-android-arm64 \
            @xulongzhe/clawbench-darwin-x64 \
            @xulongzhe/clawbench-darwin-arm64 \
            @xulongzhe/clawbench-win32-x64

  release-notes:
    name: Generate Release Notes
    needs: [build-linux, build-linux-arm64, build-android-go, build-windows, build-macos-arm64, build-macos-amd64, build-android, docker, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating default notes"
            gh release edit "$TAG" --generate-notes
            exit 0
          fi

          NOTES=""

          # Helper: extract categorized commits with hashes
          # Format: "hash subject" — strip conventional prefix for display

          # 🚀 Features
          FEATS=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ (feat|feature)\b" || true)
          if [ -n "$FEATS" ]; then
            NOTES="${NOTES}## 🚀 新特性\n\n"
            while IFS= read -r line; do
              HASH=$(echo "$line" | cut -d' ' -f1)
              DESC=$(echo "$line" | sed -E 's/^[0-9a-f]+ (feat|feature)(\(.+\))?:\s*//')
              NOTES="${NOTES}- ${DESC} (${HASH})\n"
            done <<< "$FEATS"
            NOTES="${NOTES}\n"
          fi

          # 🐛 Bug Fixes
          FIXES=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ fix\b" || true)
          if [ -n "$FIXES" ]; then
            NOTES="${NOTES}## 🐛 问题修复\n\n"
            while IFS= read -r line; do
              HASH=$(echo "$line" | cut -d' ' -f1)
              DESC=$(echo "$line" | sed -E 's/^[0-9a-f]+ fix(\(.+\))?:\s*//')
              NOTES="${NOTES}- 修复了 ${DESC} (${HASH})\n"
            done <<< "$FIXES"
            NOTES="${NOTES}\n"
          fi

          # ⚡ Performance
          PERFS=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ perf\b" || true)
          if [ -n "$PERFS" ]; then
            NOTES="${NOTES}## ⚡ 性能优化\n\n"
            while IFS= read -r line; do
              HASH=$(echo "$line" | cut -d' ' -f1)
              DESC=$(echo "$line" | sed -E 's/^[0-9a-f]+ perf(\(.+\))?:\s*//')
              NOTES="${NOTES}- ${DESC} (${HASH})\n"
            done <<< "$PERFS"
            NOTES="${NOTES}\n"
          fi

          # 🔧 Internal
          INTERNAL=$(git log "${PREV_TAG}..${TAG}" --format="%h %s" | grep -iE "^[0-9a-f]+ (refactor|chore|style|ci|build)\b" || true)
          if [ -n "$INTERNAL" ]; then
            NOTES="${NOTES}## 🔧 内部改进\n\n"
            COUNT=$(echo "$INTERNAL" | wc -l)
            NOTES="${NOTES}- ${COUNT} 项内部改进（重构、依赖更新、代码风格等）\n\n"
          fi

          # 💥 Breaking Changes
          BREAKING=$(git log "${PREV_TAG}..${TAG}" --format="%B" | grep -i "BREAKING CHANGE" || true)
          if [ -n "$BREAKING" ]; then
            NOTES="${NOTES}## 💥 破坏性变更\n\n"
            NOTES="${NOTES}${BREAKING}\n\n"
          fi

          NOTES="${NOTES}---\n\n**完整变更日志**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}\n"

          printf '%b\n' "$NOTES" > /tmp/release-notes.md

          # 安装脚本的 sha256 写进 Release 说明：落地页不提供校验值（脚本由
          # workflow 从同一个 checkout 复制过去，页面自己算既不权威也容易与用户
          # 下载到的字节不一致），发布方给出的这份才是唯一可信来源。
          # 这个步骤没有 working-directory，路径就是仓库根。
          # 两个空格是关键：`sha256sum -c` 只认 `<hash>  <file>` 这种格式，
          # 写成 `sha256(x) = <hash>` 用户还得自己拼。
          {
            echo ''
            echo '## 🔐 一键安装脚本校验值'
            echo ''
            echo '普通校验（通过后再执行）：'
            echo ''
            echo '```bash'
            echo 'curl -fsSL https://clawbench.pages.dev/install.sh -o install.sh'
            echo 'sha256sum -c <<\EOF'
            echo "$(sha256sum scripts/install.sh | sed 's#scripts/##')"
            echo 'EOF'
            echo 'bash install.sh'
            echo '```'
            echo ''
            echo 'Windows（先存成 install.ps1）：以下哈希应一致'
            echo ''
            echo '```'
            echo "$(sha256sum scripts/install.ps1 | sed 's#scripts/##')"
            echo '```'
            echo ''
            echo '```powershell'
            echo '(Get-FileHash .\install.ps1 -Algorithm SHA256).Hash.ToLower()'
            echo '```'
            echo ''
            echo '注意：脚本默认安装**最新版**，两次运行装到的版本可能不同；需要可复现'
            echo '请传 `CLAWBENCH_VERSION`（Windows 用 `$env:CLAWBENCH_VERSION`）。'
            echo ''
          } >> /tmp/release-notes.md

          gh release edit "$TAG" --notes-file /tmp/release-notes.md
