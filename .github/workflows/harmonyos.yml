name: HarmonyOS

on:
  pull_request:
    paths:
      - 'harmony/**'
      - 'scripts/build-harmonyos.ps1'
      - '.github/workflows/harmonyos.yml'
  push:
    paths:
      - 'harmony/**'
      - 'scripts/build-harmonyos.ps1'
      - '.github/workflows/harmonyos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: HarmonyOS host contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: harmony/package-lock.json
      - run: npm ci --prefix harmony
      - run: npm --prefix harmony test
