<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="一款专为移动端设计的轻量级代码和文档工作台">

    <!-- Resolve theme BEFORE CSS loads to prevent white flash on dark mode.
         Reads from localStorage (clawbench-settings-theme or legacy 'theme' key).
         Must run synchronously before any rendering to avoid a single white frame. -->
    <script>
      (function() {
        var t = null;
        try { var s = localStorage.getItem('clawbench-settings-theme'); if (s) t = JSON.parse(s); } catch {}
        if (t === null) { try { t = localStorage.getItem('theme'); } catch {} }
        if (t === null || t === 'auto') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ClawBench">

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/logo-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/logo-512.png">

    <title>ClawBench</title>

    <!-- Application CSS -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/wide-screen.css">
    <link rel="stylesheet" href="/css/markdown-common.css">
    <link rel="stylesheet" href="/css/code-block.css">
    <link rel="stylesheet" href="/css/code-block-header.css">
    <link rel="stylesheet" href="/css/content.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- Unregister any leftover Service Worker from previous builds.
         A stale SW caches old assets and can intercept API requests, breaking
         authentication (cookies) and causing 403 errors on all /api/* calls. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
        if (window.caches && window.caches.keys) {
          window.caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              window.caches.delete(keys[i]);
            }
          });
        }
      }
    </script>
</body>
</html>
