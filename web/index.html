<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#161b22">
    <meta name="description" content="一款专为移动端设计的轻量级代码和文档工作台">

    <!-- Resolve theme BEFORE CSS loads to prevent flash of default colors.
         Reads from localStorage (clawbench-settings-theme or legacy 'theme' key).
         Migrates old 'light'/'dark' values to new named theme IDs.
         Sets data-theme (theme ID), data-theme-base (light|dark), data-hljs-theme.
         Must run synchronously before any rendering to avoid a single white frame. -->
    <script>
      (function() {
        var DARK_IDS = ['github-dark','one-dark-pro','catppuccin-mocha','dracula','nord','tokyo-night','solarized-dark','gruvbox-dark','high-contrast-dark','night-owl','ayu-dark','shades-of-purple','vitesse-dark'];
        var t = null;
        try { var s = localStorage.getItem('clawbench-settings-theme'); if (s) t = JSON.parse(s); } catch {}
        if (t === null) { try { t = localStorage.getItem('theme'); } catch {} }
        // Migration: old 'light'/'dark' → named theme IDs
        if (t === 'light') { t = 'github-light'; try { localStorage.setItem('clawbench-settings-theme', JSON.stringify('github-light')); } catch {} }
        else if (t === 'dark') { t = 'github-dark'; try { localStorage.setItem('clawbench-settings-theme', JSON.stringify('github-dark')); } catch {} }
        // Remove stale accent color key
        try { localStorage.removeItem('clawbench-settings-accentColor'); } catch {}
        if (!t || t === 'auto') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'github-dark' : 'github-light';
        }
        var base = DARK_IDS.indexOf(t) >= 0 ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-theme-base', base);
        document.documentElement.setAttribute('data-hljs-theme', base);
        // Update meta theme-color for Android WebView status bar
        var SB_COLORS = {'github-light':'#f8f9fa','github-dark':'#161b22','one-dark-pro':'#21252b','catppuccin-mocha':'#181825','catppuccin-latte':'#e6e9ef','dracula':'#21222c','nord':'#3b4252','tokyo-night':'#16161e','solarized-dark':'#073642','solarized-light':'#eee8d5','gruvbox-dark':'#1d2021','gruvbox-light':'#f2e5bc','high-contrast-dark':'#0a0a0a','high-contrast-light':'#f5f5f5','night-owl':'#001122','ayu-dark':'#0d1017','shades-of-purple':'#2d2b55','vitesse-dark':'#181818'};
        var metaTC = document.querySelector('meta[name="theme-color"]');
        if (metaTC) metaTC.setAttribute('content', SB_COLORS[t] || '#161b22');
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ClawBench">

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/logo-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/logo-512.png">

    <title>ClawBench</title>

    <!-- Application CSS -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/wide-screen.css">
    <link rel="stylesheet" href="/css/markdown-common.css">
    <link rel="stylesheet" href="/css/code-block.css">
    <link rel="stylesheet" href="/css/code-block-header.css">

    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- Unregister any leftover Service Worker from previous builds.
         A stale SW caches old assets and can intercept API requests, breaking
         authentication (cookies) and causing 403 errors on all /api/* calls. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
        if (window.caches && window.caches.keys) {
          window.caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              window.caches.delete(keys[i]);
            }
          });
        }
      }
    </script>
</body>
</html>
