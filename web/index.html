<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#161b22">
    <meta name="description" content="一款专为移动端设计的轻量级代码和文档工作台">

    <!-- Resolve theme BEFORE CSS loads to prevent flash of default colors.
         Reads from localStorage (clawbench-settings-theme or legacy 'theme' key).
         Migrates old 'light'/'dark' values to new named theme IDs.
         Sets data-theme (theme ID), data-theme-base (light|dark), data-hljs-theme.
         Must run synchronously before any rendering to avoid a single white frame.

         On a brand-new install the factory theme is gruvbox-dark, but the server
         flag that confirms a fresh install (config.first_run) is not available
         this early. So an empty localStorage — which only a first-ever visit can
         have — is used as a guess, and 'clawbench-fresh-theme-guess' records it so
         useSettingsConfig can revert if the server turns out to be pre-existing. -->
    <script>
      (function() {
        var DARK_IDS = ['solarized-dark','monokai','material-darker','dark-plus','bluloco-dark','nord','everforest-dark','one-dark-pro','dracula','rose-pine','gruvbox-dark','solarized-deep','github-dark','catppuccin-mocha','vitesse-dark','tokyo-night','kanagawa','ayu-dark','night-owl','high-contrast-dark'];
        var GUESS_KEY = 'clawbench-fresh-theme-guess';
        var t = null;
        try { var s = localStorage.getItem('clawbench-settings-theme'); if (s) t = JSON.parse(s); } catch {}
        if (t === null) { try { t = localStorage.getItem('theme'); } catch {} }
        // Migration: old 'light'/'dark' → named theme IDs
        if (t === 'light') { t = 'github-light'; try { localStorage.setItem('clawbench-settings-theme', JSON.stringify('github-light')); } catch {} }
        else if (t === 'dark') { t = 'github-dark'; try { localStorage.setItem('clawbench-settings-theme', JSON.stringify('github-dark')); } catch {} }
        // Remove stale accent color key
        try { localStorage.removeItem('clawbench-settings-accentColor'); } catch {}
        if (!t || t === 'auto') {
          var freshVisit = false;
          try { freshVisit = localStorage.length === 0; } catch {}
          if (freshVisit) {
            // First-ever visit: assume a fresh install and use the factory theme.
            t = 'gruvbox-dark';
            try { localStorage.setItem(GUESS_KEY, '1'); } catch {}
          } else {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'github-dark' : 'github-light';
          }
        }
        var base = DARK_IDS.indexOf(t) >= 0 ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-theme-base', base);
        document.documentElement.setAttribute('data-hljs-theme', base);
        // Update meta theme-color for Android WebView status bar
        var SB_COLORS = {'one-light':'#f0f0f0','ayu-light':'#f3f3f3','github-light':'#f8f9fa','light-modern':'#f3f3f3','light-plus':'#f5f5f5','quiet-light':'#ececec','vitesse-light':'#f6f6f4','bluloco-light':'#edf1f7','material-lighter':'#f0f0f0','alabaster':'#eeeeee','everforest-light':'#f2e9d0','high-contrast-light':'#f5f5f5','nord-light':'#e5e9f0','catppuccin-latte':'#e6e9ef','solarized-light':'#eee8d5','gruvbox-light':'#f2e5bc','solarized-dark':'#0a3541','monokai':'#272822','material-darker':'#212121','dark-plus':'#1e1e1e','bluloco-dark':'#1d212c','nord':'#202833','everforest-dark':'#22282b','one-dark-pro':'#21252b','dracula':'#21222c','rose-pine':'#1f1d2e','gruvbox-dark':'#1d2021','solarized-deep':'#15212b','github-dark':'#161b22','catppuccin-mocha':'#181825','vitesse-dark':'#181818','tokyo-night':'#16161e','kanagawa':'#16161d','ayu-dark':'#0d1017','night-owl':'#001122','high-contrast-dark':'#0a0a0a'};
        var metaTC = document.querySelector('meta[name="theme-color"]');
        if (metaTC) metaTC.setAttribute('content', SB_COLORS[t] || '#161b22');
      })();
    </script>

    <!-- Apply configured open-source font stacks BEFORE CSS loads to avoid a
         flash of the default font. Reads the same prefixed localStorage keys
         as utils/fontConfig.ts (clawbench-settings-fontMono / -fontUi) and
         sets --font-mono / --font-ui on <html>. Default values stored as
         'default' are left untouched so the CSS variables in variables.css
         keep their fallback stacks. -->
    <script>
      (function() {
        function readFontChoice(key) {
          try { var s = localStorage.getItem(key); if (s) { var v = JSON.parse(s); if (typeof v === 'string' && v) return v; } } catch (e) {}
          return 'default';
        }
        function quoteFamily(name) {
          return /\s/.test(name) ? "'" + name + "'" : name;
        }
        var MONO_DEFAULT = "'SF Mono', Monaco, 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', Consolas, 'Liberation Mono', monospace";
        var UI_DEFAULT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif";
        function fontStack(main, fb, dflt) {
          var parts = [];
          if (main && main !== 'default') parts.push(quoteFamily(main));
          if (fb && fb !== 'default' && fb !== main) parts.push(quoteFamily(fb));
          if (parts.length === 0) return dflt;
          return parts.join(', ') + ', ' + dflt;
        }
        var mono = readFontChoice('clawbench-settings-fontMono');
        var monoFb = readFontChoice('clawbench-settings-fontMonoFallback');
        var ui = readFontChoice('clawbench-settings-fontUi');
        var uiFb = readFontChoice('clawbench-settings-fontUiFallback');
        document.documentElement.style.setProperty('--font-mono', fontStack(mono, monoFb, MONO_DEFAULT));
        document.documentElement.style.setProperty('--font-ui', fontStack(ui, uiFb, UI_DEFAULT));
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ClawBench">

    <!-- Web app manifest — drives installability. Lives in publicDir
         (assets/manifest.json), so Vite copies it verbatim and leaves this href
         alone; a manifest URL must be stable, since it is the app's identity.
         Its icon URLs are absolute (/assets/...), so the served location does
         not matter — only this link target does. -->
    <link rel="manifest" href="/manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/logo-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/logo-512.png">

    <title>ClawBench</title>

    <!-- Application CSS -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/wide-screen.css">
    <link rel="stylesheet" href="/css/markdown-common.css">
    <link rel="stylesheet" href="/css/code-block.css">
    <link rel="stylesheet" href="/css/code-block-header.css">
    <link rel="stylesheet" href="/css/content.css">
    <link rel="stylesheet" href="/css/media-block.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/diff-rows.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
