<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#161b22">

    <!-- Resolve theme BEFORE CSS loads to prevent flash of default colors. -->
    <script>
      (function() {
        var DARK_IDS = ['solarized-dark','monokai','material-darker','dark-plus','bluloco-dark','nord','everforest-dark','one-dark-pro','dracula','rose-pine','gruvbox-dark','solarized-deep','github-dark','catppuccin-mocha','vitesse-dark','tokyo-night','kanagawa','ayu-dark','night-owl','high-contrast-dark'];
        var t = null;
        try { var s = localStorage.getItem('clawbench-settings-theme'); if (s) t = JSON.parse(s); } catch {}
        if (t === null) { try { t = localStorage.getItem('theme'); } catch {} }
        if (t === 'light') { t = 'github-light'; }
        else if (t === 'dark') { t = 'github-dark'; }
        if (!t || t === 'auto') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'github-dark' : 'github-light';
        }
        var base = DARK_IDS.indexOf(t) >= 0 ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-theme-base', base);
        document.documentElement.setAttribute('data-hljs-theme', base);
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>ClawBench Share</title>
    <style>
      /* Share SPA: full-viewport read-only container */
      html, body, #app {
        height: 100%;
        margin: 0;
      }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/share/main.ts"></script>
</body>
</html>
