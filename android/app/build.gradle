plugins {
    id 'com.android.application'
    id 'jacoco'
}

/**
 * Auto-generate versionName when not provided via -PversionName.
 * Uses `git describe --tags --always` to match the format used by build.sh
 * for the Go backend, so APK and server versions are directly comparable.
 * Examples: v1.0.0, v0.30.0-30-g830bb6c, a0f87a96
 */
def autoVersionName() {
    if (project.hasProperty('versionName')) return project.property('versionName')
    try {
        def version = 'git describe --tags --always'.execute([], rootDir).text.trim()
        return version ?: "dev"
    } catch (Exception e) {
        return "dev"
    }
}

/**
 * Auto-generate versionCode when not provided via -PversionCode.
 *
 * Mirrors the LOCAL path of scripts/lib/version-code.sh — that script is the
 * single source of truth; this is only the fallback for a bare
 * `./gradlew assembleRelease` that does not pass -PversionCode (build.sh and
 * CI always pass it, and CI uses the script's --tag-only mode).
 *
 *     versionCode = major*100000000 + minor*100000 + patch*1000 + distance
 *
 * derived from `git describe --tags --long --match 'v[0-9]*'`, so a developer
 * build between two releases carries a non-zero `distance` and stays ordered
 * against both. The previous implementation used `git rev-list --count HEAD`,
 * which silently collapses to 1 under a shallow clone — and actions/checkout
 * defaults to depth=1, so every released APK shipped versionCode=1 and could
 * not replace an older dev build.
 *
 * Fail-open to 1 when no version tag is reachable; a version outside the
 * supported range is a hard error (see version-code.sh for the rationale).
 */
def autoVersionCode() {
    if (project.hasProperty('versionCode')) return project.property('versionCode').toInteger()
    try {
        def desc = 'git describe --tags --long --match v[0-9]*'.execute([], rootDir).text.trim()
        def m = desc =~ /^v(\d+)\.(\d+)\.(\d+)-(\d+)-g[0-9a-f]+$/
        if (!m.matches()) return 1
        int major = m[0][1] as int
        int minor = m[0][2] as int
        int patch = m[0][3] as int
        int distance = m[0][4] as int
        if (major > 20) throw new GradleException("versionCode: major=$major exceeds the supported maximum (20)")
        if (minor > 999) throw new GradleException("versionCode: minor=$minor exceeds the supported maximum (999)")
        if (patch > 99) throw new GradleException("versionCode: patch=$patch exceeds the supported maximum (99)")
        if (distance > 999) {
            logger.warn("versionCode: distance=$distance since $desc clamped to 999")
            distance = 999
        }
        return major * 100000000 + minor * 100000 + patch * 1000 + distance
    } catch (GradleException e) {
        throw e
    } catch (Exception e) {
        return 1
    }
}

android {
    namespace 'com.clawbench.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.clawbench.app"
        minSdk 24
        targetSdk 34
        versionCode autoVersionCode()
        versionName autoVersionName()

    }

    signingConfigs {
        release {
            // CI: read from environment variables; Local: fallback to keystore file
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            storeFile keystoreFile ? file(keystoreFile) : file('../clawbench.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'clawbench123'
            keyAlias System.getenv("KEY_ALIAS") ?: 'clawbench'
            keyPassword System.getenv("KEY_PASSWORD") ?: 'clawbench123'
        }
    }

    applicationVariants.all { variant ->
        // Debug: use different applicationId so it can coexist with release
        if (variant.buildType.name == "debug") {
            variant.outputs.all { output ->
                outputFileName = "clawbench-android-debug.apk"
            }
        }
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                outputFileName = "clawbench-android.apk"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
            testCoverageEnabled true
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                jvmArgs '--add-opens', 'java.base/sun.misc=ALL-UNNAMED'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.github.mwiede:jsch:0.2.16'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    // Real org.json implementation for unit tests (android.jar stubs return defaults with returnDefaultValues=true)
    testImplementation 'org.json:json:20231013'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    def excludes = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*',
        '**/Manifest*.*'
    ]
    classDirectories.setFrom(files([
        fileTree(dir: "$buildDir/intermediates/javac/debug/classes",
                 excludes: excludes)
    ]))
    sourceDirectories.setFrom(files(['app/src/main/java']))
    executionData.setFrom(files(["$buildDir/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"]))
}
